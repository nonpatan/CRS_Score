<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>งานประเมินของฉัน — CRS MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2a2e; --muted:#5f6b70; --line:#dfe4e3; --teal:#0f6e56; --teal-soft:#e1f5ee;
    --bg:#f7f8f7; --white:#ffffff; --danger:#a32d2d; --danger-soft:#fceaea;
    --amber:#8a5a00; --amber-soft:#fff4df; }
  * { box-sizing:border-box; }
  body { font-family:"Sarabun",sans-serif; color:var(--ink); background:var(--bg); margin:0; padding:16px; font-size:16px; line-height:1.6; }
  /* ความกว้างระดับ "รายการ" (UI-STANDARD §6) · จอ ≥1200px ให้ app-shell จัด workspace เอง
     ⛔ ห้ามใส่ max-width ให้ main.academic-content — เคยทับ workspace จนเนื้อหาลอยกลางจอ (ผู้ใช้ทักว่า "เล็ก แปลก") */
  .wrap { max-width:760px; margin:0 auto; }
  .eval-layout { display:grid; grid-template-columns:minmax(0,1fr); gap:0; align-items:start; }
  .eval-side .card { margin-bottom:16px; }
  @media (min-width:1200px) {
    .eval-layout { grid-template-columns:minmax(0,1fr) 300px; gap:20px; }
    .eval-side { position:sticky; top:16px; }
  }
  h1 { font-size:22px; margin:4px 0; } h2 { font-size:18px; margin:0 0 8px; } h3 { font-size:16px; margin:0; }
  header p, .hint { color:var(--muted); } header p { margin:0 0 8px; font-size:14px; }
  .nav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:8px; background:var(--white);
    border:1px solid var(--line); border-radius:99px; margin-bottom:22px; }
  .nav a { color:var(--muted); text-decoration:none; padding:8px 12px; border-radius:99px; font-size:14px; }
  .nav a.active { color:var(--white); background:var(--teal); }
  .nav #btn-signout { margin-left:auto; color:var(--danger); }
  .card { background:var(--white); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; min-width:0; }
  .section { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:0 0 10px; }
  .hint { font-size:14px; margin:4px 0 10px; } .empty { color:var(--muted); padding:22px 10px; text-align:center; }
  .group { border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
  .group:first-of-type { border-top:0; padding-top:0; }
  .task { display:flex; align-items:center; gap:12px; border-top:1px solid var(--line); padding:12px 0; }
  .task:first-of-type { border-top:0; } .task-main { flex:1; min-width:0; }
  .task-main b { display:block; overflow-wrap:anywhere; } .task-main small { display:block; color:var(--muted); font-size:13px; }
  .pill { display:inline-block; border-radius:99px; padding:2px 9px; background:var(--teal-soft); color:var(--teal); font-size:13px; }
  .pill.warn { background:var(--amber-soft); color:var(--amber); }
  .action { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:8px 13px;
    border-radius:8px; font-weight:600; color:var(--teal); background:var(--teal-soft); text-decoration:none; white-space:nowrap; }
  .action.primary { color:var(--white); background:var(--teal); }
  .round-meta { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:14px; }
  .shortcut { display:flex; align-items:center; gap:10px; min-height:52px; padding:8px 4px; border-top:1px solid var(--line);
    color:var(--ink); text-decoration:none; }
  .shortcut:first-of-type { border-top:0; } .shortcut span { flex:1; min-width:0; }
  .shortcut b { display:block; font-weight:600; } .shortcut small { display:block; color:var(--muted); font-size:13px; }
  .shortcut::after { content:"›"; color:var(--muted); font-size:22px; line-height:1; }
  .shortcut:hover b { color:var(--teal); }
  .tasks-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:0 0 4px; }
  .round-block { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
  .round-block:first-of-type { border-top:0; padding-top:0; margin-top:8px; }
  .round-block h3 { font-size:16px; }
  .tasks-head h2 { margin:0; } .tasks-head span { color:var(--muted); font-size:14px; }
  .empty b { display:block; color:var(--ink); font-size:16px; margin-bottom:4px; }
  .result-hero { background:var(--teal-soft); border-radius:9px; padding:12px; margin:10px 0; }
  .result-hero b { font-size:20px; color:var(--teal); } .result-table { width:100%; border-collapse:collapse; font-size:14px; }
  .result-table th,.result-table td { border-bottom:1px solid var(--line); padding:7px; text-align:left; }
  .result-table th { background:var(--bg); } .result-table td:last-child { text-align:right; }
  .result-card details { margin-top:12px; } .result-card summary { cursor:pointer; min-height:44px; padding:8px 0; }
  .result-card textarea { width:100%; min-height:86px; font:inherit; font-size:16px; padding:9px; border:1px solid var(--line); border-radius:8px; }
  .result-card button { font:inherit; min-height:44px; border:0; border-radius:8px; padding:8px 14px; background:var(--teal); color:var(--white); cursor:pointer; margin-top:8px; }
  a:focus-visible,button:focus-visible,textarea:focus-visible,summary:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:60; max-width:min(90vw,520px);
    padding:10px 16px; background:var(--danger); color:var(--white); border-radius:9px; opacity:0; pointer-events:none; }
  #toast.show { opacity:1; }
  @media (max-width:420px) { body { padding:12px; } .task { flex-wrap:wrap; } .task .action { width:100%; } }
</style>
<link rel="stylesheet" href="../app-shell.css?v=20261003-1">
</head>
<body>
<div class="wrap">
  <header>
    <h1>งานประเมินของฉัน</h1>
    <p>แบบประเมินที่ได้รับมอบหมาย และแบบประเมินตนเอง</p>
    <div class="nav">
      <a href="index.html">ภาพรวมบุคลากร</a>
      <a href="eval-my.html" class="active">งานประเมินของฉัน</a>
      <a href="my-work.html">ข้อมูลการทำงานของฉัน</a>
      <a href="#" id="btn-signout">ออกจากระบบ</a>
    </div>
    <script src="../app-shell.js?v=20261022-1"></script>
  </header>
  <main class="academic-content">
    <div id="app" class="card" role="status">กำลังโหลดงานประเมิน…</div>
    <div id="toast" role="alert" aria-live="polite"></div>
  </main>
</div>
<script type="module">
import { requireAuth, signOut, myStaffId, listMyEvalAssignments, countMyEvalResponses,
  listStaffPicker, loadEvalForm, evalSelfDueDate, thaiShortDateText, isPersonnelHead, getProfile,
  bangkokNow, toDateStr, listEvalRoundsICanSee, loadMyEvalResults, evalDecisionLabel,
  evalThaiDateStr, addWorkingDays, addDaysStr, loadEvalAppealHolidays, acknowledgeEvalResult
} from "../supabase-client.js?v=20261026-1";

const session = await requireAuth();
if (!session) {
  // requireAuth กำลังพาไปหน้าเข้าสู่ระบบ
} else {
  const app = document.getElementById("app");
  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[ch]);
  const submittedDay = value => value ? new Intl.DateTimeFormat("th-TH", {
    timeZone:"Asia/Bangkok", day:"numeric", month:"short", year:"numeric"
  }).format(new Date(value)) : "";
  document.getElementById("btn-signout").addEventListener("click", async event => {
    event.preventDefault(); await signOut();
  });
  try {
    const me = await myStaffId();
    if (!me) {
      app.innerHTML = "บัญชีนี้ยังไม่ได้ผูกกับทะเบียนบุคลากร ติดต่อฝ่ายบุคคล";
    } else {
      const data = await listMyEvalAssignments(me);
      const [visibleRounds, myResults] = await Promise.all([listEvalRoundsICanSee(), loadMyEvalResults()]);
      const mine = data.assignments.filter(row => row.rater_staff_id === me);
      const [staff, counts, head, profile] = await Promise.all([
        listStaffPicker(), countMyEvalResponses(mine.map(row => row.id)), isPersonnelHead(), getProfile(session.user.id)
      ]);
      const names = new Map(staff.map(row => [row.id, row.full_name]));
      const forms = new Map();
      for (const formId of new Set(data.rounds.map(round => round.form_id)))
        forms.set(formId, await loadEvalForm(formId));
      const targetById = new Map(data.targets.map(row => [row.id, row]));
      const today = toDateStr(bangkokNow());
      // 3 ส่วน: ผลของฉัน → งานที่ต้องประเมิน (งานหลักของหน้า) → ทางลัดผู้บริหาร (คอลัมน์ขวาบนจอคอม)
      let html = "", tasksHtml = "", taskCount = 0, leftCount = 0;
      const shortcuts = [];
      if (head || visibleRounds.length) shortcuts.push(["eval-result.html", "สรุปผลประเมิน", "ตาราง ก ข ค และยืนยันผลการพิจารณา"]);
      if (head) shortcuts.push(["eval-rounds.html", "รอบประเมิน", "เปิดรอบ จัดผู้ประเมิน และติดตามการส่ง"]);
      // Red Flag เห็นเฉพาะ admin (= ผอ.) — ไม่อยู่ในเมนูเพราะ hrOnly เปิดให้ทั้งฝ่ายบุคคล
      if (profile?.role === "admin") shortcuts.push(["red-flags.html", "บันทึก Red Flag", "เห็นเฉพาะผู้อำนวยการ"]);
      for (const item of myResults) {
        const decision = item.decision, computed = decision.computed;
        if (!computed) continue;
        let form = forms.get(item.round.form_id);
        if (!form) { form = await loadEvalForm(item.round.form_id); forms.set(item.round.form_id, form); }
        const publishedDay = evalThaiDateStr(item.round.published_at);
        const holidays = publishedDay ? await loadEvalAppealHolidays(publishedDay, addDaysStr(publishedDay, 30)) : new Set();
        const appeal = publishedDay ? addWorkingDays(publishedDay, Number(form.rules?.appeal_working_days || 7), holidays) : null;
        const committee = form.sections.find(row => row.kind === "committee");
        const committeeText = (committee?.text_fields || []).map(field => '<p><b>' + esc(field.label) + ':</b> ' +
          esc(item.committee_texts?.[field.key] || "—") + '</p>').join("");
        const parts = (computed.sections || []).filter(row => row.weight > 0);
        const starFails = (computed.stars || []).filter(row => row.fail);
        html += '<section class="card result-card" data-result="' + esc(item.target_id) + '"><h2>ผลประเมินของฉัน · ' +
          esc(item.round.academic_year + " ครั้งที่ " + item.round.round_no) + '</h2>' +
          '<div class="result-hero"><b>' + esc(evalDecisionLabel(decision.final)) + '</b><div>รวม ' +
          (computed.total == null ? "—" : Number(computed.total).toFixed(2)) + ' · ' + esc(computed.level || "—") +
          ' · ประกาศเมื่อ ' + esc(publishedDay ? thaiShortDateText(publishedDay) : "—") + '</div></div>' +
          '<table class="result-table"><thead><tr><th>ส่วน</th><th>เฉลี่ย</th><th>น้ำหนัก</th></tr></thead><tbody>' +
          parts.map(row => '<tr><td>' + esc(row.title) + (row.kind === "peer" ? " (ค่าเฉลี่ยเพื่อนครู)" : "") +
            '</td><td>' + (row.avg == null ? "—" : Number(row.avg).toFixed(2)) + '</td><td>' + esc(row.weight) + '%</td></tr>').join("") + '</tbody></table>' +
          (starFails.length ? '<h3>ข้อ ★ ที่ไม่ผ่าน</h3><p>' + esc(starFails.map(row => row.code + " " + row.label).join(" · ")) + '</p>' : "") +
          (decision.reason ? '<p><b>เหตุผลประกอบการพิจารณา:</b> ' + esc(decision.reason) + '</p>' : "") +
          committeeText + '<details><summary>ดูคะแนนรายข้อ</summary>' + parts.filter(row => ["committee","dept_head","peer"].includes(row.kind)).map(row =>
            '<h3>' + esc(row.title) + '</h3><table class="result-table"><tbody>' + (row.items || []).map(score =>
              '<tr><td>' + esc(score.code + " " + score.text) + '</td><td>' +
              (score.value == null ? "—" : Number(score.value).toFixed(2)) + '</td></tr>').join("") + '</tbody></table>').join("") + '</details>' +
          '<div class="group"><h3>รับทราบผล</h3><p class="hint">การลงนามเป็นการรับทราบผล ไม่ได้หมายความว่าเห็นด้วยกับผลการประเมิน</p>' +
          (appeal ? '<p>ไม่เห็นด้วยกับผล ติดต่อฝ่ายบุคคลภายใน ' + esc(Number(form.rules?.appeal_working_days || 7)) +
            ' วันทำการ (ถึง ' + esc(thaiShortDateText(appeal)) + ')</p>' : "") +
          '<p data-ack-status>' + (item.acknowledgement ? 'รับทราบเมื่อ ' + esc(submittedDay(item.acknowledgement.acknowledged_at)) + ' · แก้คำชี้แจงได้' : '') + '</p>' +
          '<label for="comment-' + esc(item.target_id) + '">คำชี้แจง (ไม่บังคับ)</label>' +
          '<textarea id="comment-' + esc(item.target_id) + '">' + esc(item.acknowledgement?.comment || "") + '</textarea>' +
          '<button type="button" data-ack="' + esc(item.target_id) + '">' +
          (item.acknowledgement ? "บันทึกคำชี้แจง" : "รับทราบผล") + '</button></div></section>';
      }
      for (const round of [...data.rounds].sort((a,b) => b.created_at.localeCompare(a.created_at))) {
        const assignments = mine.filter(row => targetById.get(row.target_id)?.round_id === round.id);
        if (!assignments.length) continue;
        const form = forms.get(round.form_id);
        const sections = [...form.sections].filter(section => assignments.some(row => row.section_code === section.code))
          .sort((a,b) => Number(b.kind === "self") - Number(a.kind === "self") || a.sort - b.sort);
        const left = assignments.filter(row => row.status !== "submitted").length;
        taskCount += assignments.length; if (round.status === "open") leftCount += left;
        let html = "";
        html += '<div class="round-block"><h3>' + esc(round.academic_year) + ' · ครั้งที่ ' + round.round_no + '</h3>' +
          '<div class="round-meta"><span>กำหนดส่ง ' + esc(round.due_date ? thaiShortDateText(round.due_date) : "ยังไม่กำหนด") +
          '</span><span>เหลือ ' + left + ' จาก ' + assignments.length + '</span></div>';
        for (const section of sections) {
          html += '<div class="group"><div class="section">' + esc(section.kind === "self" ? "ประเมินตนเอง" :
            "ส่วนที่ " + section.code + " · " + section.title) + '</div>';
          for (const row of assignments.filter(item => item.section_code === section.code)) {
            const target = targetById.get(row.target_id);
            const total = section.domains.reduce((sum, domain) => sum + domain.items.length, 0);
            const answered = counts[row.id] || 0;
            const selfDue = section.kind === "self" ? evalSelfDueDate(round, form.rules) : null;
            const due = selfDue || round.due_date;
            const submitted = row.status === "submitted";
            const closed = round.status !== "open";
            const overdue = !submitted && due && today > due;
            const status = submitted ? "ส่งแล้ว " + submittedDay(row.submitted_at) :
              closed ? "ปิดรับแล้ว — ติดต่อฝ่ายบุคคล" :
              answered ? "ร่าง " + answered + "/" + total : total + " ข้อ";
            const label = submitted || closed ? "ดู" : answered ? "ทำต่อ" : "เริ่ม";
            html += '<div class="task"><div class="task-main"><b>' +
              esc(section.kind === "self" ? "ของฉัน" : names.get(target.staff_id) || "ไม่พบชื่อ") + '</b>' +
              '<small>' + esc(status) + (selfDue ? ' · ส่งภายใน ' + esc(thaiShortDateText(selfDue)) : "") + '</small>' +
              (overdue && !closed ? '<span class="pill warn">เลยกำหนด</span>' : "") +
              (closed && !submitted ? '<span class="pill warn">ปิดรับแล้ว — ติดต่อฝ่ายบุคคล</span>' : "") +
              '</div><a class="action ' + (!submitted && !closed && !answered ? "primary" : "") +
              '" href="eval-fill.html?a=' + encodeURIComponent(row.id) + '">' + label + '</a></div>';
          }
          if (section.kind === "peer") html += '<p class="hint">ครูผู้รับการประเมินจะไม่เห็นว่าคุณให้คะแนนเท่าไร — เห็นแค่ค่าเฉลี่ยของเพื่อนครูทุกคน</p>';
          html += '</div>';
        }
        html += '</div>';
        tasksHtml += html;
      }
      // ข้อความสถานะงานต้องขึ้นเสมอ — เคยถูกซ่อนเมื่อมีการ์ดทางลัด ผู้บริหารเลยไม่รู้ว่าตัวเองมีงานไหม
      const tasksHead = '<div class="tasks-head"><h2>งานที่ต้องประเมิน</h2>' +
        (taskCount ? '<span>' + (leftCount ? 'ค้าง ' + leftCount + ' แบบ' : 'ส่งครบแล้ว') + '</span>' : '') + '</div>';
      const tasksEmpty = '<div class="empty">' + (data.rounds.length
        ? '<b>ไม่มีแบบประเมินที่ต้องกรอก</b>คุณไม่ได้เป็นผู้ประเมินในรอบที่เปิดอยู่'
        : '<b>ยังไม่มีรอบประเมินที่เปิด</b>ฝ่ายบุคคลจะจัดผู้ประเมินและแจ้งเมื่อเริ่มรอบ') + '</div>';
      const side = shortcuts.length ? '<section class="card"><div class="section">สำหรับผู้บริหาร</div>' +
        shortcuts.map(([href, title, hint]) => '<a class="shortcut" href="' + href + '"><span><b>' + esc(title) +
          '</b><small>' + esc(hint) + '</small></span></a>').join("") + '</section>' : "";
      app.className = "eval-layout";
      // งานทั้งหมดอยู่ในการ์ดเดียว — หัวข้อลอยนอกการ์ดจะไปทับแถบหัวสีเขียว (ส่วนที่การ์ดซ้อนขึ้นไป 54px) แล้วมองไม่เห็น
      app.innerHTML = '<div class="eval-main">' + html + '<section class="card tasks-card">' + tasksHead +
        (tasksHtml || tasksEmpty) + '</section></div>' +
        (side ? '<aside class="eval-side" aria-label="ทางลัดสำหรับผู้บริหาร">' + side + '</aside>' : "");
      app.addEventListener("click", async event => {
        const button = event.target.closest("[data-ack]"); if (!button) return;
        const card = button.closest(".result-card"); button.disabled = true;
        try {
          const saved = await acknowledgeEvalResult(button.dataset.ack, card.querySelector("textarea").value);
          card.querySelector("[data-ack-status]").textContent = "รับทราบเมื่อ " + submittedDay(saved.acknowledged_at) + " · แก้คำชี้แจงได้";
          button.textContent = "บันทึกคำชี้แจง";
        } catch (error) {
          document.getElementById("toast").textContent = error.message;
          document.getElementById("toast").classList.add("show");
        } finally { button.disabled = false; }
      });
    }
  } catch (error) {
    app.className = "card";
    app.textContent = error.message;
    document.getElementById("toast").textContent = error.message;
    document.getElementById("toast").classList.add("show");
  }
}
</script>
</body>
</html>
