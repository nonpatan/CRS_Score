</style><link rel="stylesheet" href="../app-shell.css?v=20261002-2"></head><body><div class="wrap"><header><h1>สั่งพิเศษ</h1><p>รับรายการวัดตัว สั่งร้าน รับของ และส่งมอบพร้อมตั้งหนี้</p><div class="nav"></div><script src="../app-shell.js?v=20261002-5"></script></header><main class="academic-content"><section id="access" class="card" hidden></section><div id="app" hidden><section class="card"><div class="toolbar"><div><label for="year">ปีการศึกษา</label><select id="year"></select></div><span class="hint">ใบค้างจากปีก่อนดูได้ใน “ทุกปีที่ยังไม่ปิด”</span></div><div id="tabs" class="tabs"></div><div id="bulk" class="toolbar"></div><div id="orders"></div><div id="totals" class="hint"></div></section></div><div id="toast" class="toast" hidden></div><div id="overlay" class="overlay" hidden><form id="action-form" class="modal"><h2 id="modal-title"></h2><p id="modal-note" class="hint"></p><div id="modal-fields"></div><div class="actions"><button id="modal-close" class="ghost" type="button">กลับ</button><button id="modal-save" class="primary" type="submit">ยืนยัน</button></div></form></div></main><section id="print-sheet" class="print-sheet"></section></div>
<script type="module">

document.getElementById("btn-signout")?.addEventListener("click", e => { e.preventDefault(); signOut(); });
const el=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]),money=n=>formatMoney(n,{minimumFractionDigits:0});
const statuses=["รอสั่ง","สั่งแล้ว","ของมาแล้ว","ส่งมอบแล้ว","ยกเลิก"];let years=[],orders=[],items=[],placements=[],charges=[],tab="รอสั่ง",action=null,ids=[],selected=new Set(),timer,currentYear="";
function toast(message,bad=false){const n=el("toast");n.textContent=message;n.classList.toggle("err",bad);n.hidden=false;clearTimeout(timer);timer=setTimeout(()=>n.hidden=true,9000)}
const itemOf=o=>items.find(i=>i.id===o.item_id),placeOf=o=>placements.find(p=>p.student_id===o.student_id&&p.year===o.year),studentOf=o=>placeOf(o)?.student;

function selectedOrders(){return orders.filter(o=>selected.has(o.id)&&o.status===tab)}
function render(){const counts=countSpecialOrdersByStatus(orders);el("tabs").innerHTML=statuses.map(s=>`<button type="button" data-tab="${s}" aria-selected="${s===tab}">${s} ${counts[s]}</button>`).join("");const rows=orders.filter(o=>o.status===tab);el("bulk").innerHTML=tab==="รอสั่ง"?'<div class="actions"><button class="primary" data-bulk="order">บันทึกว่าสั่งแล้ว</button><button class="ghost" data-bulk="print">พิมพ์ใบสั่งร้าน</button></div>':tab==="สั่งแล้ว"?'<button class="primary" data-bulk="arrive">ของมาแล้ว</button>':"";
const groups=groupSpecialOrdersByItem(rows.map(o=>({...o,...placeOf(o),student_number:studentOf(o)?.student_no})),items);el("orders").innerHTML=groups.map(g=>`<section class="group"><h3>${tab==="รอสั่ง"||tab==="สั่งแล้ว"?`<input type="checkbox" data-group="${g.item.id}" aria-label="เลือกทั้งกลุ่ม ${esc(g.item.display_name||"")}">`:""} ${esc(g.item.display_name||"ไม่พบสินค้า")} · ${g.orders.length} ใบ · รวม ${g.totalQty} ตัว ${tab==="รอสั่ง"?`<button class="ghost" data-print-group="${g.item.id}">พิมพ์ใบสั่งร้าน</button>`:""}</h3>${g.orders.map(o=>`<div class="row">${tab==="รอสั่ง"||tab==="สั่งแล้ว"?`<input type="checkbox" data-select="${o.id}" aria-label="เลือกใบสั่ง ${esc(person(o))}" ${selected.has(o.id)?"checked":""}>`:'<span></span>'}<div><b>${esc(person(o))}</b><div>${esc(g.item.display_name)} × ${o.qty} · ${esc(formatSpecialOrderSize(o))}</div>${o.measure_note?`<div class="meta">${esc(o.measure_note)}</div>`:""}${o.supplier?`<div class="meta">ร้าน ${esc(o.supplier)}</div>`:""}${o.doc_no?`<div class="meta">ใบส่งของ ${esc(o.doc_no)}</div>`:""}${o.ordered_at?`<div class="meta">สั่ง ${stamp(o.ordered_at)}</div>`:""}${o.delivered_at?`<div class="meta">ส่งมอบ ${stamp(o.delivered_at)}</div>`:""}${o.unit_cost!=null?`<div class="meta">ทุน/ตัว ${money(o.unit_cost)} · ราคาขาย/ตัว ${money(o.unit_price)} · ยอดหนี้ ${money(Number(o.unit_price)*o.qty)} · <span class="${Number(o.unit_price)<Number(o.unit_cost)?"negative":""}">กำไร ${money((Number(o.unit_price)-Number(o.unit_cost))*o.qty)}</span></div>`:""}${o.status==="ยกเลิก"?`<div class="meta">ยกเลิก: ${esc(o.cancel_reason)} ${o.arrived_at?'<span class="badge">ของค้างในคลัง</span>':""}</div>`:""}${o.status==="ส่งมอบแล้ว"&&charges.find(c=>c.id===o.charge_id)?.voided_at?'<span class="badge">หนี้ถูกยกเลิก</span>':""}</div><div class="actions">${tab==="รอสั่ง"?`<button class="danger" data-action="cancel" data-id="${o.id}">ยกเลิก</button>`:tab==="สั่งแล้ว"?`<button class="ghost" data-action="unorder" data-id="${o.id}">ยังไม่ได้สั่ง</button><button class="danger" data-action="cancel" data-id="${o.id}">ยกเลิก</button>`:tab==="ของมาแล้ว"?`<button class="ghost" data-action="price" data-id="${o.id}">แก้ราคาขาย</button><button class="primary" data-action="deliver" data-id="${o.id}">ส่งมอบ + ตั้งหนี้</button><button class="ghost" data-action="unarrive" data-id="${o.id}">ของยังไม่มา</button><button class="danger" data-action="cancel" data-id="${o.id}">ยกเลิก</button>`:""}</div></div>`).join("")}</section>`).join("")||'<p class="hint">ไม่มีรายการในสถานะนี้</p>';
if(tab==="ส่งมอบแล้ว"){const valid=rows.filter(o=>!charges.find(c=>c.id===o.charge_id)?.voided_at),cost=valid.reduce((s,o)=>s+Number(o.unit_cost)*o.qty,0),sale=valid.reduce((s,o)=>s+Number(o.unit_price)*o.qty,0);el("totals").textContent=`รวมต้นทุน ${money(cost)} · รวมขาย ${money(sale)} · รวมกำไร ${money(sale-cost)} บาท (ไม่รวมหนี้ที่ถูกยกเลิก)`}else el("totals").textContent=""}
async function load(){const scope=el("year").value;const query=()=>{let q=sb.from("special_orders").select("*");return scope==="open"?q.in("status",["รอสั่ง","สั่งแล้ว","ของมาแล้ว"]):q.eq("year",scope)};const [or,ir,cr]=await Promise.all([fetchAllRows(query,"id"),fetchAllRows(()=>sb.from("fee_items").select("id,display_name,group_name,sort_order,special_order"),"id"),fetchAllRows(()=>sb.from("student_charges").select("id,voided_at,special_order_id").not("special_order_id","is",null),"id")]);for(const r of [or,ir,cr])if(r.error)throw r.error;orders=or.data;items=ir.data;charges=cr.data;const needed=[...new Set(orders.map(o=>o.year))];const pr=await Promise.all(needed.map(year=>fetchAllRows(()=>sb.from("student_year_placements").select("student_id,year,grade_level,classroom,student:student_id(id,student_no,name)").eq("year",year),["student_id","year"])));for(const r of pr)if(r.error)throw r.error;placements=pr.flatMap(r=>r.data);selected.clear();if(!orders.some(o=>o.status===tab))tab=["รอสั่ง","สั่งแล้ว","ของมาแล้ว","ส่งมอบแล้ว","ยกเลิก"].find(s=>orders.some(o=>o.status===s))||"รอสั่ง";render()}
function open(type,orderIds){action=type;ids=orderIds;const one=orders.find(o=>o.id===ids[0]);const title={order:"บันทึกว่าสั่งแล้ว",arrive:"ของมาแล้ว",unorder:"ยังไม่ได้สั่ง",unarrive:"ของยังไม่มา",cancel:"ยกเลิกใบสั่ง",deliver:"ส่งมอบ + ตั้งหนี้",price:"แก้ราคาขาย"}[type];el("modal-title").textContent=title;el("modal-note").textContent=`${ids.length} ใบ${type==="cancel"&&one?.ordered_at?" · สั่งร้านไปแล้ว โรงเรียนจะต้องรับของไว้เอง":type==="unarrive"?" · ระบบจะหักของออกจากคลังและล้างต้นทุน/ราคาขาย":""}`;let html="";if(type==="order")html='<div class="field"><label for="supplier">ร้านที่สั่ง (ไม่บังคับ)</label><input id="supplier" maxlength="160"></div>';if(type==="cancel")html='<div class="field"><label for="reason">เหตุผลที่ยกเลิก</label><textarea id="reason" required maxlength="500"></textarea></div>';if(type==="arrive")html='<div class="field"><label for="doc">เลขที่ใบส่งของ (ไม่บังคับ)</label><input id="doc" maxlength="120"></div><div class="actions"><button class="ghost" type="button" data-copy="cost">ใช้ต้นทุนค่าเดียวกันทั้งหมด</button><button class="ghost" type="button" data-copy="price">ใช้ราคาขายค่าเดียวกันทั้งหมด</button></div>'+ids.map(id=>{const o=orders.find(x=>x.id===id);return`<div class="row"><b>${esc(person(o))} × ${o.qty}</b><div><label for="cost-${id}">ต้นทุน/ตัว</label><input id="cost-${id}" data-cost type="number" min="0" step="0.01" inputmode="decimal" required></div><div><label for="price-${id}">ราคาขาย/ตัว</label><input id="price-${id}" data-price type="number" min="0" step="0.01" inputmode="decimal" required></div><small id="profit-${id}" class="meta"></small></div>`}).join("");if(type==="price")html=`<div class="field"><label for="new-price">ราคาขาย/ตัว</label><input id="new-price" type="number" min="0" step="0.01" inputmode="decimal" value="${one.unit_price}" required></div><div id="price-profit" class="hint"></div>`;if(type==="deliver")html=`<p>ยอดหนี้ ${money(Number(one.unit_price)*one.qty)} บาท</p><div class="field"><label for="term">ภาคเรียน</label><select id="term" required><option value="1">ภาคเรียน 1</option><option value="2">ภาคเรียน 2</option></select></div>`;el("modal-fields").innerHTML=html;if(type==="deliver")el("term").value=academicTermOf(toDateStr(bangkokNow()),years)||"1";el("overlay").hidden=false;el("modal-save").focus();updateProfits()}
function updateProfits(){if(action==="arrive")for(const id of ids){const c=Number(el("cost-"+id)?.value),p=Number(el("price-"+id)?.value),n=el("profit-"+id);if(n){n.textContent=`กำไร/ตัว ${money(p-c)}`;n.classList.toggle("negative",p<c)}}if(action==="price"){const o=orders.find(x=>x.id===ids[0]),p=Number(el("new-price")?.value);el("price-profit").textContent=`กำไร/ตัว ${money(p-Number(o.unit_cost))}`;el("price-profit").classList.toggle("negative",p<Number(o.unit_cost))}}
async function save(e){e.preventDefault();const type=action;
if(type==="arrive" && ids.some(id=>["cost-","price-"].some(prefix=>{const raw=el(prefix+id)?.value;return raw===""||!Number.isFinite(Number(raw))||Number(raw)<0})))return toast("กรุณากรอกต้นทุนและราคาขายทุกรายการเป็น 0 บาทขึ้นไป",true);
if(type==="cancel"&&!el("reason").value.trim())return toast("กรุณาระบุเหตุผลที่ยกเลิก",true);
let success=0,errors=[];for(const id of ids){let payload;if(type==="order")payload={status:"สั่งแล้ว",supplier:el("supplier").value.trim()||null};if(type==="arrive"){const cost=el("cost-"+id).value,price=el("price-"+id).value;payload={status:"ของมาแล้ว",unit_cost:Number(cost),unit_price:Number(price),doc_no:el("doc").value.trim()||null}}if(type==="unorder")payload={status:"รอสั่ง"};if(type==="unarrive")payload={status:"สั่งแล้ว"};if(type==="cancel"){const reason=el("reason").value.trim();payload={status:"ยกเลิก",cancel_reason:reason}}if(type==="price")payload={unit_price:Number(el("new-price").value)};const result=type==="deliver"?await sb.rpc("special_order_deliver",{p_order_id:id,p_term:Number(el("term").value)}):await sb.from("special_orders").update(payload).eq("id",id).select("id");if(result.error||type!=="deliver"&&!result.data?.length)errors.push(`${person(orders.find(o=>o.id===id))}: ${result.error?.message||"ไม่พบแถวที่แก้ได้"}`);else success++}el("overlay").hidden=true;const delivered=type==="deliver"&&success===1?orders.find(x=>x.id===ids[0]):null;const deliveredMessage=delivered?`ตั้งหนี้ ${studentOf(delivered)?.name||"นักเรียน"} ${money(Number(delivered.unit_price)*delivered.qty)} บาทแล้ว`:null;toast(`${deliveredMessage||`สำเร็จ ${success} ใบ`}${errors.length?` · ไม่สำเร็จ ${errors.length} ใบ: ${errors.join("; ")}`:""}`,errors.length>0);await load();if(delivered){const o=delivered;const a=document.createElement("a");a.href=`fee-payment.html?year=${encodeURIComponent(o.year)}&student=${encodeURIComponent(o.student_id)}&term=${el("term")?.value||1}`;a.textContent="เปิดหน้ารับเงินของนักเรียนคนนี้ →";el("toast").append(" ",a)}}

el("tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;selected.clear();render()}};el("year").onchange=()=>load().catch(e=>toast(e.message,true));el("bulk").onclick=e=>{const b=e.target.closest("[data-bulk]");if(!b)return;let list=selectedOrders();if(b.dataset.bulk==="print"){if(!list.length)list=orders.filter(o=>o.status==="รอสั่ง");printOrders(list)}else if(!list.length)toast("กรุณาติ๊กเลือกรายการก่อน",true);else open(b.dataset.bulk,list.map(o=>o.id))};el("orders").onchange=e=>{const one=e.target.closest("[data-select]"),group=e.target.closest("[data-group]");if(one){one.checked?selected.add(one.dataset.select):selected.delete(one.dataset.select)}if(group){for(const o of orders.filter(o=>o.item_id===group.dataset.group&&o.status===tab))group.checked?selected.add(o.id):selected.delete(o.id);render()}};el("orders").onclick=e=>{const b=e.target.closest("[data-action],[data-print-group]");if(!b)return;if(b.dataset.printGroup)printOrders(orders.filter(o=>o.status==="รอสั่ง"&&o.item_id===b.dataset.printGroup));else open(b.dataset.action,[b.dataset.id])};el("modal-fields").oninput=updateProfits;el("modal-fields").onclick=e=>{const b=e.target.closest("[data-copy]");if(!b)return;const field=b.dataset.copy,value=el(field+"-"+ids[0])?.value;for(const id of ids)el(field+"-"+id).value=value;updateProfits()};el("modal-close").onclick=()=>el("overlay").hidden=true;el("action-form").onsubmit=e=>save(e).catch(err=>toast(err.message,true));
try{const session=await requireAuth();if(session){const canFinance=await checkDepartment("การเงิน");applyRestrictedMenuAccess(canFinance, await financeMenuKeepHrefs(canFinance, session.user.id));if(!canFinance){el("access").textContent="ไม่มีสิทธิ์จัดการใบสั่งพิเศษ";el("access").hidden=false}else{years=await getAcademicYears();currentYear=academicYearOf(toDateStr(bangkokNow()),years);if(!currentYear)throw Error("ยังไม่มีปีการศึกษาปัจจุบัน");el("year").innerHTML=`<option value="open">ทุกปีที่ยังไม่ปิด</option>`+years.map(y=>`<option value="${esc(y.year)}">${esc(y.year)}</option>`).join("");el("year").value=currentYear;await load();el("app").hidden=false}}}catch(error){el("access").textContent=error.message;el("access").hidden=false}
