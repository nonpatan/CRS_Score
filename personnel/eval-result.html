<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สรุปผลประเมิน — CRS MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2a2e; --muted:#5f6b70; --line:#dfe4e3; --teal:#0f6e56; --teal-soft:#e1f5ee; --bg:#f7f8f7; --white:#ffffff; --danger:#a32d2d; --danger-soft:#fceaea; --amber:#8a5a00; --amber-soft:#fff4df; }
  * { box-sizing:border-box; }
  body { font-family:"Sarabun",sans-serif; color:var(--ink); background:var(--bg); margin:0; padding:16px; font-size:16px; line-height:1.6; }
  .wrap, main.academic-content { max-width:1040px; margin:0 auto; min-width:0; }
  h1 { font-size:22px; margin:4px 0; } h2 { font-size:18px; margin:0 0 10px; } h3 { font-size:16px; margin:12px 0 6px; }
  header p,.hint { color:var(--muted); } header p { margin:0 0 8px; font-size:14px; }
  .nav { display:flex; gap:8px; flex-wrap:wrap; padding:8px; background:var(--white); border:1px solid var(--line); border-radius:99px; margin-bottom:22px; }
  .nav a { color:var(--muted); text-decoration:none; padding:8px 12px; border-radius:99px; font-size:14px; } .nav a.active { color:var(--white); background:var(--teal); } .nav #btn-signout { margin-left:auto; color:var(--danger); }
  .card { background:var(--white); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; min-width:0; }
  .hint { font-size:14px; margin:6px 0; } .empty { text-align:center; color:var(--muted); padding:24px; }
  .toolbar,.actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .toolbar select { flex:1; min-width:220px; }
  select,textarea { font:inherit; font-size:16px; border:1px solid var(--line); border-radius:8px; background:var(--white); color:var(--ink); padding:9px; min-height:44px; }
  textarea { display:block; width:100%; min-height:90px; resize:vertical; } label { display:block; font-weight:600; margin:10px 0 5px; }
  button,.button { display:inline-flex; align-items:center; justify-content:center; font:inherit; font-weight:600; min-height:44px; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; text-decoration:none; background:var(--teal-soft); color:var(--teal); }
  button.primary,.button.primary { background:var(--teal); color:var(--white); } button:disabled { opacity:.5; cursor:not-allowed; }
  button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; } .kpi { border:1px solid var(--line); border-radius:8px; padding:10px; } .kpi b { display:block; font-size:21px; } .kpi span { color:var(--muted); font-size:13px; }
  .kpi b.decision-summary { font-size:14px; line-height:1.5; }
  .table-scroll { overflow-x:auto; border:1px solid var(--line); border-radius:9px; } table { border-collapse:collapse; width:100%; font-size:14px; } th,td { padding:9px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; } th { background:var(--bg); } tr:last-child td { border-bottom:0; }
  .table-scroll table { min-width:700px; } .banner { padding:10px 12px; border-radius:8px; margin:10px 0; } .banner.warn { background:var(--amber-soft); color:var(--amber); } .banner.ok { background:var(--teal-soft); color:var(--teal); } .banner.err { background:var(--danger-soft); color:var(--danger); }
  .pass { color:var(--teal); font-weight:600; } .fail { color:var(--danger); font-weight:600; } .muted { color:var(--muted); }
  .choice { display:flex; flex-wrap:wrap; gap:8px; } .choice label { flex:1 1 200px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:0; font-weight:400; cursor:pointer; } .choice input { margin-right:8px; }
  details { border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:14px; } summary { cursor:pointer; font-weight:600; min-height:36px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:60; background:var(--ink); color:var(--white); border-radius:8px; padding:10px 16px; opacity:0; pointer-events:none; } #toast.show { opacity:1; }
  @media (max-width:720px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } } @media (max-width:420px) { body { padding:12px; } .toolbar select,.toolbar .button { width:100%; } }
</style>
<link rel="stylesheet" href="../app-shell.css?v=20261003-1">
</head>
<body><div class="wrap"><header><h1>สรุปผลประเมิน</h1><p>ตาราง ก ข ค และผลการพิจารณารายคน</p><div class="nav"><a href="index.html">ภาพรวมบุคลากร</a><a href="eval-rounds.html">ประเมินครู 360°</a><a href="eval-result.html" class="active">สรุปผลประเมิน</a><a href="eval-my.html">งานประเมินของฉัน</a><a href="#" id="btn-signout">ออกจากระบบ</a></div><script src="../app-shell.js?v=20261011-1"></script></header>
<main class="academic-content"><div id="app" class="card" role="status">กำลังโหลดผลประเมิน…</div><div id="toast" role="status" aria-live="polite"></div></main></div>
<script type="module">
import { requireAuth, signOut, checkDepartment, applyPersonnelMenuAccess, isPersonnelHead,
  listEvalRoundsICanSee, loadEvalRoundResults, loadEvalTargetResult, listStaffPicker,
  computeEvalResult, evalDecisionSnapshot, evalDecisionOptions, evalDecisionLabel,
  saveEvalDecision, thaiShortDateText } from "../supabase-client.js?v=20261011-1";
const session = await requireAuth();
if (session) {
  const app = document.getElementById("app"), toastBox = document.getElementById("toast");
  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
  const number = value => value == null ? "—" : Number(value).toFixed(2);
  const date = value => value ? new Intl.DateTimeFormat("th-TH", { timeZone:"Asia/Bangkok", day:"numeric", month:"short", year:"numeric" }).format(new Date(value)) : "—";
  const state = { rounds:[], staff:[], roundData:null, detail:null, result:null };
  const name = id => state.staff.find(row => row.id === id)?.full_name || "ไม่พบชื่อ";
  const section = (code, form) => form.sections.find(row => String(row.code) === String(code));
  const notify = message => { toastBox.textContent = message; toastBox.classList.add("show"); setTimeout(() => toastBox.classList.remove("show"), 4500); };
  const compute = (data, target) => computeEvalResult({ form:data.form, target,
    assignments:data.assignments.filter(row => row.target_id === target.id),
    responses:data.responses, section4:data.section4.find(row => row.target_id === target.id),
    roundNo:Number(data.round.round_no), history:data.histories[target.id] || {} });
  function table(headings, rows) { return '<div class="table-scroll" role="region" aria-label="ตารางผลประเมิน" tabindex="0"><table><thead><tr>' + headings.map(h => '<th>' + esc(h) + '</th>').join("") + '</tr></thead><tbody>' + rows.join("") + '</tbody></table></div>'; }
  function resultTables(result) {
    const domainRows = (result.sections.find(row => row.kind === "committee")?.domains || []).map(row =>
      '<tr><td>' + esc(row.code + " " + row.title) + '</td><td>' + number(row.avg) + '</td><td>' + number(row.minAvg) + '</td><td>' + (row.pass == null ? "—" : row.pass ? '<span class="pass">ผ่าน</span>' : '<span class="fail">ไม่ผ่าน</span>') + '</td></tr>');
    const sectionRows = result.sections.filter(row => row.weight > 0).map(row => '<tr><td>' + esc(row.title) + '</td><td>' + number(row.avg) + '</td><td>' + esc(row.weight) + '%</td><td>' + number(row.weighted) + '</td><td>' + number(row.minAvg) + '</td></tr>');
    sectionRows.push('<tr><th>รวม · ' + esc(result.level || "—") + '</th><th colspan="2"></th><th>' + number(result.total) + '</th><th></th></tr>');
    const starRows = result.stars.map(row => '<tr><td>' + esc(row.code) + '</td><td>' + esc(row.label) + '</td><td>' + number(row.value) + '</td><td><span class="' + (row.fail ? "fail" : "pass") + '">' + (row.fail ? "ไม่ผ่าน" : "ผ่าน") + '</span></td></tr>');
    return '<section class="card"><h2>ตาราง ก · รายด้าน</h2>' + table(["ด้าน","เฉลี่ย","เกณฑ์ขั้นต่ำ","ผล"], domainRows) + '</section>' +
      '<section class="card"><h2>ตาราง ข · ผลรวม</h2>' + table(["ส่วน","เฉลี่ย","น้ำหนัก","คะแนนถ่วงน้ำหนัก","เกณฑ์ขั้นต่ำ"], sectionRows) + '</section>' +
      '<section class="card"><h2>ตาราง ค · ข้อ ★</h2>' + (starRows.length ? table(["ข้อ","รายการ","คะแนน","ผล"], starRows) : '<p class="hint">ไม่มีข้อ ★</p>') + '</section>';
  }
  function privateDetails(data) {
    const responses = new Map(data.responses.map(row => [row.assignment_id + ":" + row.item_id, row]));
    let html = '<details><summary>ดูคะแนนรายข้อ / รายผู้ประเมิน</summary>';
    for (const part of data.form.sections.filter(row => row.kind !== "summary_entry")) {
      const rows = data.assignments.filter(row => row.section_code === part.code);
      html += '<h3>' + esc(part.title) + '</h3>';
      for (const row of rows) {
        html += '<p class="hint">ผู้ประเมิน: ' + esc(name(row.rater_staff_id)) + '</p>';
        html += table(["ข้อ","คะแนน","หลักฐาน"], part.domains.flatMap(domain => domain.items.map(item => {
          const answer = responses.get(row.id + ":" + item.id);
          return '<tr><td>' + esc(domain.code + "(" + item.no + ") " + item.text) + '</td><td>' + esc(answer?.score ?? "—") + '</td><td>' + esc(answer?.evidence || "—") + '</td></tr>';
        })));
      }
    }
    return html + '</details>';
  }
  function renderRound() {
    const data = state.roundData, round = data.round;
    const rows = data.targets.map(target => {
      const result = compute(data, target), decision = data.decisions.find(row => row.target_id === target.id);
      const ack = data.acknowledgements.find(row => row.target_id === target.id);
      const status = result.complete ? evalDecisionLabel(result.suggested) : '<span class="muted">ข้อมูลไม่ครบ · ' + esc(result.missing.join(" · ")) + '</span>';
      return '<tr><td><a href="?target=' + encodeURIComponent(target.id) + '">' + esc(name(target.staff_id)) + '</a></td><td>' + number(result.total) + '</td><td>' + esc(result.level || "—") + '</td><td>' + status + '</td><td>' + esc(evalDecisionLabel(decision?.final)) + '</td><td>' + esc(result.deficiencies.join(", ") || "—") + '</td><td>' + (round.status === "published" ? (ack ? 'รับทราบแล้ว ' + esc(date(ack.acknowledged_at)) : "ยังไม่รับทราบ") : "—") + '</td></tr>';
    });
    const results = data.targets.map(target => compute(data, target));
    const confirmed = data.decisions.length, incomplete = results.filter(row => !row.complete).length;
    const decisionSummary = evalDecisionOptions(round.round_no).map(option =>
      option.label + " " + data.decisions.filter(row => row.final === option.value).length).join(" · ");
    app.innerHTML = '<section class="card"><div class="toolbar"><label for="round-select">รอบประเมิน</label><select id="round-select">' + state.rounds.map(row => '<option value="' + esc(row.id) + '"' + (row.id === round.id ? " selected" : "") + '>' + esc(row.academic_year + " · ครั้งที่ " + row.round_no) + '</option>').join("") + '</select><a class="button" href="eval-rounds.html?round=' + encodeURIComponent(round.id) + '">หน้ารอบ</a></div></section>' +
      '<section class="card"><h2>' + esc(round.academic_year + " · ครั้งที่ " + round.round_no) + '</h2><div class="kpis">' +
      [[data.targets.length,"ครูในรอบ"],[confirmed,"ยืนยันผลแล้ว"],[incomplete,"ข้อมูลไม่ครบ"]].map(([n,label]) => '<div class="kpi"><b>' + n + '</b><span>' + esc(label) + '</span></div>').join("") +
      '<div class="kpi"><b class="decision-summary">' + esc(decisionSummary) + '</b><span>ผลที่ยืนยันแล้ว</span></div></div></section>' +
      '<section class="card"><h2>ผลรายคน</h2>' + (rows.length ? table(["ครู","รวม","ระดับ","ระบบเสนอ","ผลที่ยืนยัน","ข้อบกพร่อง","รับทราบ"], rows) : '<div class="empty">ยังไม่มีครูในรอบนี้</div>') + '</section>';
  }
  function renderDetail() {
    const data = state.detail, target = data.target, result = state.result;
    const decided = data.decision, final = decided?.final || result.suggested;
    const texts = data.form.sections.filter(row => ["committee","dept_head"].includes(row.kind)).flatMap(part =>
      data.assignments.filter(row => row.section_code === part.code).map(row => ({ part, row })));
    const textHtml = texts.flatMap(({part,row}) => (part.text_fields || []).map(field => '<p><b>' + esc(field.label) + ':</b> ' + esc(row.texts?.[field.key] || "—") + '</p>')).join("");
    app.innerHTML = '<p><a class="button" href="?round=' + encodeURIComponent(data.round.id) + '">← กลับไปทั้งรอบ</a></p>' +
      '<section class="card"><h2>' + esc(name(target.staff_id)) + '</h2><p class="hint">' + esc(target.workload || "ไม่ระบุภาระงาน") + ' · ' + esc(data.round.academic_year + " ครั้งที่ " + data.round.round_no) + ' · ฉบับ ' + esc(data.form.code) + '</p></section>' +
      (result.complete ? resultTables(result) : '<section class="card banner warn">ข้อมูลไม่ครบ · ' + esc(result.missing.join(" · ")) + '</section>') +
      '<section class="card"><h2>ผลการพิจารณา</h2>' +
      (result.complete ? '<div class="banner ok">เข้าเงื่อนไข ' + esc(evalDecisionLabel(result.suggested)) + '</div>' : '<div class="banner warn">ข้อมูลไม่ครบ ยังยืนยันผลไม่ได้</div>') +
      '<p>' + esc(result.reasons.join(" · ")) + '</p>' + (result.warnings.length ? '<div class="banner warn">' + esc(result.warnings.join(" · ")) + '</div>' : "") +
      (data.round.status === "published" ? '<p><b>ผลที่ยืนยัน: ' + esc(evalDecisionLabel(decided?.final)) + '</b></p>' :
        '<fieldset' + (!result.complete ? ' disabled' : '') + '><legend>ยืนยันผลการพิจารณา</legend><div class="choice">' + evalDecisionOptions(data.round.round_no).map(option =>
          '<label><input type="radio" name="final" value="' + option.value + '"' + (option.value === final ? " checked" : "") + '>' + esc(option.label) + '</label>').join("") +
        '</div><label for="decision-reason">เหตุผล (บังคับเมื่อเลือกต่างจากระบบเสนอ)</label><textarea id="decision-reason">' + esc(decided?.reason || "") + '</textarea><p id="reason-error" class="fail" role="alert"></p><button class="primary" id="save-decision" type="button">ยืนยันผล</button></fieldset>' +
        (decided ? '<p class="hint">ยืนยันเมื่อ ' + esc(date(decided.decided_at)) + ' · แก้ได้จนกว่าประกาศผล</p>' : "")) +
      '<p><a class="button" href="eval-print.html?target=' + encodeURIComponent(target.id) + '">พิมพ์แบบลงนาม</a></p></section>' +
      '<section class="card"><h2>ข้อความจากผู้ประเมิน</h2>' + (textHtml || '<p class="hint">ยังไม่มีข้อความ</p>') + privateDetails(data) + '</section>';
  }
  async function openRound(id) { state.roundData = await loadEvalRoundResults(id); state.detail = null; state.result = null; history.replaceState(null,"","?round=" + encodeURIComponent(id)); renderRound(); }
  async function openTarget(id) { state.detail = await loadEvalTargetResult(id); state.result = computeEvalResult({ form:state.detail.form, target:state.detail.target, assignments:state.detail.assignments,
    responses:state.detail.responses, section4:state.detail.section4, roundNo:Number(state.detail.round.round_no), history:state.detail.history });
    history.replaceState(null,"","?target=" + encodeURIComponent(id)); renderDetail(); }
  document.getElementById("btn-signout").addEventListener("click", event => { event.preventDefault(); signOut(); });
  try {
    const department = await checkDepartment("บุคลากร"); applyPersonnelMenuAccess(department);
    const [head, rounds] = await Promise.all([isPersonnelHead(), listEvalRoundsICanSee()]);
    state.rounds = rounds;
    if (!head && !rounds.length) { app.innerHTML = '<div class="banner warn">หน้านี้สำหรับ ผอ. และหัวหน้าฝ่ายบุคคล</div>'; }
    else {
      state.staff = await listStaffPicker();
      const requested = new URLSearchParams(location.search);
      const targetId = requested.get("target"), roundId = requested.get("round");
      if (targetId) await openTarget(targetId);
      else if (rounds.length) await openRound(rounds.find(row => row.id === roundId)?.id || rounds[0].id);
      else app.innerHTML = '<div class="empty">ยังไม่มีรอบที่ปิดรับคะแนนหรือประกาศผล</div>';
      const clearReasonError = () => { const field = app.querySelector("#decision-reason"), error = app.querySelector("#reason-error");
        if (field && error) { error.textContent = ""; field.removeAttribute("aria-invalid"); field.removeAttribute("aria-describedby"); } };
      app.addEventListener("input", event => { if (event.target.id === "decision-reason") clearReasonError(); });
      app.addEventListener("change", async event => { if (event.target.name === "final") { clearReasonError(); return; }
        if (event.target.id !== "round-select") return;
        try { await openRound(event.target.value); } catch (error) { notify(error.message); } });
      app.addEventListener("click", async event => {
        if (event.target.id !== "save-decision") return;
        const selected = app.querySelector('input[name="final"]:checked')?.value;
        const reason = app.querySelector("#decision-reason").value.trim();
        const reasonField = app.querySelector("#decision-reason"), errorBox = app.querySelector("#reason-error"); clearReasonError();
        if (selected !== state.result.suggested && !reason) { errorBox.textContent = "เลือกผลต่างจากที่ระบบเสนอ ต้องเขียนเหตุผล";
          reasonField.setAttribute("aria-invalid", "true"); reasonField.setAttribute("aria-describedby", "reason-error"); reasonField.focus(); return; }
        event.target.disabled = true;
        try { await saveEvalDecision({ target_id:state.detail.target.id, computed:evalDecisionSnapshot(state.result),
          suggested:state.result.suggested, final:selected, reason:reason || null, deficiencies:state.result.deficiencies });
          await openTarget(state.detail.target.id); notify("ยืนยันผลแล้ว");
        } catch (error) { event.target.disabled = false; notify(error.message); }
      });
    }
  } catch (error) { app.className = "card banner err"; app.textContent = error.message; }
}
</script></body></html>
