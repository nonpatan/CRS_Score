<body><a class="skip" href="#main">ข้ามไปเนื้อหา</a><div class="wrap"><header><h1>ประเมินคุณลักษณะ</h1><p>ให้ระดับทีละคน อ่านคำอธิบายและประเมินครบทุกข้อ</p><div class="nav"><a href="#" id="btn-signout">ออกจากระบบ</a></div><script src="../app-shell.js?v=20261115-1"></script></header>
<main id="main" class="academic-content">
<section class="card" aria-labelledby="filters-title"><h2 id="filters-title">เลือกห้องและช่วงประเมิน</h2><div class="filters">
<div class="field"><label for="year">ปีการศึกษา</label><select id="year" disabled></select></div>
<div class="field"><label for="room">ห้องเรียน</label><select id="room" disabled></select></div>
<div class="field"><label for="term">ช่วงประเมิน</label><select id="term" disabled><option value="1">กลางปี</option><option value="2">ปลายปี</option></select></div>
</div><p id="access" role="status" tabindex="-1">กำลังโหลดรายชื่อ…</p><button id="retry" type="button" class="ghost" hidden>ลองโหลดอีกครั้ง</button></section>
<section id="editor" hidden aria-busy="false">
<div class="context-row"><div><h2 id="context-summary"></h2><p id="progress" role="status" aria-atomic="true"></p></div><details class="more" id="more"><summary>เพิ่มเติม</summary><button id="fill" type="button">ทั้งห้อง: ข้อที่ยังว่าง = ดี</button></details></div>
<div id="workspace" class="workspace" data-list-open="false">
<aside id="roster-panel" class="roster-panel card" aria-labelledby="roster-title"><h2 id="roster-title">นักเรียนในห้อง</h2><p class="hint">เลือกรายชื่อเพื่อเปลี่ยนคน</p><ol id="roster-list" class="roster-list"></ol></aside>
<div class="student-card card"><div class="intro"><div class="student-nav">
<button id="previous" type="button">‹ คนก่อน</button>
<h2 id="student-heading" tabindex="-1"><button id="student-picker" class="student-title" type="button" aria-controls="roster-panel" aria-expanded="false"><span id="student-name"></span><small>เลือกรายชื่อทั้งห้อง ▾</small></button></h2>
<button id="next" type="button">คนถัดไป ›</button>
</div><p id="student-meta" class="student-meta"></p><p id="special-count" class="hint"></p></div>
<div id="grid"></div>
<div class="person-actions" id="person-actions"><button id="fill-person" type="button" class="ghost">ข้อที่ยังว่างของคนนี้ = ดี</button><button id="undo-fill" type="button" hidden>ยกเลิกการเติม ดี</button></div>
</div></div>
<div id="save-bar" class="save-bar"><div><p id="save-count" class="save-count" role="status" aria-atomic="true"></p><p id="operation" class="status" role="status" tabindex="-1" hidden></p></div><button id="save" class="primary" type="button" disabled>บันทึก</button></div>
</section>
</main></div><script type="module">
import {sb,requireAuth,signOut,getProfile,checkDepartment,isAcademicHead,getAcademicYears,getActiveYear,
  fetchAllRows,isRegularStudent,isAutoPresentStudent,GRADE_ORDER} from "../supabase-client.js?v=20261115-3";
const el=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(student,trait)=>student+"|"+trait;
const roomKey=r=>r.grade_level+"|"+r.classroom;
let traits=[],placements=[],rooms=[],roster=[],original=new Map(),values=new Map(),busy=false,ready=false,manage=false,myStaffId=null;
let scope={year:"",room:"",term:"1"},studentIndex=0,initialized=false,retryYear=true,undoFill=null;
const expandedDescriptions=new Set(),desktop=matchMedia("(min-width:1024px)");
const session=await requireAuth();
function currentStudent(){return roster[studentIndex]||null;}
function changes(studentId=null){return [...values].filter(([k,v])=>v!==original.get(k)&&(!studentId||k.startsWith(studentId+"|")));}
function studentProgress(student){const count=traits.filter(t=>values.has(key(student.student_id,t.id))).length;return {count,complete:traits.length>0&&count===traits.length,text:count===0?"ยังไม่เริ่ม":count===traits.length?`ครบ ${count}/${traits.length} ✓`:`${count}/${traits.length}`};}
function updateControls(){
  document.querySelectorAll("main button,main select,main input").forEach(n=>n.disabled=busy);
  document.querySelectorAll("#grid fieldset").forEach(n=>n.disabled=busy);
  el("room").disabled=busy||!rooms.length;el("year").disabled=busy||!initialized;el("term").disabled=busy||!ready;
  for(const id of ["fill","fill-person"])el(id).disabled=busy||!ready||!roster.length||!traits.length;
  const student=currentStudent();
  if(student)el("fill-person").disabled=busy||traits.every(t=>values.has(key(student.student_id,t.id)));
  el("previous").disabled=busy||!ready||studentIndex===0;el("next").disabled=busy||!ready||studentIndex>=roster.length-1;
  el("student-picker").disabled=busy||!ready||!roster.length;
  el("save").disabled=busy||!ready||!changes().length;
  el("save").setAttribute("aria-busy",String(busy));el("save").textContent=busy?"กำลังดำเนินการ…":"บันทึก";
  el("editor").setAttribute("aria-busy",String(busy));
}
function lock(value){busy=value;updateControls();}
function message(text,error=false){el("operation").hidden=false;el("operation").textContent=text;el("operation").className="status"+(error?" error":"");el("operation").setAttribute("role",error?"alert":"status");if(error)el("operation").focus();}
function renderRoster(){
  el("roster-list").innerHTML=roster.map((p,i)=>{const status=studentProgress(p),dirty=changes(p.student_id).length;return `<li><button type="button" class="student-option" data-index="${i}" ${i===studentIndex?'aria-current="true"':""}><span class="student-number">${i+1}</span><span><strong>${esc(p.student?.name)}</strong><small>${esc(p.student?.student_no)}</small><small class="roster-state">${esc(status.text)}</small>${dirty?`<small class="pending-note">ยังไม่บันทึก ${dirty} ช่อง</small>`:""}</span></button></li>`}).join("");
}
function updateProgress(){
  el("progress").textContent=roster.length?`ครบ ${roster.filter(p=>studentProgress(p).complete).length}/${roster.length} คน`:"ยังไม่มีนักเรียนที่ต้องประเมิน";
  el("save-count").textContent=`ยังไม่บันทึก ${changes().length} ช่อง`;
  const student=currentStudent();
  if(student)for(const [i,t] of traits.entries())el("dirty-"+i)?.toggleAttribute("hidden",values.get(key(student.student_id,t.id))===original.get(key(student.student_id,t.id)));
  renderRoster();updateControls();
}
function updateDescriptionButtons(){
  for(const [i,t] of traits.entries()){
    const text=el("description-"+i),button=el("read-more-"+i);if(!text||!button)continue;
    button.hidden=!expandedDescriptions.has(t.id)&&text.scrollHeight<=text.clientHeight+1;
  }
}
function renderStudent(focus=false){
  const student=currentStudent();
  el("workspace").classList.toggle("empty-workspace",!student);
  el("workspace").dataset.listOpen="false";el("student-picker").setAttribute("aria-expanded",String(desktop.matches));
  el("student-name").textContent=student?`${studentIndex+1}/${roster.length} ${student.student?.name||"นักเรียน"}`:"ยังไม่มีรายชื่อ";
  el("student-meta").textContent=student?`รหัส ${student.student?.student_no||"—"} · ${studentProgress(student).text}`:"";
  el("person-actions").hidden=!student;el("save-bar").hidden=!student;el("roster-panel").toggleAttribute("aria-hidden",!roster.length);
  el("grid").innerHTML=student?traits.map((t,i)=>{
    const k=key(student.student_id,t.id),expanded=expandedDescriptions.has(t.id);
    return `<fieldset class="trait-item"><legend>${i+1}. ${esc(t.name)} <span id="dirty-${i}" class="dirty-tag" hidden>ยังไม่บันทึก</span></legend><div class="description-row"><p id="description-${i}" class="description-text${expanded?"":" collapsed"}">${esc(t.description||"ไม่มีคำอธิบายเพิ่มเติม")}</p><button id="read-more-${i}" type="button" class="read-more" data-description="${i}" aria-controls="description-${i}" aria-expanded="${expanded}">${expanded?"ย่อ":"อ่านต่อ"}</button></div><div class="level-options">${[3,2,1,0].map(n=>`<label class="level-choice"><input type="radio" id="level-${studentIndex}-${i}-${n}" name="trait-${i}" value="${n}" data-student="${esc(student.student_id)}" data-trait="${esc(t.id)}" aria-describedby="description-${i}" ${values.get(k)===n?"checked":""}><span class="choice-text">${["ไม่ผ่าน","ผ่าน","ดี","ดีเยี่ยม"][n]}<span class="tick" aria-hidden="true">✓</span></span></label>`).join("")}</div></fieldset>`;
  }).join(""):'<p class="empty">ยังไม่มีนักเรียนปกติที่กำลังศึกษาในห้องนี้ · ตรวจรายชื่อและประเภทนักเรียนที่ฝ่ายวิชาการ</p>';
  el("undo-fill").hidden=!undoFill||undoFill.studentId!==student?.student_id;
  updateProgress();requestAnimationFrame(updateDescriptionButtons);
  if(focus){if(desktop.matches)el("roster-list").querySelector('[aria-current="true"]')?.scrollIntoView({block:"nearest"});el("student-heading").focus({preventScroll:true});el("student-heading").scrollIntoView({block:"start"});}
}
async function loadRoom(){
  ready=false;el("editor").hidden=true;el("access").textContent="กำลังโหลดรายชื่อ…";original=new Map();values=new Map();roster=[];studentIndex=0;undoFill=null;
  const room=rooms.find(r=>roomKey(r)===el("room").value);scope={year:el("year").value,room:el("room").value,term:el("term").value};if(!room)return;
  const primary=room.grade_level.startsWith("ป.");for(const o of el("term").options)o.textContent=primary?(o.value==="1"?"กลางปี":"ปลายปี"):"ภาค "+o.value;
  const inRoom=placements.filter(p=>roomKey(p)===scope.room&&!p.student?.graduated&&!p.student?.left_school);
  roster=inRoom.filter(p=>isRegularStudent(p.student)).sort((a,b)=>String(a.student?.student_no||"").localeCompare(String(b.student?.student_no||""),"th",{numeric:true}));
  // อ่านผลทั้งห้องครั้งเดียว ไม่อ่านเพิ่มเมื่อเปลี่ยนคนหรือขยายคำอธิบาย
  if(roster.length){const result=await fetchAllRows(()=>sb.from("student_trait_results").select("id,student_id,trait_id,level").eq("year",scope.year).eq("term",scope.term).in("student_id",roster.map(p=>p.student_id)));if(result.error)throw result.error;for(const r of result.data||[])original.set(key(r.student_id,r.trait_id),r.level);}
  values=new Map(original);ready=true;el("editor").hidden=false;
  el("context-summary").textContent=`${room.grade_level}/${room.classroom} · ${el("term").selectedOptions[0].textContent}`;
  el("special-count").textContent=`นักเรียนพิเศษที่ระบบกำหนดให้ ${inRoom.filter(p=>isAutoPresentStudent(p.student)).length} คน · ไม่ต้องประเมินในหน้านี้`;
  el("access").textContent="คนก่อนและคนถัดไปจะบันทึกของคนปัจจุบันให้ก่อนเปลี่ยนคน";renderStudent();
}
async function loadYear(){
  ready=false;rooms=[];placements=[];el("editor").hidden=true;el("access").textContent="กำลังโหลดห้องเรียน…";
  const year=el("year").value;
  const [p,h]=await Promise.all([
    fetchAllRows(()=>sb.from("student_year_placements").select("id,student_id,grade_level,classroom,student:student_id(id,student_no,name,graduated,left_school,student_type)").eq("year",year)),
    manage?Promise.resolve({data:[]}):sb.from("homeroom_teachers").select("grade_level,classroom").eq("year",year).eq("staff_id",myStaffId||"00000000-0000-0000-0000-000000000000")]);
  if(p.error)throw p.error;if(h.error)throw h.error;placements=p.data||[];
  const own=new Set((h.data||[]).map(roomKey));
  rooms=[...new Map([...placements,...(h.data||[])].filter(p=>(p.grade_level?.startsWith("ป.")||p.grade_level?.startsWith("ม."))&&(manage||own.has(roomKey(p)))).map(p=>[roomKey(p),{grade_level:p.grade_level,classroom:p.classroom}])).values()].sort((a,b)=>GRADE_ORDER.indexOf(a.grade_level)-GRADE_ORDER.indexOf(b.grade_level)||String(a.classroom).localeCompare(String(b.classroom),"th",{numeric:true}));
  el("room").innerHTML=rooms.map(r=>`<option value="${esc(roomKey(r))}">${esc(r.grade_level)}/${esc(r.classroom)}</option>`).join("");
  original=new Map();values=new Map();scope={year,room:el("room").value,term:el("term").value};
  if(rooms.length)await loadRoom();else el("access").textContent=manage?"ปีนี้ยังไม่มีห้องประถมหรือมัธยม · ตรวจการจัดห้องที่ฝ่ายวิชาการ":"หน้านี้สำหรับครูประจำชั้น";
}
function loadError(error){ready=false;el("editor").hidden=true;el("access").textContent="โหลดไม่สำเร็จ: "+error.message+" · กดลองโหลดอีกครั้ง";el("access").setAttribute("role","alert");el("retry").hidden=false;el("access").focus();}
async function runLoad(year=false){retryYear=year;lock(true);el("retry").hidden=true;el("access").setAttribute("role","status");el("operation").hidden=true;try{await(year?loadYear():loadRoom());}catch(error){loadError(error);}finally{lock(false);}}
async function discard(){return !changes().length||await window.crsAskConfirm({title:"ยังมีงานที่ไม่ได้บันทึก",message:"ออกจากช่วงนี้แล้วระดับที่แก้ไว้จะหาย ต้องการออกหรือไม่",okLabel:"ออกโดยไม่บันทึก",danger:true});}
// ระบุคนเมื่อต้องบันทึกก่อนเปลี่ยนคน; ไม่ระบุคือบันทึกทุกคนที่มีการแก้ไข
async function saveChanges(studentId=null){
  if(busy||!ready)return false;const changed=changes(studentId);if(!changed.length)return true;lock(true);el("save").textContent="กำลังบันทึก…";message("กำลังบันทึก…");
  try{const payload=changed.map(([k,level])=>{const [student_id,trait_id]=k.split("|");return {student_id,year:scope.year,term:scope.term,trait_id,level,source:"ครู"};});
    const result=await sb.from("student_trait_results").upsert(payload,{onConflict:"student_id,year,term,trait_id"}).select("student_id,trait_id,level");if(result.error)throw result.error;
    const saved=new Map((result.data||[]).map(r=>[key(r.student_id,r.trait_id),r.level]));
    for(const [k,v] of changed)if(saved.get(k)===v)original.set(k,v);
    const remaining=changed.filter(([k,v])=>original.get(k)!==v);undoFill=null;el("undo-fill").hidden=true;
    if(remaining.length)throw new Error("บันทึกได้ "+(changed.length-remaining.length)+" ช่อง ยังมีช่องค้าง กรุณาตรวจสิทธิ์แล้วลองอีกครั้ง");
    message(`บันทึกแล้ว ${changed.length} ช่อง · ${new Set(payload.map(r=>r.student_id)).size} คน`);return true;
  }catch(error){message("บันทึกไม่สำเร็จ: "+error.message+" · ระดับที่แก้ยังอยู่ กดบันทึกหรือเปลี่ยนคนอีกครั้งเพื่อลองใหม่",true);return false;}
  finally{updateProgress();lock(false);}
}
async function selectStudent(index){
  if(busy||!ready||index<0||index>=roster.length||index===studentIndex)return false;
  if(!await saveChanges(currentStudent().student_id))return false;
  studentIndex=index;undoFill=null;renderStudent(true);return true;
}
function fillEmpty(studentIds){const filled=[];for(const p of roster.filter(p=>studentIds.has(p.student_id)))for(const t of traits){const k=key(p.student_id,t.id);if(!values.has(k)){values.set(k,2);filled.push(k);}}return filled;}
el("previous").addEventListener("click",()=>selectStudent(studentIndex-1));el("next").addEventListener("click",()=>selectStudent(studentIndex+1));
el("roster-list").addEventListener("click",event=>{const button=event.target.closest("button[data-index]");if(button)void selectStudent(Number(button.dataset.index));});
el("student-picker").addEventListener("click",()=>{if(busy||!ready)return;if(!desktop.matches)el("workspace").dataset.listOpen=String(el("workspace").dataset.listOpen!=="true");el("student-picker").setAttribute("aria-expanded",String(desktop.matches||el("workspace").dataset.listOpen==="true"));if(desktop.matches||el("workspace").dataset.listOpen==="true")el("roster-list").querySelector('[aria-current="true"]')?.focus();});
el("roster-panel").addEventListener("keydown",event=>{if(event.key==="Escape"&&!desktop.matches){event.preventDefault();el("workspace").dataset.listOpen="false";el("student-picker").setAttribute("aria-expanded","false");el("student-picker").focus();}});
window.addEventListener("resize",()=>requestAnimationFrame(updateDescriptionButtons));
document.fonts.ready.then(()=>requestAnimationFrame(updateDescriptionButtons));
desktop.addEventListener("change",()=>el("student-picker").setAttribute("aria-expanded",String(desktop.matches||el("workspace").dataset.listOpen==="true")));
el("grid").addEventListener("change",event=>{
  if(busy||!ready||!event.target.matches('input[type="radio"]'))return;
  values.set(key(event.target.dataset.student,event.target.dataset.trait),Number(event.target.value));el("operation").hidden=true;
  const student=currentStudent();el("student-meta").textContent=`รหัส ${student.student?.student_no||"—"} · ${studentProgress(student).text}`;updateProgress();
});
el("grid").addEventListener("click",event=>{const button=event.target.closest("button[data-description]");if(!button||busy)return;const i=Number(button.dataset.description),trait=traits[i],expanded=!expandedDescriptions.has(trait.id);if(expanded)expandedDescriptions.add(trait.id);else expandedDescriptions.delete(trait.id);el("description-"+i).classList.toggle("collapsed",!expanded);button.setAttribute("aria-expanded",String(expanded));button.textContent=expanded?"ย่อ":"อ่านต่อ";});
el("fill-person").addEventListener("click",()=>{if(busy||!ready)return;const student=currentStudent();undoFill={studentId:student.student_id,keys:fillEmpty(new Set([student.student_id]))};renderStudent();message("เติม ดี เฉพาะข้อที่ยังว่างของคนนี้แล้ว · ยกเลิกการเติมหรือปรับระดับก่อนบันทึกได้");el("undo-fill").focus();});
el("undo-fill").addEventListener("click",()=>{if(busy||!undoFill)return;for(const k of undoFill.keys)if(!original.has(k)&&values.get(k)===2)values.delete(k);undoFill=null;renderStudent();el("operation").hidden=true;el("fill-person").focus();});
el("fill").addEventListener("click",async()=>{if(busy||!ready)return;lock(true);try{if(!await window.crsAskConfirm({title:"ตั้งช่องว่างเป็น ดี",message:"เติมระดับ ดี เฉพาะช่องที่ยังว่างของห้องนี้ แล้วตรวจทานก่อนบันทึก",okLabel:"ตั้งช่องว่างเป็น ดี"}))return;fillEmpty(new Set(roster.map(p=>p.student_id)));undoFill=null;el("more").open=false;renderStudent();message("เติม ดี เฉพาะช่องที่ยังว่างทั้งห้องแล้ว · กดบันทึกเพื่อบันทึกทุกคน");}finally{lock(false);}});
el("save").addEventListener("click",()=>saveChanges());
for(const id of ["year","room","term"])el(id).addEventListener("change",async()=>{if(busy)return;lock(true);const next=el(id).value;el(id).value=scope[id];if(!await discard()){lock(false);return;}el(id).value=next;await runLoad(id==="year");});
el("retry").addEventListener("click",()=>initialized?runLoad(retryYear):initialize());
el("btn-signout").addEventListener("click",async event=>{event.preventDefault();if(busy)return;lock(true);if(await discard()){values=new Map(original);await signOut();}else lock(false);});
window.crsHasUnsavedChanges=()=>changes().length>0;
window.addEventListener("beforeunload",event=>{if(changes().length){event.preventDefault();event.returnValue="";}});
document.addEventListener("click",async event=>{const a=event.target.closest("a[href]");if(!a||a.id==="btn-signout"||a.hash||a.target==="_blank"||event.ctrlKey||event.metaKey||!changes().length)return;event.preventDefault();if(busy)return;lock(true);if(await discard()){values=new Map(original);location.href=a.href;}else lock(false);});
new ResizeObserver(entries=>{const height=entries[0].target.getBoundingClientRect().height;if(height)document.documentElement.style.setProperty("--save-bar-height",Math.ceil(height)+"px");}).observe(el("save-bar"));
async function initialize(){
  lock(true);el("retry").hidden=true;el("access").setAttribute("role","status");el("access").textContent="กำลังโหลดรายชื่อ…";
  try{
    const [profile,dept,head,staff,years,items]=await Promise.all([getProfile(session.user.id),checkDepartment("วิชาการ"),isAcademicHead(),sb.from("staff").select("id").eq("user_id",session.user.id).maybeSingle(),getAcademicYears(),sb.from("core_traits").select("id,name,description,seq").eq("active",true).order("seq")]);
    if(staff.error)throw staff.error;if(items.error)throw items.error;
    manage=profile?.role==="admin"||dept||head;myStaffId=staff.data?.id;traits=items.data||[];
    el("year").innerHTML=years.map(y=>`<option>${esc(y.year)}</option>`).join("");if(years.some(y=>y.year===getActiveYear()))el("year").value=getActiveYear();
    if(!traits.length)throw new Error("ยังไม่มีรายการคุณลักษณะที่เปิดใช้ กรุณาติดต่อฝ่ายวิชาการ");
    if(!years.length)throw new Error("ยังไม่มีปีการศึกษา กรุณาติดต่อฝ่ายวิชาการ");
    initialized=true;retryYear=true;await loadYear();
  }catch(error){loadError(error);}finally{lock(false);}
}
if(session)await initialize();
</script></body></html>
