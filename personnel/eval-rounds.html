<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประเมินครู 360° — CRS MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2a2e; --muted:#5f6b70; --line:#dfe4e3; --teal:#0f6e56; --teal-soft:#e1f5ee;
    --bg:#f7f8f7; --white:#ffffff; --danger:#a32d2d; --danger-soft:#fceaea;
    --amber:#8a5a00; --amber-soft:#fff4df; }
  * { box-sizing:border-box; }
  body { font-family:"Sarabun",sans-serif; color:var(--ink); background:var(--bg);
    margin:0; padding:16px; font-size:16px; line-height:1.6; }
  .wrap { max-width:1040px; margin:0 auto; }
  .wrap > .academic-content { max-width:1040px; min-width:0; }
  h1 { font-size:22px; margin:4px 0; } h2 { font-size:18px; margin:0 0 12px; }
  h3 { font-size:16px; margin:0 0 8px; }
  header p, .hint, .meta { color:var(--muted); }
  header p { margin:0 0 8px; font-size:14px; }
  .nav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:8px; background:var(--white);
    border:1px solid var(--line); border-radius:99px; margin-bottom:22px; }
  .nav a { color:var(--muted); text-decoration:none; padding:8px 12px; border-radius:99px; font-size:14px; }
  .nav a.active { color:var(--white); background:var(--teal); }
  .nav #btn-signout { margin-left:auto; color:var(--danger); }
  .card { background:var(--white); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; min-width:0; }
  #gate[hidden], #app[hidden] { display:none !important; }
  .section { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:0 0 10px; }
  .hint { font-size:14px; margin:4px 0 10px; } .meta { font-size:13px; margin:2px 0; }
  .empty { color:var(--muted); padding:22px 10px; text-align:center; }
  .toolbar, .actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .toolbar > select { flex:1; min-width:190px; }
  .actions { margin-top:12px; }
  .actions > button { flex:0 1 auto; }
  .row2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .row3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .field { margin:0 0 14px; min-width:0; }
  label { display:block; font-size:15px; font-weight:600; margin:0 0 5px; }
  input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
    width:100%; min-height:44px; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    background:var(--white); color:var(--ink); font:inherit; font-size:16px; }
  textarea { min-height:86px; resize:vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible {
    outline:2px solid var(--teal); outline-offset:2px; }
  input[aria-invalid="true"], select[aria-invalid="true"] { border-color:var(--danger) !important; }
  button { font:inherit; font-size:15px; font-weight:600; border:0; border-radius:8px;
    min-height:44px; padding:9px 14px; cursor:pointer; }
  button.primary { background:var(--teal); color:var(--white); }
  button.ghost { background:var(--teal-soft); color:var(--teal); }
  button.danger { background:var(--danger-soft); color:var(--danger); }
  button:disabled { opacity:.52; cursor:not-allowed; }
  .field-error, .error-summary { color:var(--danger); font-size:14px; margin:4px 0 0; }
  .error-summary { font-weight:600; margin-bottom:12px; }
  .banner { padding:11px 13px; border-radius:9px; margin:10px 0; font-size:14px; }
  .banner.warn { background:var(--amber-soft); color:var(--amber); }
  .banner.err { background:var(--danger-soft); color:var(--danger); }
  .banner.ok { background:var(--teal-soft); color:var(--teal); }
  .hero { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 18px; }
  .hero b { display:block; font-size:13px; color:var(--muted); font-weight:500; }
  .badge { display:inline-block; border-radius:99px; padding:2px 10px; background:var(--amber-soft); color:var(--amber); font-size:13px; font-weight:600; }
  .badge.open { background:var(--teal-soft); color:var(--teal); }
  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .kpi { border:1px solid var(--line); border-radius:9px; padding:10px; }
  .kpi b { display:block; font-size:22px; line-height:1.2; }
  .kpi span { color:var(--muted); font-size:13px; }
  .teacher-card { border:1px solid var(--line); border-radius:10px; padding:14px; margin:12px 0; scroll-margin-top:24px; }
  .teacher-card > .toolbar { justify-content:space-between; }
  .teacher-card h3 { margin:0; }
  .peer-note { color:var(--amber); background:var(--amber-soft); border-radius:8px; padding:8px 10px; font-size:13px; }
  .picker-list { max-height:360px; overflow:auto; border:1px solid var(--line); border-radius:9px; }
  .picker-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line); margin:0; font-weight:400; min-height:44px; }
  .picker-row:last-child { border-bottom:0; }
  .picker-row input { width:20px; height:20px; flex:none; }
  .picker-row small { color:var(--muted); }
  .table-scroll { overflow-x:auto; max-width:100%; border:1px solid var(--line); border-radius:9px; }
  table { border-collapse:collapse; width:100%; min-width:700px; font-size:14px; }
  th, td { border-bottom:1px solid var(--line); padding:9px 10px; text-align:left; white-space:nowrap; }
  th { background:var(--bg); font-weight:600; }
  td:first-child, th:first-child { position:sticky; left:0; background:var(--white); z-index:1; min-width:130px; }
  th:first-child { background:var(--bg); z-index:2; }
  tr:last-child td { border-bottom:0; }
  .dot { display:inline-block; margin-right:5px; }
  .dot.sent { color:var(--teal); } .dot.pending { color:var(--amber); }
  .table-scroll button { min-height:36px; padding:4px 7px; font-size:13px; background:var(--teal-soft); color:var(--teal); }
  .mini { border-top:1px solid var(--line); margin-top:14px; padding-top:12px; }
  .check-label { display:flex; gap:8px; align-items:center; font-weight:400; }
  .check-label input { width:20px; height:20px; }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:60;
    max-width:min(90vw,520px); padding:10px 16px; border-radius:9px; color:var(--white);
    background:var(--ink); opacity:0; pointer-events:none; transition:opacity .18s; }
  #toast.show { opacity:1; } #toast.err { background:var(--danger); }
  @media (max-width:720px) {
    .row2, .row3, .hero { grid-template-columns:1fr; }
    .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media (max-width:420px) {
    body { padding:12px; }
    .toolbar > select { min-width:0; width:100%; }
    .toolbar > button, .actions > button { flex:1 1 100%; }
  }
</style>
<link rel="stylesheet" href="../app-shell.css?v=20261003-1">
</head>
<body>
<div class="wrap">
  <header>
    <h1>ประเมินครู 360°</h1>
    <p>เปิดรอบ จัดผู้ประเมิน ติดตามการส่ง และคีย์ผลส่วนที่ 4</p>
    <div class="nav">
      <a href="index.html">ภาพรวมบุคลากร</a>
      <a href="eval-rounds.html" class="active">ประเมินครู 360°</a>
      <a href="work-summary.html">สรุปเวลาทำงาน</a>
      <a href="my-work.html">ข้อมูลการทำงานของฉัน</a>
      <a href="#" id="btn-signout">ออกจากระบบ</a>
    </div>
    <script src="../app-shell.js?v=20261010-3"></script>
  </header>
  <main class="academic-content">
    <div id="gate" class="card" hidden></div>
    <div id="app" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
</div>
<script type="module">
import {
  requireAuth, signOut, checkDepartment, isPersonnelHead, applyPersonnelMenuAccess,
  listStaffPicker, getAcademicYears, academicYearOf, bangkokNow, toDateStr, thaiShortDateText,
  listEvalForms, loadEvalForm, listEvalRounds, loadEvalRoundAdmin, saveEvalRound, deleteEvalRound,
  setEvalRoundStatus, upsertEvalTarget, deleteEvalTarget, addEvalAssignment,
  setEvalAssignmentRater, deleteEvalAssignment, reopenEvalAssignment,
  upsertEvalSection4, deleteEvalSection4, upsertEvalAttendanceSnapshots,
  evalAssignmentProblems, evalSection4Check, buildEvalAttendanceSnapshot,
  loadWorkContext, summarizeStaff
} from "../supabase-client.js?v=20261010-3";

const session = await requireAuth();
if (!session) {
  // requireAuth กำลังพาไปหน้าเข้าสู่ระบบ
} else {
  const el = id => document.getElementById(id);
  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[ch]);
  const state = { forms:[], rounds:[], staff:[], years:[], data:null, form:null,
    showForm:false, editing:false, showPicker:false, search:"", preview:null, previewWarnings:[] };
  let toastTimer = null;
  const toast = (message, error = false) => {
    const box = el("toast"); box.textContent = message; box.classList.toggle("err", error);
    box.classList.add("show"); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => box.classList.remove("show"), 4500);
  };
  const staffName = id => state.staff.find(row => row.id === id)?.full_name || "ไม่พบชื่อ";
  const roundLabel = row => String(row.academic_year) + " · ครั้งที่ " + row.round_no;
  const today = () => toDateStr(bangkokNow());
  const actionButton = (action, label, className = "ghost", extra = "") =>
    '<button type="button" class="' + className + '" data-action="' + action + '" ' + extra + '>' + label + '</button>';
  const staffOptions = (selected = "", blank = "— เลือกบุคลากร —", headFirst = false) => {
    const rows = [...state.staff].sort((a,b) => headFirst
      ? Number((b.staff_position || "").includes("หัวหน้าฝ่าย")) - Number((a.staff_position || "").includes("หัวหน้าฝ่าย")) ||
        a.full_name.localeCompare(b.full_name, "th") : a.full_name.localeCompare(b.full_name, "th"));
    return '<option value="">' + esc(blank) + '</option>' + rows.map(row =>
      '<option value="' + esc(row.id) + '"' + (row.id === selected ? ' selected' : '') + '>' +
      esc(row.full_name) + ((row.staff_position || "").includes("หัวหน้าฝ่าย") && headFirst ? " · แนะนำ" : "") +
      '</option>').join("");
  };
  const variantSection = () => state.form?.sections.find(section => section.kind === "summary_entry");
  const variantOf = code => variantSection()?.variants.find(variant => variant.code === code);
  const targetAssignments = id => (state.data?.assignments || []).filter(row => row.target_id === id);
  const targetEntry = id => (state.data?.section4 || []).find(row => row.target_id === id);
  const targetSnapshot = id => (state.data?.snapshots || []).find(row => row.target_id === id);
  const problems = () => state.data ? evalAssignmentProblems({
    form:state.form, round:state.data.round, targets:state.data.targets, assignments:state.data.assignments
  }) : [];

  async function refresh(preferredId) {
    state.rounds = await listEvalRounds();
    const requested = preferredId || new URLSearchParams(location.search).get("round");
    const selected = state.rounds.find(row => row.id === requested) || state.rounds[0] || null;
    state.data = selected ? await loadEvalRoundAdmin(selected.id) : null;
    state.form = selected ? await loadEvalForm(selected.form_id) : null;
    const url = new URL(location.href);
    if (selected) url.searchParams.set("round", selected.id);
    else url.searchParams.delete("round");
    history.replaceState(null, "", url.pathname + url.search);
    render();
  }
  function renderRoundForm() {
    if (!state.showForm) return "";
    const row = state.editing ? state.data.round : {};
    const defaultYear = academicYearOf(today(), state.years) || "";
    const active = state.forms.filter(form => form.status === "active");
    const canEditAll = !state.editing || row.status === "setup";
    const formOptions = active.map(form => '<option value="' + esc(form.id) + '"' +
      (form.id === (row.form_id || active[0]?.id) ? ' selected' : '') + '>' + esc(form.code) + '</option>').join("");
    return '<section class="card" id="round-form-card"><h2>' + (state.editing ? "แก้หัวรอบ" : "เปิดรอบใหม่") + '</h2>' +
      '<div id="round-errors" class="error-summary" role="alert" tabindex="-1" hidden></div>' +
      '<form id="round-form" novalidate>' +
      '<div class="row2"><div class="field"><label for="form-id">ฉบับแบบประเมิน</label><select id="form-id" ' +
      (!canEditAll || (state.editing && state.data.targets.length) ? 'disabled' : '') + '>' + formOptions + '</select></div>' +
      '<div class="field"><label for="academic-year">ปีการศึกษา</label><input id="academic-year" type="text" value="' +
      esc(row.academic_year || defaultYear) + '" ' + (canEditAll ? '' : 'disabled') + '></div></div>' +
      '<div class="row2"><div class="field"><label for="round-no">ครั้งที่</label><select id="round-no" ' +
      (canEditAll ? '' : 'disabled') + '><option value="1"' + (Number(row.round_no || 1) === 1 ? ' selected' : '') +
      '>ครั้งที่ 1</option><option value="2"' + (Number(row.round_no) === 2 ? ' selected' : '') + '>ครั้งที่ 2</option></select></div>' +
      '<div class="field"><label for="director-id">ผู้อำนวยการ (ผู้กรอกส่วนที่ 1)</label><select id="director-id" ' +
      (canEditAll ? '' : 'disabled') + '>' + staffOptions(row.director_staff_id) + '</select></div></div>' +
      '<div class="row2"><div class="field"><label for="period-from">ช่วงนับเวลาเข้างาน จาก</label><input id="period-from" type="date" value="' +
      esc(row.period_from || "") + '" ' + (canEditAll ? '' : 'disabled') + '></div>' +
      '<div class="field"><label for="period-to">ถึง</label><input id="period-to" type="date" value="' +
      esc(row.period_to || "") + '" ' + (canEditAll ? '' : 'disabled') + '></div></div>' +
      '<div class="row2"><div class="field"><label for="eval-date">วันประเมิน</label><input id="eval-date" type="date" value="' +
      esc(row.eval_date || "") + '"></div><div class="field"><label for="due-date">กำหนดส่งคะแนน</label>' +
      '<input id="due-date" type="date" value="' + esc(row.due_date || "") + '"></div></div>' +
      '<div class="field"><label for="committee-id">กรรมการร่วม (ไม่บังคับ)</label><select id="committee-id" ' +
      (canEditAll ? '' : 'disabled') + '>' + staffOptions(row.committee_staff_id, "— ไม่ระบุ —") + '</select>' +
      '<p class="hint">ใช้แสดงชื่อในเอกสารเท่านั้น ไม่มีสิทธิ์กรอกในระบบ</p></div>' +
      '<div class="actions">' + actionButton("save-round", "บันทึกรอบ", "primary") +
      actionButton("cancel-round", "ยกเลิก") + '</div></form></section>';
  }
  function renderPicker() {
    if (!state.showPicker || !state.data || state.data.round.status !== "setup") return "";
    const excluded = new Set(state.data.targets.map(row => row.staff_id));
    const available = state.staff.filter(row => !excluded.has(row.id) && row.id !== state.data.round.director_staff_id);
    return '<section class="card" id="picker"><h2>เลือกครูเข้ารอบ</h2>' +
      '<p class="hint">ติ๊กครูผู้สอนให้ก่อน ตรวจรายชื่อก่อนเพิ่ม เพราะทะเบียนมีตำแหน่งอื่นอยู่ด้วย</p>' +
      '<div class="field"><label for="staff-search">ค้นหาชื่อ</label><input id="staff-search" type="search" value="' +
      esc(state.search) + '"></div><div class="picker-list">' +
      available.map(row => '<label class="picker-row" data-name="' + esc(row.full_name.toLowerCase()) + '">' +
        '<input type="checkbox" name="picked-staff" value="' + esc(row.id) + '"' +
        ((row.staff_position || "").includes("ครูผู้สอน") ? ' checked' : '') + '><span>' +
        esc(row.full_name) + '<br><small>' + esc(row.staff_position || "ไม่ระบุตำแหน่ง") +
        '</small></span></label>').join("") +
      (available.length ? '' : '<div class="empty">ไม่มีรายชื่อที่เพิ่มได้</div>') + '</div>' +
      '<div class="actions">' + actionButton("add-targets", "เพิ่มครูที่เลือก", "primary") +
      actionButton("close-picker", "ยกเลิก") + '</div></section>';
  }
  function renderTarget(target) {
    const round = state.data.round, mine = targetAssignments(target.id);
    const deptSection = state.form.sections.find(section => section.kind === "dept_head");
    const peerSection = state.form.sections.find(section => section.kind === "peer");
    const dept = mine.find(row => row.section_code === deptSection?.code)?.rater_staff_id || "";
    const peers = mine.filter(row => row.section_code === peerSection?.code).map(row => row.rater_staff_id);
    const variant = variantOf(target.variant_code);
    const entry = targetEntry(target.id);
    const check = variant ? evalSection4Check(variantSection(), variant, entry, state.form.rules) : null;
    const showAssignment = round.status === "setup" || round.status === "open";
    let html = '<article class="teacher-card" id="teacher-' + esc(target.id) + '" data-target="' + esc(target.id) + '">' +
      '<div class="toolbar"><h3>' + esc(staffName(target.staff_id)) + '</h3>' +
      (round.status === "setup" ? actionButton("remove-target", "เอาครูออก", "danger", 'data-target="' + esc(target.id) + '"') : '') +
      '</div>';
    if (showAssignment) {
      html += '<div class="row2"><div class="field"><label>หัวหน้าฝ่ายผู้ประเมิน (1 คน)</label>' +
        '<select data-role="dept">' + staffOptions(dept, "— เลือกหัวหน้าฝ่าย —", true) + '</select>' +
        '<div class="field-error" data-problem="dept"></div></div>' +
        '<div class="field"><label>แบบส่วนที่ 4</label><select data-role="variant">' +
        '<option value="">— เลือกแบบ —</option>' + (variantSection()?.variants || []).map(row =>
          '<option value="' + esc(row.code) + '"' + (row.code === target.variant_code ? ' selected' : '') +
          '>' + esc(row.code + " · " + row.title) + '</option>').join("") +
        '</select><div class="field-error" data-problem="variant"></div></div></div>' +
        '<div class="field"><label>เพื่อนครูผู้ประเมิน (2–3 คน)</label><div class="row3">' +
        [0,1,2].map(index => '<select data-role="peer" aria-label="เพื่อนครูคนที่ ' + (index + 1) + '">' +
          staffOptions(peers[index], "— ไม่เลือก —") + '</select>').join("") +
        '</div><div class="field-error" data-problem="peer"></div>' +
        '<p class="peer-note">ญาติ/เพื่อนสนิท ระบบตรวจไม่ได้ — ฝ่ายบุคคลเลือกตามคำชี้แจงข้อ 8</p></div>' +
        '<div class="field"><label>ภาระงาน (ไม่บังคับ)</label><input type="text" data-role="workload" value="' +
        esc(target.workload || "") + '"></div><div class="field-error" data-problem="other"></div>' +
        '<div class="actions">' + actionButton("save-assignment", "บันทึกการจัดผู้ประเมิน", "ghost",
          'data-target="' + esc(target.id) + '"') + '</div>';
    } else {
      html += '<p class="meta">หัวหน้าฝ่าย: ' + esc(staffName(dept)) + ' · เพื่อนครู ' + peers.length +
        ' คน · แบบ ' + esc(target.variant_code || "ยังไม่เลือก") + '</p>';
    }
    if (round.status === "open" || round.status === "closed") {
      html += '<div class="mini"><h3>คีย์ผลส่วนที่ 4' + (variant ? " · " + esc(variant.code) : "") + '</h3>';
      if (!variant) html += '<p class="banner warn">เลือกแบบ 4ก/4ข ก่อนคีย์ผล</p>';
      else {
        html += '<div class="row2"><div class="field"><label>' + esc(variant.avg_label) +
          '</label><input data-s4="avg" type="number" inputmode="decimal" min="1" max="5" step="0.01" value="' +
          esc(entry?.avg_score ?? "") + '"></div><div class="field"><label>' + esc(variant.respondent_label) +
          '</label><input data-s4="respondents" type="number" inputmode="numeric" min="0" step="1" value="' +
          esc(entry?.respondents ?? "") + '"></div></div>' +
          (variant.star_items || []).map(item =>
            '<div class="field"><label>★ ' + esc(item.code + " " + item.label) +
            '</label><input data-s4-star="' + esc(item.code) +
            '" type="number" inputmode="decimal" min="1" max="5" step="0.01" value="' +
            esc(entry?.star_values?.[item.code] ?? "") + '"></div>').join("") +
          '<div class="field"><label>หมายเหตุ</label><textarea data-s4="note">' +
          esc(entry?.note || "") + '</textarea></div><div class="field-error" data-problem="section4"></div>' +
          '<div class="actions">' + actionButton("save-section4", "บันทึกส่วนที่ 4", "ghost",
            'data-target="' + esc(target.id) + '"') +
          (entry ? actionButton("clear-section4", "ล้างค่าส่วนที่ 4", "danger",
            'data-target="' + esc(target.id) + '"') : '') + '</div>';

          const row = roundValues(), errors = validateRound(row);
          showRoundErrors(errors); if (errors.length) return;
          const oldDirector = state.editing ? state.data.round.director_staff_id : null;
          let saved;
          try { saved = await saveEvalRound(row); }
          catch (error) {
            if (/duplicate key|eval_rounds_academic_year_round_no_key/.test(error.message))
              throw new Error("มีรอบ " + row.academic_year + " ครั้งที่ " + row.round_no + " แล้ว");
            throw error;
          }
          if (oldDirector && oldDirector !== row.director_staff_id)
            for (const target of state.data.targets)
              for (const section of state.form.sections.filter(section => section.kind === "committee"))
                for (const assignment of targetAssignments(target.id).filter(item => item.section_code === section.code))
                  await setEvalAssignmentRater(assignment.id, row.director_staff_id);
          state.showForm = false; state.editing = false; await refresh(saved.id);
          toast("บันทึกรอบแล้ว");
        } else if (action === "delete-round") {
          const round = state.data.round, label = round.academic_year + "/" + round.round_no;
          if (!await window.crsAskConfirm({ title:"ลบรอบประเมิน " + roundLabel(round),
            message:"ครูในรอบ " + state.data.targets.length + " คนและแบบที่จัดไว้จะถูกลบถาวร",
            requireText:label, okLabel:"ลบรอบ", danger:true })) return;
          await deleteEvalRound(round.id); state.showForm = false; await refresh(null); toast("ลบรอบแล้ว");
        } else if (action === "open-picker") { state.showPicker = true; state.search = ""; render(); }
        else if (action === "close-picker") { state.showPicker = false; render(); }
        else if (action === "add-targets") {
          const ids = [...el("picker").querySelectorAll('input[name="picked-staff"]:checked')].map(node => node.value);
          if (!ids.length) { toast("เลือกครูอย่างน้อย 1 คน", true); return; }
          const round = state.data.round;
          for (const staffId of ids) {
            const target = await upsertEvalTarget({ round_id:round.id, staff_id:staffId });
            try {
              for (const section of state.form.sections.filter(row => row.kind === "committee" || row.kind === "self"))
                await addEvalAssignment({ target_id:target.id, section_code:section.code,
                  rater_staff_id:section.kind === "committee" ? round.director_staff_id : staffId });
            } catch (error) { await deleteEvalTarget(target.id); throw error; }
          }
          state.showPicker = false; await refresh(round.id); toast("เพิ่มครูเข้ารอบแล้ว");
        } else if (action === "remove-target") {
          const target = state.data.targets.find(row => row.id === id);
          if (!await window.crsAskConfirm({ title:"เอาครูออกจากรอบ",
            message:staffName(target.staff_id) + " และแบบที่จัดไว้ทั้งหมดจะถูกลบถาวร",
            requireText:staffName(target.staff_id), okLabel:"เอาครูออก", danger:true })) return;
          await deleteEvalTarget(id); await refresh(state.data.round.id); toast("เอาครูออกแล้ว");
        } else if (action === "save-assignment") await saveAssignment(id);
        else if (action === "save-section4") await saveSection4(id);
        else if (action === "clear-section4") {
          if (!await window.crsAskConfirm({ title:"ล้างค่าส่วนที่ 4",
            message:"ผลที่คีย์ของ " + staffName(state.data.targets.find(row => row.id === id).staff_id) +
              " จะถูกลบ เพื่อให้เปลี่ยนแบบ 4ก/4ข ได้",
            okLabel:"ล้างค่า", danger:true })) return;
          await deleteEvalSection4(id); await refresh(state.data.round.id); toast("ล้างค่าส่วนที่ 4 แล้ว");
        } else if (action === "start-round") {
          if (!await window.crsAskConfirm({ title:"เริ่มรอบประเมิน",
            message:"เริ่มรอบแล้วเปลี่ยนฉบับ/ผอ. และเอาครูออกไม่ได้ ผู้ประเมินจะเริ่มกรอกได้",
            okLabel:"เริ่มรอบ" })) return;
          await setEvalRoundStatus(state.data.round.id, "open");
          await refresh(state.data.round.id); toast("เริ่มรอบแล้ว");
        } else if (action === "reopen-assignment") {
          const row = state.data.assignments.find(item => item.id === button.dataset.assignment);
          const target = state.data.targets.find(item => item.id === row.target_id);
          if (!await window.crsAskConfirm({ title:"เปิดแบบคืนให้แก้",
            message:staffName(row.rater_staff_id) + " จะกลับไปแก้แบบของ " + staffName(target.staff_id) +
              " ได้ และสถานะจะเปลี่ยนเป็นยังไม่ส่ง", okLabel:"เปิดแบบคืน" })) return;
          await reopenEvalAssignment(row.id); await refresh(state.data.round.id); toast("เปิดแบบคืนแล้ว");
        } else if (action === "preview-attendance") await previewAttendance();
        else if (action === "save-attendance") {
          if (state.previewWarnings.length && !el("attendance-verified")?.checked) {
            toast("ติ๊ก “ตรวจแล้ว ถูกต้อง” ก่อนบันทึกตัวเลขที่ไม่พบเวลาเข้างาน", true); return;
          }
          if (state.data.snapshots.length &&
            !await window.crsAskConfirm({ title:"ดึงตัวเลขซ้ำ",
              message:"ตัวเลขเดิมจะถูกทับ ผอ. อาจให้คะแนนจากตัวเลขเดิมไปแล้ว",
              okLabel:"ทับตัวเลขเดิม", danger:true })) return;
          await upsertEvalAttendanceSnapshots(state.preview.map(row => ({ target_id:row.target_id, data:row.data })));
          state.preview = null; await refresh(state.data.round.id); toast("ล็อกตัวเลขเวลาเข้างานแล้ว");
        } else if (action === "close-round") {
          const pending = [];
          for (const target of state.data.targets) {
            const rows = targetAssignments(target.id);
            if (rows.some(row => row.status !== "submitted")) pending.push(staffName(target.staff_id) + ": ยังมีแบบไม่ส่ง");
            if (variantSection() && !targetEntry(target.id)) pending.push(staffName(target.staff_id) + ": ยังไม่คีย์ส่วนที่ 4");
            if (!targetSnapshot(target.id)) pending.push(staffName(target.staff_id) + ": ยังไม่ล็อกตัวเลข");
          }
          if (!await window.crsAskConfirm({ title:"ปิดรับคะแนน",
            message:pending.length ? "รายการค้าง: " + pending.join(" · ") : "ผู้ประเมินจะส่งคะแนนเพิ่มไม่ได้จนกว่าจะเปิดรับอีกครั้ง",
            okLabel:"ปิดรับคะแนน" })) return;
          await setEvalRoundStatus(state.data.round.id, "closed");
          await refresh(state.data.round.id); toast("ปิดรับคะแนนแล้ว");
        } else if (action === "reopen-round") {
          if (!await window.crsAskConfirm({ title:"เปิดรับคะแนนอีกครั้ง",
            message:"ผู้ประเมินจะกลับมากรอกและส่งแบบได้", okLabel:"เปิดรับคะแนน" })) return;
          await setEvalRoundStatus(state.data.round.id, "open");
          await refresh(state.data.round.id); toast("เปิดรับคะแนนอีกครั้งแล้ว");
        }
      });
    });
  }
}
</script>
</body>
</html>
