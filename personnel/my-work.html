<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ข้อมูลการทำงานของฉัน — CRS MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2a2e; --muted:#5f6b70; --line:#dfe4e3; --teal:#0f6e56; --teal-soft:#e1f5ee;
          --bg:#f7f8f7; --white:#fff; --danger:#a32d2d; --danger-soft:#fceaea;
          --amber:#8a5a00; --amber-soft:#fff4df; --blue:#1f5aa8; }
  * { box-sizing:border-box; }
  body { font-family:"Sarabun",sans-serif; color:var(--ink); background:var(--bg);
         margin:0; padding:16px; font-size:16px; line-height:1.6; }
  .wrap { max-width:620px; margin:0 auto; }
  header h1 { font-size:20px; font-weight:600; margin:4px 0; }
  header p { color:var(--muted); margin:0 0 8px; font-size:14px; }
  header .nav { display:flex; gap:8px; flex-wrap:wrap; background:var(--white); padding:8px;
                border-radius:99px; border:1px solid var(--line);
                box-shadow:0 4px 12px rgba(0,0,0,.05); margin:0 0 24px; align-items:center; }
  header .nav a { color:var(--muted); text-decoration:none; font-weight:500;
                  padding:8px 16px; border-radius:99px; font-size:14px; }
  header .nav a.active { background:var(--teal); color:var(--white); }
  header .nav #btn-signout { margin-left:auto; color:var(--danger); background:#fff0f0; }

  .card { background:var(--white); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-bottom:16px; }
  select, input[type="month"] { width:100%; font-family:inherit; font-size:16px; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; background:var(--white); color:var(--ink); }
  label { display:block; font-weight:500; margin-bottom:6px; font-size:15px; }
  .field { margin-bottom:14px; } .field:last-child { margin-bottom:0; }
  .field-note { color:var(--muted); font-size:13px; margin-top:4px; }
  .section-title { font-size:12px; font-weight:600; color:var(--muted);
                   text-transform:uppercase; letter-spacing:.03em; margin:4px 0 10px; }
  .banner { padding:11px 13px; border-radius:10px; font-size:14px; margin-bottom:14px; }
  .banner.warn { background:var(--amber-soft); color:var(--amber); }
  .banner.info { background:var(--teal-soft); color:var(--teal); }

  .today { display:flex; align-items:center; gap:12px; padding:14px; border-radius:12px;
           background:var(--teal-soft); margin-bottom:14px; }
  .today .big { font-size:20px; font-weight:700; color:var(--teal); }
  .today .sub { color:var(--muted); font-size:14px; }

  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (min-width:560px) { .stats { grid-template-columns:repeat(4,1fr); } }
  .stat { padding:12px; border:1px solid var(--line); border-radius:10px; background:#fbfdfd; }
  .stat b { display:block; font-size:24px; font-weight:700; line-height:1.2; }
  .stat span { color:var(--muted); font-size:13px; }
  .stat.warn b { color:var(--amber); } .stat.bad b { color:var(--danger); }

  .quota-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .quota-row:last-child { border-bottom:none; }
  .quota-row .name { flex:1; font-weight:500; }
  .quota-row .used { color:var(--muted); font-size:14px; }
  .quota-row .left { font-weight:700; color:var(--teal); }
  .quota-row .left.none { color:var(--danger); }

  .day-row { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .day-row:last-child { border-bottom:none; }
  .day-row .d { width:110px; color:var(--muted); font-size:14px; }
  .day-row .s { flex:1; font-weight:500; }
  .day-row .t { color:var(--muted); font-size:14px; }
  .s.present { color:var(--teal); } .s.late { color:var(--amber); }
  .s.absent { color:var(--danger); } .s.leave { color:var(--blue); }
  .s.holiday, .s.pending { color:var(--muted); font-weight:400; }
  .muted-empty { color:var(--muted); text-align:center; padding:18px 0; }
</style>
<link rel="stylesheet" href="../app-shell.css?v=20260725-1">
</head>
<body>
<div class="wrap">
  <header>
    <h1>ข้อมูลการทำงานของฉัน</h1>
    <p>สรุปการมา สาย ขาด และสิทธิ์วันลาคงเหลือของคุณ</p>
    <div class="nav">
      <a href="index.html">ภาพรวมบุคลากร</a>
      <a href="leave.html">บันทึกการลา</a>
      <a href="staff.html">ทะเบียนบุคลากร</a>
      <a href="hr-settings.html">ตั้งค่างานบุคคล</a>
      <a href="work-summary.html">สรุปเวลาทำงาน</a>
      <a href="my-work.html">ข้อมูลการทำงานของฉัน</a>
      <a href="#" id="btn-signout">ออกจากระบบ</a>
    </div>
    <script src="../app-shell.js?v=20260725-4"></script>
  </header>

  <div id="gate" class="card" style="display:none"></div>

  <div id="content" style="display:none">
    <div class="card">
      <div id="today-box"></div>
      <div class="field">
        <label for="month">ดูข้อมูลเดือน</label>
        <input id="month" type="month">
      </div>
    </div>

    <div class="card">
      <div class="section-title" id="year-title">สะสมทั้งปีการศึกษา</div>
      <div class="stats" id="year-stats"></div>
      <div style="margin-top:14px">
        <div class="section-title">สิทธิ์วันลา</div>
        <div id="quota-list"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title" id="month-title">รายเดือน</div>
      <div class="stats" id="month-stats" style="margin-bottom:14px"></div>
      <div id="month-days"></div>
    </div>
  </div>
</div>

<script type="module">
import { sb, requireAuth, signOut, checkDepartment, applyPersonnelMenuAccess,
         loadWorkContext, summarizeStaff, WORK_STATUS_LABEL,
         getAcademicYears, academicYearRange, academicYearOf, getLeaveQuotas,
         bangkokNow, toDateStr, computeDayStatus } from "../supabase-client.js?v=20260725-4";

const session = await requireAuth();
if (session) {
  // ทุกคนที่ล็อกอินเปิดหน้านี้ได้ แต่เห็นเฉพาะข้อมูลของตัวเอง (บังคับจริงด้วย RLS)
  applyPersonnelMenuAccess(await checkDepartment("บุคลากร"));
  const el = id => document.getElementById(id);
  el("btn-signout")?.addEventListener("click", e => { e.preventDefault(); signOut(); });

  // หาแถวบุคลากรที่ผูกกับบัญชีล็อกอินนี้
  const { data: rows } = await sb.from("staff").select("*").eq("user_id", session.user.id).limit(1);
  const me = (rows || [])[0];

  if (!me) {
    el("gate").style.display = "";
    el("gate").innerHTML = '<div class="banner warn"><b>ยังไม่ได้ผูกบัญชีของคุณกับทะเบียนบุคลากร</b><br>' +
      'ให้ฝ่ายบุคลากรเข้าหน้า “ทะเบียนบุคลากร” แล้วเลือกบัญชีล็อกอินของคุณในช่อง ' +
      '“บัญชีล็อกอินของคนนี้” จากนั้นหน้านี้จะแสดงข้อมูลของคุณได้</div>';
  } else {
    el("content").style.display = "";
    const today = toDateStr(bangkokNow());
    el("month").value = today.slice(0, 7);

    const years = await getAcademicYears();
    const THAI_WD = ["อา","จ","อ","พ","พฤ","ศ","ส"];

    async function renderYear() {
      const year = academicYearOf(today, years);
      if (!year) {
        el("year-title").textContent = "สะสมทั้งปีการศึกษา";
        el("year-stats").innerHTML = '<div class="banner warn" style="grid-column:1/-1">ยังไม่ได้กำหนดปีการศึกษาในระบบ (ตั้งได้ที่หน้าตั้งค่างานบุคคล)</div>';
        el("quota-list").innerHTML = "";
        return;
      }
      const range = academicYearRange(year, years);
      const to = range.end > today ? today : range.end;
      const ctx = await loadWorkContext(range.start, to);
      const s = summarizeStaff(me, range.start, to, ctx);

      el("year-title").textContent = `สะสมปีการศึกษา ${year} (ถึงวันนี้)`;
      el("year-stats").innerHTML = `
        <div class="stat"><b>${s.workDays}</b><span>วันทำงาน</span></div>
        <div class="stat"><b>${s.present}</b><span>มา (วัน)</span></div>
        <div class="stat warn"><b>${s.late} ครั้ง</b><span>รวม ${s.lateMinutes} นาที</span></div>
        <div class="stat bad"><b>${s.absent}</b><span>ขาด (วัน)</span></div>`;

      const quotas = await getLeaveQuotas(year);
      const codes = new Set([...Object.keys(quotas), ...Object.keys(s.leaveByType)]);
      el("quota-list").innerHTML = codes.size
        ? [...codes].map(code => {
            const used = s.leaveByType[code] || 0;
            const quota = quotas[code];
            if (quota === undefined) {
              return `<div class="quota-row"><span class="name">${code}</span>
                <span class="used">ใช้ไป ${used} วัน</span><span class="left">ไม่จำกัด</span></div>`;
            }
            const left = quota - used;
            return `<div class="quota-row"><span class="name">${code}</span>
              <span class="used">ใช้ไป ${used} จาก ${quota} วัน</span>
              <span class="left ${left <= 0 ? "none" : ""}">${left <= 0 ? "หมดสิทธิ์" : "เหลือ " + left + " วัน"}</span></div>`;
          }).join("")
        : '<div class="field-note">ยังไม่ได้กำหนดโควตาวันลาสำหรับปีนี้</div>';
    }

    async function renderMonth() {
      const m = el("month").value;
      if (!m) return;
      const [yy, mm] = m.split("-").map(Number);
      const from = m + "-01";
      const lastOfMonth = new Date(Date.UTC(yy, mm, 0)).toISOString().slice(0, 10);
      const to = lastOfMonth > today ? today : lastOfMonth;

      const ctx = await loadWorkContext(from, to);
      const s = summarizeStaff(me, from, to, ctx);
      const label = new Date(from + "T00:00:00Z")
        .toLocaleDateString("th-TH", { month: "long", year: "numeric", timeZone: "UTC" });

      el("month-title").textContent = label;
      const leaveText = Object.entries(s.leaveByType).map(([k, v]) => `${k} ${v}`).join(" · ") || "—";
      el("month-stats").innerHTML = `
        <div class="stat"><b>${s.present}</b><span>มา (วัน)</span></div>
        <div class="stat warn"><b>${s.late} ครั้ง</b><span>รวม ${s.lateMinutes} นาที</span></div>
        <div class="stat bad"><b>${s.absent}</b><span>ขาด (วัน)</span></div>
        <div class="stat"><b>${s.leaveDays}</b><span>ลา: ${leaveText}</span></div>`;

      el("month-days").innerHTML = s.rows.length ? s.rows.map(r => {
        const d = new Date(r.date + "T00:00:00Z");
        const dl = `${d.getUTCDate()} ${d.toLocaleDateString("th-TH", { month: "short", timeZone: "UTC" })} ${THAI_WD[d.getUTCDay()]}.`;
        let text = WORK_STATUS_LABEL[r.status];
        if (r.status === "leave") text = `ลา (${r.leaveType}${r.portion !== "full" ? " ครึ่งวัน" : ""})`;
        if (r.status === "present" && r.exempt) text = "มา (อนุโลม)";
        const time = r.firstIn ? String(r.firstIn).slice(0, 5) + " น." : "";
        const extra = r.lateMinutes ? ` (สาย ${r.lateMinutes} นาที)` : "";
        return `<div class="day-row"><span class="d">${dl}</span>
          <span class="s ${r.status}">${text}${extra}</span><span class="t">${time}</span></div>`;
      }).join("") : '<div class="muted-empty">ไม่มีข้อมูลในเดือนนี้</div>';

      // สถานะของวันนี้ (แสดงเด่นด้านบน)
      const ctxToday = await loadWorkContext(today, today);
      const r = computeDayStatus(me, today, ctxToday);
      let text = WORK_STATUS_LABEL[r.status];
      if (r.status === "late") text = `สาย ${r.lateMinutes} นาที`;
      if (r.status === "leave") text = `ลา (${r.leaveType})`;
      if (r.status === "present" && r.exempt) text = "มา (อนุโลม)";
      const dToday = new Date(today + "T00:00:00Z")
        .toLocaleDateString("th-TH", { day: "numeric", month: "long", timeZone: "UTC" });
      el("today-box").innerHTML = `<div class="today">
        <div><div class="big">${text}</div>
        <div class="sub">วันนี้ ${dToday}${r.firstIn ? " · ลงเวลา " + String(r.firstIn).slice(0,5) + " น." : ""}</div></div>
      </div>`;
    }

    el("month").addEventListener("change", renderMonth);
    await renderMonth();
    await renderYear();
  }
}
</script>
</body>
</html>
