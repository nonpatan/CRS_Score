<style>

@media(max-width:600px) { .view-buttons button { flex:1 1 calc(50% - 8px); } .actions button { flex:1 1 calc(50% - 8px); } }

     ดันแผ่นล้นเป็น 2 หน้า · ใช้ html body ... !important ให้ชนะ (app-shell.css โหลดทีหลัง) */

  html body main,html body .academic-content,html body.academic-shell .wrap > .academic-content { display:block!important; width:auto!important; max-width:none!important; margin:0!important; padding:0!important; }

  .sheet .right { margin-left:auto; text-align:right; font-size:9.5pt; color:var(--muted); line-height:1.4; white-space:nowrap; }

  .sheet table.p thead .t { display:block; font-size:7.5pt; font-weight:500; opacity:.95; white-space:nowrap; }
  .sheet table.p tbody th { font-size:12pt; font-weight:700; vertical-align:middle; background:var(--teal-soft); color:var(--teal); }
  .sheet table.p td.brk { background:repeating-linear-gradient(135deg,#f4f6f5 0 1.2mm,#e6eae8 1.2mm 2.4mm); text-align:center; vertical-align:middle; padding:0; }

  .sheet table.p td.sub .de { font-size:8pt; font-weight:600; color:var(--d); line-height:1.25; margin-top:.8mm; }

  .sheet .foot { display:flex; gap:3mm 5mm; flex-wrap:wrap; align-items:center; margin-top:2.5mm; font-size:8.5pt; }

  .sheet tr { break-inside:avoid; }
  a[href]::after { content:""; }
}

import { sb, requireAuth, signOut, fetchAllRows } from '../supabase-client.js?v=20261104-1';
import { buildGrid, chooseTimetable, loadTimetableDetails, normalizeDetails, pruneTimetableCache, swapCandidates, isoWeekday, attendancePeriodsOf } from './timetable-fet.js?v=20261102-3';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const weekdays=['','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];
const params=new URLSearchParams(location.search);
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const timeNow=()=>new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());
const weekdayNow=()=>{const date=new Date(),parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',weekday:'long'}).format(date);return ({Monday:1,Tuesday:2,Wednesday:3,Thursday:4,Friday:5,Saturday:6,Sunday:7})[parts];};
const dateThai=value=>new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',year:'numeric'}).format(new Date(`${value}T12:00:00`));
const rangeText=row=>`${dateThai(row.start_date)}–${dateThai(row.end_date)}`;
const roomName=room=>`${room.grade_level}/${room.classroom}`;
const SWAP_SET_SELECT='id,year,term,name,start_date,end_date,updated_at,timetable_swaps(id,status,a_placement_id,a_date,b_placement_id,b_date,from_staff_id,to_staff_id,grade_level,classroom,reason,respond_note,decide_note,requested_at)';
// cache รายชุดใช้คีย์ crs_tt_v1_<id>; อ่านได้เฉพาะเมื่อ updated_at จากเซิร์ฟเวอร์ตรงกัน
const safeStorage=()=>{try{return localStorage;}catch{return null;}};
let sets=[], selected=null, details=null, lessons=[], colors=new Map(), myStaffId=null, isAcademic=false, view='', target='';
let swapChoice=null, swapCandidatesForDay=[], holidays=new Map(), swapBusy=false;
let detailPlacementId=null, detailBusy=false, detailOpenToken=0, detailSplitOptions=null;
let attendanceExtra=0;
const staleHeaders=new Set();
function normalizeAttendanceExtra(raw) {
  const value=String(raw??'').trim();
  if(!/^\d+(?:\.\d+)?$/.test(value))return 0;
  const numeric=Number(value);
  return Number.isFinite(numeric)?Math.min(10,Math.floor(numeric*2)/2):0;
}
async function loadAttendanceExtra() {
  try {
    const {data,error}=await sb.from('app_settings').select('value').eq('key','timetable_attendance_extra_max').maybeSingle();
    if(error)throw error;
    attendanceExtra=normalizeAttendanceExtra(data?.value);
  } catch { attendanceExtra=0; }
}
function fail(result,label) { if(result.error) throw new Error(`${label}: ${result.error.message}`); return result.data; }
function showError(message) { $('load-state').textContent=''; $('load-error').textContent=message; $('controls').hidden=true; $('schedule-card').hidden=true; }
function readStaffCache(uid) { try {const raw=localStorage.getItem(`crs_my_staff_${uid}`);if(raw!==null){const value=JSON.parse(raw);if(typeof value==='string')return {hit:true,value};}if(sessionStorage.getItem(`crs_my_staff_${uid}`)==='null')return {hit:true,value:null};}catch{}return {hit:false,value:null}; }
async function getMyStaffId(uid) {
  const cached=readStaffCache(uid); if(cached.hit) return cached.value;
  const result=await sb.rpc('my_staff_id');
  const id=fail(result,'โหลดข้อมูลครูของฉัน')??null;
  try { if(id) localStorage.setItem(`crs_my_staff_${uid}`,JSON.stringify(id)); else {localStorage.removeItem(`crs_my_staff_${uid}`);sessionStorage.setItem(`crs_my_staff_${uid}`,'null');} } catch {}
  return id;
}
async function getAcademicAccess(uid) {
  const key=`crs_tt_academic_${uid}`;
  try {const cached=sessionStorage.getItem(key);if(cached!==null)return cached==='true';}catch{}
  try {
    const response=await sb.rpc('has_department',{p_department:'วิชาการ'});
    if(response.error) return false;
    const allowed=response.data===true;
    try {sessionStorage.setItem(key,String(allowed));}catch{}
    return allowed;
  } catch {return false;}
}
const canSeeLink=lesson=>isAcademic||lesson.teachers.some(teacher=>teacher.staff_id===myStaffId&&Boolean(myStaffId));
function teacherChoices() {
  const map=new Map();
  for(const lesson of lessons) for(const teacher of lesson.teachers) {
    const key=teacher.staff_id||teacher.display_name;
    if(!map.has(key)) map.set(key,{key,name:teacher.display_name,staffId:teacher.staff_id||null});
  }
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'th'));
}
function roomChoices() {
  return [...new Set(lessons.flatMap(lesson=>lesson.rooms.map(roomName)))].sort((a,b)=>{
    const rank=name=>name.startsWith('ป.')?0:name.startsWith('ม.')?1:2;
    return rank(a)-rank(b)||a.localeCompare(b,'th',{numeric:true});
  }).map(name=>({key:name,name}));
}
function facilityChoices() {
  const map=new Map();
  for(const lesson of lessons) if(lesson.facility_id && lesson.placements.length) map.set(lesson.facility_id,lesson.facility||'ห้องปฏิบัติการ');
  return [...map].map(([key,name])=>({key,name})).sort((a,b)=>a.name.localeCompare(b.name,'th'));
}
function currentChoices() { return view==='teacher'?teacherChoices():view==='facility'?facilityChoices():roomChoices(); }
function myAvailable() { return Boolean(myStaffId && lessons.some(lesson=>lesson.teachers.some(teacher=>teacher.staff_id===myStaffId))); }
function option(value,label) { return `<option value="${esc(value)}">${esc(label)}</option>`; }
function linkState() {
  const url=new URL(location.href); url.searchParams.set('tt',selected.id); url.searchParams.set('view',view);
  for(const key of ['room','teacher','facility']) url.searchParams.delete(key);

function itemDetail(lesson,kind) {
  const rooms=lesson.rooms.map(roomName).join(', '), teachers=lesson.teachers.map(row=>row.display_name).join(', ');
  if(kind==='room') return [teachers,lesson.facility].filter(Boolean).join(' · ');
  if(kind==='facility') return [rooms,teachers].filter(Boolean).join(' · ');
  return [rooms,lesson.facility].filter(Boolean).join(' · ');
}
const isSubject=lesson=>Boolean(lesson.subject_id)||(lesson.rooms.length===1&&lesson.teachers.length>=1);
const subjectKey=title=>String(title).trim().split(/[\s/(]/)[0];
function subjectColors(allLessons) {
  const sheetsOf=new Map(), counts=new Map();
  for(const lesson of allLessons) if(isSubject(lesson)) {
    const key=subjectKey(lesson.title), sheets=sheetsOf.get(key)||new Set();
    lesson.rooms.forEach(room=>sheets.add(`r:${roomName(room)}`));
    lesson.teachers.forEach(teacher=>sheets.add(`t:${teacher.staff_id||teacher.display_name}`));
    sheetsOf.set(key,sheets);
    counts.set(key,(counts.get(key)||0)+lesson.placements.length);
  }
  const keys=[...sheetsOf.keys()].sort((a,b)=>counts.get(b)-counts.get(a)||a.localeCompare(b,'th'));
  const assigned=new Map();
  for(const [index,key] of keys.entries()) {
    const used=new Set([...assigned].filter(([other])=>[...sheetsOf.get(other)].some(sheet=>sheetsOf.get(key).has(sheet))).map(([,color])=>color));
    let color=1; while(used.has(color)&&color<14) color++;
    assigned.set(key,used.has(color)?index%14+1:color);
  }
  return assigned;
}
const colorStyle=lesson=>{const color=colors.get(subjectKey(lesson.title))||1;return `--c:var(--s${color});--d:var(--s${color}d)`;};
function subjectLegend(rows) {
  const seen=new Map();
  for(const row of rows) for(const cell of row.cells) for(const {lesson} of cell.items)
    if(isSubject(lesson)) seen.set(subjectKey(lesson.title),colors.get(subjectKey(lesson.title))||1);
  return seen;
}
// กิจกรรมเดียวกันในคอลัมน์เดียวกันของวันติดกัน → ผสานแนวตั้ง (เฉพาะกิจกรรม ไม่รวมวิชาและช่องชนกัน)
function verticalRuns(rows) {
  const rowspan=new Map(), skip=new Set();
  const sig=cell=>cell&&!cell.break&&cell.items.length===1&&!isSubject(cell.items[0].lesson)?`${cell.items[0].lesson.title}|${cell.span||1}`:null;
  (rows[0]?.cells||[]).forEach((_,col)=>{
    let start=0;
    for(let r=1;r<=rows.length;r++) {
      const current=r<rows.length?sig(rows[r].cells[col]):null;
      if(current&&current===sig(rows[start].cells[col])) { skip.add(`${r}:${col}`); continue; }
      if(r-start>1) rowspan.set(`${start}:${col}`,r-start);
      start=r;
    }
  });
  return {rowspan,skip};
}
function buildTable(item,kind,printing=false) {

    return `<th scope="col" class="${column.kind==='กิจกรรม'?'activity':column.kind==='คาบเรียน'?'teach-head':'other'}"><span class="period">${esc(label)}</span><span class="clock">${esc(time)}</span></th>`;
  }).join('')}</tr></thead>`;
  const body=rows.map((row,rowIndex)=>`<tr class="${!printing&&isToday&&row.weekday===day?'is-today':''}"><th scope="row" class="${!printing&&isToday&&row.weekday===day?'today':''}">${weekdays[row.weekday]}${!printing&&isToday&&row.weekday===day?'<span class="badge">วันนี้</span>':''}</th>${row.cells.map((cell,index)=>{

    const content=cell.items.map(({lesson,placement})=>{

        ((s.a_placement_id===placement.id&&s.a_date>today())||(s.b_placement_id===placement.id&&s.b_date>today())));

    }).join('');

  }).join('')}</tr>`).join('');

  const colgroup=`<colgroup><col class="day">${details.columns.map(column=>`<col class="${column.kind==='พัก'?'brk':column.kind==='คาบเรียน'?'teach':'act'}">`).join('')}</colgroup>`;

}
function gridFilterFor(item,kind) {
  if(kind==='mine') return {kind:'ครู',staffId:myStaffId};
  if(kind==='room') {const slash=item.key.indexOf('/');return {kind:'ห้อง',grade_level:item.key.slice(0,slash),classroom:item.key.slice(slash+1)};}
  if(kind==='facility') return {kind:'ห้องปฏิบัติการ',facility:item.key};
  return item.staffId?{kind:'ครู',staffId:item.staffId}:{kind:'ครู',name:item.name};
}
function weeklyPeriods(item,kind) {
  const grid=buildGrid({columns:details.columns,teachingDays:details.teaching_days,lessons,filter:gridFilterFor(item,kind)});
  return grid.reduce((sum,row)=>sum+row.cells.reduce((n,cell)=>n+cell.items.reduce((count,{lesson,placement})=>count+(lesson.subject_id?Array.from({length:placement.span},(_,offset)=>details.columns[placement.column_seq-1+offset]).filter(column=>column?.kind==='คาบเรียน').length:0),0),0),0);
}
function weeklyActivities(item,kind) {
  const grid=buildGrid({columns:details.columns,teachingDays:details.teaching_days,lessons,filter:gridFilterFor(item,kind)});
  return grid.reduce((sum,row)=>sum+row.cells.reduce((count,cell)=>count+cell.items.filter(({lesson})=>!isSubject(lesson)).length,0),0);
}

    const fields=[...$('swap-panel-content').querySelectorAll('.detail-member-periods')];
    const values=fields.map(field=>Number(field.value));
    const total=values.reduce((sum,value)=>sum+value,0);
    const valid=fields.every(field=>field.value!==''&&Number.isFinite(Number(field.value))&&Number(field.value)>=0&&Number(field.value)*2%1===0)&&total>0&&total<=maximum;

  const {id,swapAction:action}=button.dataset;
  const note=$(`note-${id}`)?.value.trim()||null;
  const title=action==='cancel'?'ยกเลิกคำขอ':action==='accept'?'ตอบรับคำขอ':'ปฏิเสธคำขอ';
  if(!await window.crsAskConfirm({title,message:'ตรวจคาบและวันที่ทั้งสองขาก่อนยืนยัน',okLabel:title,danger:action!=='accept'}))return;
  await swapAction(action==='cancel'?'cancel_timetable_swap':'respond_timetable_swap',
    action==='cancel'?{p_id:id,p_note:note}:{p_id:id,p_accept:action==='accept',p_note:note},`${title}แล้ว`);
});
document.querySelectorAll('.view-buttons button').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;target='';renderView();}));
const session=await requireAuth();
if(session) {
  $('btn-signout').addEventListener('click',async event=>{event.preventDefault();await signOut();});
  await loadAttendanceExtra();
  const academicAccess=getAcademicAccess(session.user.id).then(allowed=>{
    if(allowed!==isAcademic){isAcademic=allowed;if(details)renderGrid();}
  });
  try {
    const list=fail(await sb.from('timetables').select(SWAP_SET_SELECT).eq('status','ใช้งาน')
      .or(`a_date.gte.${today()},b_date.gte.${today()}`,{referencedTable:'timetable_swaps'})
      .order('start_date'),'โหลดรายการตารางสอน');
    sets=list||[];
    pruneTimetableCache(safeStorage(),sets.map(row=>row.id));
    const deepId=params.get('tt'); let first=deepId?sets.find(row=>row.id===deepId):
      sets.find(row=>row.timetable_swaps?.some(swap=>swap.id===params.get('swap')))||null;
    if(deepId&&!first) {
      const linked=fail(await sb.from('timetables').select(`${SWAP_SET_SELECT},status`).eq('id',deepId)
        .or(`a_date.gte.${today()},b_date.gte.${today()}`,{referencedTable:'timetable_swaps'})
        .maybeSingle(),'ตรวจลิงก์ตารางสอน');
      if(!linked) { showError('ไม่พบตารางนี้ หรือคุณไม่มีสิทธิ์ดู · ตรวจลิงก์แล้วรีเฟรชหน้า'); }
      else { sets=[...sets,linked]; first=linked; }
    }
    if(!$('load-error').textContent) {
      if(!sets.length) { $('load-state').textContent=''; $('empty-state').hidden=false; }
      else {
        first ||=chooseTimetable(sets,today());
        $('set-field').hidden=sets.length<=1; $('single-set').hidden=sets.length>1;
        $('set-select').innerHTML=sets.map(row=>option(row.id,`${row.name} · ${rangeText(row)}`)).join('');
        myStaffId=await getMyStaffId(session.user.id);
        await selectSet(first,true);
      }
    }
  } catch(error) { showError(`โหลดรายการตารางไม่สำเร็จ: ${error.message} · ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้า`); }
  await academicAccess;
}
</script>
</body>
</html>
