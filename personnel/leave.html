<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกการลา — CRS MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2a2e; --muted:#5f6b70; --line:#dfe4e3; --teal:#0f6e56; --teal-soft:#e1f5ee;
          --bg:#f7f8f7; --white:#fff; --danger:#a32d2d; --danger-soft:#fceaea;
          --amber:#8a5a00; --amber-soft:#fff4df; }
  * { box-sizing:border-box; }
  body { font-family:"Sarabun",sans-serif; color:var(--ink); background:var(--bg);
         margin:0; padding:16px; font-size:16px; line-height:1.6; }
  .wrap { max-width:560px; margin:0 auto; }
  header h1 { font-size:20px; font-weight:600; margin:4px 0; }
  header p { color:var(--muted); margin:0 0 8px; font-size:14px; }
  header .nav { display:flex; gap:8px; flex-wrap:wrap; background:var(--white); padding:8px;
                border-radius:99px; border:1px solid var(--line);
                box-shadow:0 4px 12px rgba(0,0,0,.05); margin:0 0 24px; align-items:center; }
  header .nav a { color:var(--muted); text-decoration:none; font-weight:500;
                  padding:8px 16px; border-radius:99px; font-size:14px; }
  header .nav a.active { background:var(--teal); color:var(--white); }
  header .nav #btn-signout { margin-left:auto; color:var(--danger); background:#fff0f0; }

  .card { background:var(--white); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:500; margin-bottom:6px; font-size:15px; }
  input[type="text"], input[type="date"], input[type="search"], select, textarea {
    width:100%; font-family:inherit; font-size:16px; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; background:var(--white); color:var(--ink); }
  textarea { resize:vertical; min-height:70px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--teal); outline-offset:1px; }
  .field { margin-bottom:14px; } .field:last-child { margin-bottom:0; }
  .field-note { color:var(--muted); font-size:13px; margin-top:4px; }
  #quota-hint { white-space:pre-line; }
  .row2 { display:flex; gap:12px; } .row2 > * { flex:1; }
  button { font-family:inherit; font-size:15px; font-weight:600; padding:10px 14px;
           border:none; border-radius:8px; cursor:pointer; }
  button.primary { background:var(--teal); color:var(--white); width:100%; margin-top:8px; }
  button.small { font-size:13px; padding:6px 10px; }
  button.danger { background:var(--danger-soft); color:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  .section { font-size:12px; font-weight:600; color:var(--muted);
                   text-transform:uppercase; letter-spacing:.03em; margin:4px 0 10px; }
  .banner { padding:11px 13px; border-radius:10px; font-size:14px; margin-bottom:14px; }
  .banner.warn { background:var(--amber-soft); color:var(--amber); }
  .banner.info { background:var(--teal-soft); color:var(--teal); }
  .leave-row { display:flex; gap:10px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line); }
  .leave-row:last-child { border-bottom:none; }
  .leave-row .info { flex:1; min-width:0; }
  .leave-row .who { font-weight:600; }
  .leave-row .meta { color:var(--muted); font-size:13.5px; }
  .leave-row.just-saved { animation:just-saved-flash 3s ease-out 1; }
  @keyframes just-saved-flash {
    from { background:var(--teal-soft); }
    to { background:transparent; }
  }
  .chip { font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px;
          background:var(--teal-soft); color:var(--teal); }
  .chip.half { background:var(--amber-soft); color:var(--amber); }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); padding:11px 18px;
           border-radius:10px; background:#1f2a2e; color:#fff; font-weight:600; opacity:0;
           pointer-events:none; transition:opacity .18s; z-index:60; }
  #toast.show { opacity:1; } #toast.err { background:var(--danger); }
  .muted-empty { color:var(--muted); text-align:center; padding:18px 0; }
  /* ปุ่มประเภทและวันที่ใช้ช่องเดิมเป็นแหล่งความจริง */
  [hidden] { display:none !important; }
  .choice-group, .date-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .choice-group button, .date-chips button, #multi-days { min-height:44px; background:var(--white); border:1px solid var(--line); color:var(--ink); }
  .choice-group button[aria-checked="true"], .date-chips button[aria-pressed="true"] { color:var(--teal); background:var(--teal-soft); border-color:var(--teal); }
  button:focus-visible, a:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  #quota-hint { margin:0 0 14px; }
  #date-fields { padding:12px; border:1px solid var(--line); border-radius:10px; margin-bottom:14px; }
  #date-fields.is-empty { background:var(--amber-soft); border-color:var(--amber); }
  #date-fields input { min-width:0; }
  #multi-days { margin-top:8px; width:100%; color:var(--teal); }
  #end-field { margin:12px 0 0; }
  .month-nav { display:grid; grid-template-columns:44px minmax(0,1fr) 44px; align-items:center; gap:8px; margin-bottom:12px; }
  .month-nav button { min-height:44px; padding:6px; background:var(--teal-soft); color:var(--teal); }
  #month-title { text-align:center; font-weight:600; font-size:15px; }
  .coverage-link { display:inline-flex; min-height:44px; align-items:center; padding:6px 10px; border-radius:8px; color:var(--teal); background:var(--teal-soft); text-decoration:none; font-size:14px; font-weight:600; }
  .leave-row .info { overflow-wrap:anywhere; }
  .leave-row .row-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .leave-row button.small, .duty-row button.small { min-height:44px; }
  #leave-success { background:var(--teal-soft); color:var(--teal); padding:16px; border:1px solid var(--teal); border-radius:12px; margin-bottom:16px; }
  #leave-success .success-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  #leave-success a { min-height:44px; background:var(--teal); color:var(--white); padding:10px 14px; border-radius:8px; text-decoration:none; font-weight:600; }
  #leave-success button { min-height:44px; background:var(--white); color:var(--teal); }
  @media (max-width:520px) { .leave-row { display:block; } .leave-row .row-actions { margin-top:8px; } }
  @media (prefers-reduced-motion:reduce) { .leave-row.just-saved { animation:none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>บันทึกการลา</h1>
    <p>คีย์ใบลาเข้าระบบ รองรับลาเต็มวันและครึ่งวัน</p>
    <div class="nav">
      <a href="index.html">ภาพรวมบุคลากร</a>
      <a href="leave.html">บันทึกการลา</a>
      <a href="staff.html">ทะเบียนบุคลากร</a>
      <a href="hr-settings.html">ตั้งค่างานบุคคล</a>
      <a href="work-summary.html">สรุปเวลาทำงาน</a>
      <a href="my-work.html">ข้อมูลการทำงานของฉัน</a>
      <a href="#" id="btn-signout">ออกจากระบบ</a>
    </div>
    <script src="../app-shell.js?v=20261004-1"></script>
  </header>
  <main class="academic-content">

  <div id="gate" class="card" style="display:none"></div>

  <div id="leave-success" hidden role="status"></div>

  <div id="form-card" class="card" style="display:none">
    <div class="section">บันทึกใบลาใหม่</div>
    <div class="field">
      <label for="f-staff">บุคลากร</label>
      <select id="f-staff"></select>
    </div>
    <div id="quota-hint" class="field-note"></div>
    <div class="field">
      <label id="type-label">ประเภทการลา</label>
      <select id="f-type" hidden aria-hidden="true"></select>
      <div id="type-buttons" class="choice-group" role="radiogroup" aria-labelledby="type-label"></div>
    </div>
    <div class="field">
      <label id="portion-label">ช่วงเวลา</label>
      <select id="f-portion" hidden aria-hidden="true">
        <option value="full">เต็มวัน</option>
        <option value="morning">ครึ่งวันเช้า</option>
        <option value="afternoon">ครึ่งวันบ่าย</option>
      </select>
      <div id="portion-buttons" class="choice-group" role="radiogroup" aria-labelledby="portion-label"></div>
    </div>
    <div id="date-fields">
      <label for="f-start">วันที่ · เลือกวัน</label>
      <div class="date-chips" role="group" aria-label="เลือกวันที่เร็ว">
        <button type="button" id="date-today" aria-pressed="false">วันนี้</button>
        <button type="button" id="date-tomorrow" aria-pressed="false">พรุ่งนี้</button>
      </div>
      <input id="f-start" type="date">
      <button type="button" id="multi-days" aria-expanded="false" aria-controls="end-field">+ ลาหลายวัน (ใส่วันสุดท้าย)</button>
      <div class="field" id="end-field" hidden>
        <label for="f-end">ถึงวันที่</label>
        <input id="f-end" type="date">
        <div class="field-note" id="end-note">ลาวันเดียวใส่วันเดียวกันได้</div>
      </div>
    </div>
    <div class="field">
      <label for="f-reason">เหตุผล</label>
      <textarea id="f-reason" placeholder="เช่น ป่วยเป็นไข้ / ไปติดต่อราชการ"></textarea>
    </div>
    <button id="btn-save" class="primary">บันทึกใบลา</button>
  </div>

  <div class="card">
    <div class="section">ใบลาที่บันทึกไว้</div>
    <div class="month-nav" aria-label="เดือนของรายการ">
      <button type="button" id="month-prev" aria-label="เดือนก่อน">‹</button>
      <div id="month-title" aria-live="polite"></div>
      <button type="button" id="month-next" aria-label="เดือนถัดไป">›</button>
    </div>
    <div class="field">
      <input id="q" type="search" placeholder="ค้นหาชื่อบุคลากร" autocomplete="off">
    </div>
    <div id="count" class="field-note">—</div>
    <div id="list"></div>
  </div>
    <div id="toast"></div>
  </main>
</div>

<script type="module">
import { sb, requireAuth, signOut, checkDepartment, getLeaveTypes,
         applyPersonnelMenuAccess, personnelAccessDeniedHtml,
         loadLeaveContext, countLeaveDaysByType,
         getWorkYears, academicYearOf, academicYearRange, getLeaveQuotas,
         bangkokNow, toDateStr } from "../supabase-client.js?v=20261006-1";

const session = await requireAuth();
if (session) {
  const el = id => document.getElementById(id);
  const elToast = el("toast");
  let t = null;
  const toast = (m, err) => {
    elToast.textContent = m; elToast.classList.toggle("err", !!err);
    elToast.classList.add("show"); clearTimeout(t);
    t = setTimeout(() => elToast.classList.remove("show"), 3200);
  };
  el("btn-signout")?.addEventListener("click", e => { e.preventDefault(); signOut(); });

  const canEdit = await checkDepartment("บุคลากร");
  applyPersonnelMenuAccess(canEdit);
  // ใบลามีเหตุผลการลาซึ่งเป็นเรื่องส่วนตัว ครูทั่วไปจึงไม่ควรเห็นของคนอื่นเลย
  if (!canEdit) {
    applyPersonnelMenuAccess(false);
    document.querySelectorAll("#main, #content, #report, .card").forEach(x => x.remove());
    const box = document.createElement("div");
    box.className = "card";
    box.innerHTML = personnelAccessDeniedHtml();
    document.querySelector("main").appendChild(box);
  } else {
  let staffList = [], leaves = [], years = [];
  let leaveCtxCache = null;   // { year, from, to, ctx }
  let justSavedId = null;

  if (!canEdit) {
    el("gate").style.display = "";
    el("gate").innerHTML = '<div class="banner warn"><b>คุณดูได้อย่างเดียว</b><br>' +
      'การบันทึกใบลาต้องเป็นผู้ดูแลระบบ หรือได้รับสิทธิ์ฝ่ายบุคลากร<br>' +
      'รายการด้านล่างจะแสดงเฉพาะใบลาของคุณเอง</div>';
  } else {
    el("form-card").style.display = "";
  }

  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[ch]);
  const PORTION_LABEL = { full: "เต็มวัน", morning: "ครึ่งวันเช้า", afternoon: "ครึ่งวันบ่าย" };

    // ปุ่มแตะสั่งช่องเดิมและยิง change ให้ตรรกะเดิมทำงาน
    function syncChoiceUi(selectId, groupId) {
      const select = el(selectId);
      const group = el(groupId);
      group.innerHTML = [...select.options].filter(option => option.value).map(option =>
        `<button type="button" role="radio" data-choice="${esc(option.value)}" aria-checked="${option.value === select.value}" tabindex="${option.value === select.value ? 0 : -1}">${esc(option.textContent)}</button>`
      ).join("");
    }
    function bindChoiceUi(selectId, groupId) {
      const group = el(groupId);
      const choose = button => {
        el(selectId).value = button.dataset.choice;
        el(selectId).dispatchEvent(new Event("change", { bubbles:true }));
        syncChoiceUi(selectId, groupId);
        group.querySelector('[aria-checked="true"]')?.focus();
      };
      group.addEventListener("click", event => {
        const button = event.target.closest("[data-choice]");
        if (button) choose(button);
      });
      group.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"].includes(event.key)) return;
        const buttons = [...group.querySelectorAll("[data-choice]")];
        const at = buttons.indexOf(event.target.closest("[data-choice]"));
        if (at < 0 || !buttons.length) return;
        event.preventDefault();
        const next = event.key === "Home" ? 0 : event.key === "End" ? buttons.length - 1 :
          (at + (["ArrowLeft", "ArrowUp"].includes(event.key) ? -1 : 1) + buttons.length) % buttons.length;
        choose(buttons[next]);
      });
      el(selectId).addEventListener("change", () => syncChoiceUi(selectId, groupId));
    }

    let multipleDays = false;
    const thaiDateShort = value => new Date(value + "T00:00:00Z").toLocaleDateString("th-TH", {
      weekday:"short", day:"numeric", month:"short", timeZone:"UTC"
    });
    const dateChoices = () => {
      const now = bangkokNow();
      const today = toDateStr(now);
      now.setUTCDate(now.getUTCDate() + 1);
      return [today, toDateStr(now)];
    };
    function syncDateUi(fromValues = false) {
      const start = el("f-start").value;
      const end = el("f-end").value;
      const half = el("f-portion") && el("f-portion").value !== "full";
      if (fromValues) multipleDays = !!start && !!end && start !== end;
      if (!start || half) multipleDays = false;
      el("end-field").hidden = !multipleDays;
      el("multi-days").disabled = !!half;
      el("multi-days").setAttribute("aria-expanded", String(multipleDays));
      el("multi-days").textContent = multipleDays ? "− ใช้วันเดียว" : "+ ลาหลายวัน (ใส่วันสุดท้าย)";
      el("date-fields").classList.toggle("is-empty", !start);
      if (!multipleDays) el("f-end").value = start;
      const dates = dateChoices();
      ["date-today", "date-tomorrow"].forEach((id, index) => {
        el(id).dataset.date = dates[index];
        el(id).setAttribute("aria-pressed", String(start === dates[index]));
      });
      el("date-today").textContent = "วันนี้ " + thaiDateShort(dates[0]);
    }
    function bindDateUi() {
      ["date-today", "date-tomorrow"].forEach(id => el(id).addEventListener("click", () => {
        el("f-start").value = el(id).dataset.date;
        el("f-start").dispatchEvent(new Event("change", { bubbles:true }));
      }));
      el("multi-days").addEventListener("click", () => {
        multipleDays = !multipleDays;
        syncDateUi();
        if (multipleDays) el("f-end").focus();
      });
      // ต้องติดตั้งหลัง listener เดิม เพื่อไม่ให้วันสุดท้ายค้างเมื่อเลือกวันเดียว
      el("f-start").addEventListener("change", () => {
        syncDateUi();
        updateQuotaHint();
      });
      el("f-end").addEventListener("change", () => syncDateUi());
      el("f-portion")?.addEventListener("change", () => syncDateUi());
    }

    let listMonth = toDateStr(bangkokNow()).slice(0, 7);
    const shiftMonth = (month, offset) => {
      const date = new Date(month + "-01T00:00:00Z");
      date.setUTCMonth(date.getUTCMonth() + offset);
      return date.toISOString().slice(0, 7);
    };
    const inListMonth = row => row.start_date.slice(0, 7) <= listMonth &&
      (row.end_date || row.start_date).slice(0, 7) >= listMonth;
    function syncMonthUi(allRows, count, searching, unit) {
      const months = [toDateStr(bangkokNow()).slice(0, 7), ...allRows.flatMap(row =>
        [row.start_date.slice(0, 7), (row.end_date || row.start_date).slice(0, 7)])].sort();
      el("month-prev").disabled = !!searching || listMonth <= months[0];
      el("month-next").disabled = !!searching || listMonth >= months[months.length - 1];
      el("month-title").textContent = searching ? "ค้นหาทุกเดือน" :
        new Date(listMonth + "-01T00:00:00Z").toLocaleDateString("th-TH", {
          month:"long", year:"numeric", timeZone:"UTC"
        }) + ` · ${count} ${unit}`;
      el("count").hidden = !searching;
      el("count").textContent = searching ? `พบ ${count} ${unit} (ทุกเดือน)` : "";
    }
    function bindMonthUi() {
      el("month-prev").addEventListener("click", () => { listMonth = shiftMonth(listMonth, -1); render(); });
      el("month-next").addEventListener("click", () => { listMonth = shiftMonth(listMonth, 1); render(); });
    }

  async function loadAll() {
    // จำค่าที่ผู้ใช้เลือกไว้ก่อนสร้าง option ใหม่ เพื่อให้ลงใบลารายการถัดไปได้ต่อเนื่อง
    const selectedStaff = el("f-staff").value;
    const selectedType = el("f-type").value;
    const [staffRes, typeRows, leaveRes, yearRows] = await Promise.all([
      sb.from("staff").select("id,full_name,is_active").eq("is_active", true).order("full_name"),
      getLeaveTypes(),
      sb.from("staff_leaves").select("*").order("start_date", { ascending: false }).limit(300),
      getWorkYears()
    ]);
    staffList = staffRes.data || [];
    leaves = leaveRes.data || [];
    years = yearRows;

    el("f-staff").innerHTML = '<option value="">— เลือกบุคลากร —</option>' +
      staffList.map(s => `<option value="${s.id}">${s.full_name}</option>`).join("");
    el("f-type").innerHTML = typeRows.map(t => `<option value="${t.code}">${t.code}</option>`).join("");
    if (selectedStaff && staffList.some(s => s.id === selectedStaff)) el("f-staff").value = selectedStaff;
    if (selectedType && typeRows.some(t => t.code === selectedType)) el("f-type").value = selectedType;
    render();
  }

  async function getLeaveCtx(year) {
    if (leaveCtxCache?.year === year) return leaveCtxCache;
    const range = academicYearRange(year, years);
    leaveCtxCache = {
      year, from:range.start, to:range.end,
      ctx:await loadLeaveContext(range.start, range.end)
    };
    return leaveCtxCache;
  }

  // ---------- เตือนโควตาคงเหลือ (เตือนเฉย ๆ ไม่บล็อก — ดุลยพินิจอยู่ที่โรงเรียน) ----------
  const fmtOverlapDate = value => new Date(value + "T00:00:00Z").toLocaleDateString("th-TH", {
    day:"numeric", month:"short", year:"numeric", timeZone:"UTC"
  });

  function overlapWarning(staffId, start, end) {
    if (!staffId || !start || !end) return "";
    const overlaps = leaves.filter(l =>
      l.staff_id === staffId && l.start_date <= end && start <= l.end_date);
    if (!overlaps.length) return "";
    const shown = overlaps.slice(0, 3).map(l => {
      const range = l.start_date === l.end_date
        ? fmtOverlapDate(l.start_date)
        : `${fmtOverlapDate(l.start_date)}–${fmtOverlapDate(l.end_date)}`;
      return `${l.leave_type} ${range}`;
    }).join(" · ");
    const more = overlaps.length > 3 ? ` · และอีก ${overlaps.length - 3} ใบ` : "";
    return `⚠ ครูคนนี้มีใบลาคร่อมช่วงนี้อยู่แล้ว: ${shown}${more} — ถ้าต้องการแก้ใบเดิม ให้ลบใบเก่าก่อน`;
  }

  async function updateQuotaHint() {
    const staffId = el("f-staff").value;
    const type = el("f-type").value;
    const portion = el("f-portion").value;
    const start = el("f-start").value;
    const end = portion === "full" ? (el("f-end").value || start) : start;
    const overlap = overlapWarning(staffId, start, end);
    el("quota-hint").textContent = overlap;
    if (!staffId || !type || !start || years.length === 0) return;

    const year = academicYearOf(start, years);
    if (!year) {
      el("quota-hint").textContent = [
        "วันที่นี้ยังไม่อยู่ในรอบปีทำงานที่กำหนดไว้", overlap
      ].filter(Boolean).join("\n");
      return;
    }
    const [yearCtx, quotas] = await Promise.all([getLeaveCtx(year), getLeaveQuotas(year)]);
    if (quotas[type] === undefined) {
      el("quota-hint").textContent = [
        `รอบปีทำงาน ${year} · ประเภทนี้ไม่ได้กำหนดโควตา`, overlap
      ].filter(Boolean).join("\n");
      return;
    }

    const usedByType = countLeaveDaysByType(
      staffId, yearCtx.from, yearCtx.to, yearCtx.ctx);
    const used = usedByType[type] || 0;
    const left = quotas[type] - used;
    const quotaText =
      `รอบปีทำงาน ${year} · ${type} ใช้ไปแล้ว ${used} วัน จากสิทธิ์ ${quotas[type]} วัน` +
      (left < 0 ? ` — เกินสิทธิ์ ${Math.abs(left)} วัน` : ` (เหลือ ${left} วัน)`);
    el("quota-hint").textContent = [quotaText, overlap].filter(Boolean).join("\n");
  }

  function syncPortionFields() {
    const half = el("f-portion").value !== "full";
    el("f-end").disabled = half;
    if (half) {
      el("f-end").value = el("f-start").value;
      el("end-note").textContent = "ลาครึ่งวันต้องเป็นวันเดียว";
    } else {
      el("end-note").textContent = "ลาวันเดียวใส่วันเดียวกันได้";
    }
  }

  // ครึ่งวันต้องเป็นวันเดียว (ฐานข้อมูลบังคับอยู่แล้ว ฝั่งนี้ช่วยไม่ให้ผู้ใช้กรอกแล้วโดนปฏิเสธ)
  el("f-portion")?.addEventListener("change", () => {
    syncPortionFields();
    updateQuotaHint();
  });
  el("f-start")?.addEventListener("change", () => {
    if (el("f-portion").value !== "full" || !el("f-end").value) el("f-end").value = el("f-start").value;
    updateQuotaHint();
  });
  ["f-staff", "f-type", "f-end"].forEach(id =>
    el(id)?.addEventListener("change", updateQuotaHint));

  function render() {
    syncChoiceUi("f-type", "type-buttons");
    syncChoiceUi("f-portion", "portion-buttons");
    syncDateUi();
    const savedId = justSavedId;
    const saved = savedId ? leaves.find(row => row.id === savedId) : null;
    const nameOf = id => (staffList.find(row => row.id === id) || {}).full_name || "(ไม่พบชื่อ)";
    if (saved) {
      listMonth = saved.start_date.slice(0, 7);
      el("leave-success").hidden = false;
      const savedDate = saved.start_date === saved.end_date ? thaiDateShort(saved.start_date)
        : `${thaiDateShort(saved.start_date)} – ${thaiDateShort(saved.end_date)}`;
      el("leave-success").innerHTML = `<b>✓ บันทึกแล้ว — ${esc(nameOf(saved.staff_id))}</b>
        <div>${esc(saved.leave_type)} · ${esc(PORTION_LABEL[saved.day_portion] || "")} · ${esc(savedDate)}</div>
        <div class="success-actions"><a href="coverage.html?date=${encodeURIComponent(saved.start_date)}">จัดคนแทนวันที่ ${esc(thaiDateShort(saved.start_date))} →</a>
        <button type="button" id="next-leave">บันทึกใบลาคนถัดไป</button></div>`;
      el("next-leave").addEventListener("click", () => {
        el("leave-success").hidden = true;
        el("f-staff").focus();
      });
    }
    const q = el("q").value.trim().toLowerCase();
    const rows = leaves.filter(row => q ? nameOf(row.staff_id).toLowerCase().includes(q) : inListMonth(row));
    syncMonthUi(leaves, rows.length, q, "ใบ");
    const today = toDateStr(bangkokNow());
    el("list").innerHTML = rows.length ? rows.map(l => {
      const range = l.start_date === l.end_date ? thaiDateShort(l.start_date) : `${thaiDateShort(l.start_date)} – ${thaiDateShort(l.end_date)}`;
      const chip = l.day_portion === "full"
        ? `<span class="chip">${esc(l.leave_type)}</span>`
        : `<span class="chip half">${esc(l.leave_type)} · ${esc(PORTION_LABEL[l.day_portion])}</span>`;
      return `<div class="leave-row${l.id === savedId ? " just-saved" : ""}" data-leave-id="${esc(l.id)}">
        <div class="info"><div class="who">${esc(nameOf(l.staff_id))} ${chip}</div>
          <div class="meta">${esc(range)}</div>${l.reason ? `<div class="meta">${esc(l.reason)}</div>` : ""}</div>
        <div class="row-actions">${l.start_date >= today ? `<a class="coverage-link" href="coverage.html?date=${encodeURIComponent(l.start_date)}">จัดคนแทน →</a>` : ""}
          ${canEdit ? `<button class="danger small" data-del="${esc(l.id)}">ลบ</button>` : ""}</div>
      </div>`;
    }).join("") : `<div class="muted-empty">${q ? "ไม่พบใบลาที่ตรงกับคำค้น" : "ยังไม่มีใบลาในเดือนนี้"}</div>`;
    justSavedId = null;
    if (savedId) {
      el("list").querySelector(`[data-leave-id="${savedId}"]`)
        ?.scrollIntoView({ behavior:"smooth", block:"center" });
    }
  }
  el("q").addEventListener("input", render);

  el("btn-save")?.addEventListener("click", async () => {
    const staffId = el("f-staff").value;
    const type = el("f-type").value;
    const portion = el("f-portion").value;
    const start = el("f-start").value;
    const end = portion === "full" ? (el("f-end").value || start) : start;

    if (!staffId) return toast("กรุณาเลือกบุคลากร", true);
    if (!type) return toast("กรุณาเลือกประเภทการลา", true);
    if (!start) return toast("กรุณาเลือกวันที่เริ่มลา", true);
    if (end < start) return toast("วันสิ้นสุดต้องไม่ก่อนวันเริ่ม", true);

    const btn = el("btn-save");
    btn.disabled = true;
    const { data, error } = await sb.from("staff_leaves").insert({
      staff_id: staffId, leave_type: type, day_portion: portion,
      start_date: start, end_date: end,
      reason: el("f-reason").value.trim() || null,
      created_by: session.user.id
    }).select("id").single();
    btn.disabled = false;
    if (error) {
      const dup = error.code === "23505" ||
        /staff_leaves_no_exact_dup/.test(error.message || "");
      return toast(dup
        ? "มีใบลาแบบเดียวกันของครูคนนี้ในช่วงวันเดียวกันอยู่แล้ว ไม่ต้องบันทึกซ้ำ"
        : "บันทึกไม่สำเร็จ: " + error.message, true);
    }

    justSavedId = data.id;
    el("f-start").value = "";
    el("f-end").value = "";
    el("f-reason").value = "";
    el("f-portion").value = "full";
    syncPortionFields();
    el("q").value = "";
    toast("บันทึกใบลาแล้ว");
    leaveCtxCache = null;
    await loadAll();
    await updateQuotaHint();
  });

  el("list").addEventListener("click", async ev => {
    const btn = ev.target.closest("[data-del]");
    if (!btn) return;
    if (!await window.crsAskConfirm({
      title: "ลบใบลา",
      message: "การลบกู้คืนไม่ได้",
      okLabel: "ลบใบลา"
    })) return;
    const { error } = await sb.from("staff_leaves").delete().eq("id", btn.dataset.del);
    // ตามกติกาสิทธิ์: ลบได้เฉพาะ admin — ฝ่ายบุคคลจะโดน RLS ปฏิเสธ จึงต้องบอกให้ชัด
    if (error) return toast("ลบไม่สำเร็จ (การลบสงวนไว้ที่ผู้ดูแลระบบ): " + error.message, true);
    toast("ลบใบลาแล้ว");
    leaveCtxCache = null;
    await loadAll();
    await updateQuotaHint();
  });

  bindChoiceUi("f-type", "type-buttons");
  bindChoiceUi("f-portion", "portion-buttons");
  bindDateUi();
  bindMonthUi();
  ["input", "change"].forEach(type => el("form-card").addEventListener(type, () => {
    el("leave-success").hidden = true;
  }));

  // ตั้งค่าเริ่มต้นเป็นวันนี้ตามเวลาไทย
  const today = toDateStr(bangkokNow());
  if (el("f-start")) { el("f-start").value = today; el("f-end").value = today; }

  await loadAll();
  }
}
</script>
</body>
</html>
