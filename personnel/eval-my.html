<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>งานประเมินของฉัน — CRS MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2a2e; --muted:#5f6b70; --line:#dfe4e3; --teal:#0f6e56; --teal-soft:#e1f5ee;
    --bg:#f7f8f7; --white:#ffffff; --danger:#a32d2d; --danger-soft:#fceaea;
    --amber:#8a5a00; --amber-soft:#fff4df; }
  * { box-sizing:border-box; }
  body { font-family:"Sarabun",sans-serif; color:var(--ink); background:var(--bg); margin:0; padding:16px; font-size:16px; line-height:1.6; }
  .wrap { max-width:560px; margin:0 auto; }
  main.academic-content { max-width:560px !important; margin-left:auto; margin-right:auto; }
  h1 { font-size:22px; margin:4px 0; } h2 { font-size:18px; margin:0 0 8px; } h3 { font-size:16px; margin:0; }
  header p, .hint { color:var(--muted); } header p { margin:0 0 8px; font-size:14px; }
  .nav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:8px; background:var(--white);
    border:1px solid var(--line); border-radius:99px; margin-bottom:22px; }
  .nav a { color:var(--muted); text-decoration:none; padding:8px 12px; border-radius:99px; font-size:14px; }
  .nav a.active { color:var(--white); background:var(--teal); }
  .nav #btn-signout { margin-left:auto; color:var(--danger); }
  .card { background:var(--white); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; min-width:0; }
  .section { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin:0 0 10px; }
  .hint { font-size:14px; margin:4px 0 10px; } .empty { color:var(--muted); padding:22px 10px; text-align:center; }
  .group { border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
  .group:first-of-type { border-top:0; padding-top:0; }
  .task { display:flex; align-items:center; gap:12px; border-top:1px solid var(--line); padding:12px 0; }
  .task:first-of-type { border-top:0; } .task-main { flex:1; min-width:0; }
  .task-main b { display:block; overflow-wrap:anywhere; } .task-main small { display:block; color:var(--muted); font-size:13px; }
  .pill { display:inline-block; border-radius:99px; padding:2px 9px; background:var(--teal-soft); color:var(--teal); font-size:13px; }
  .pill.warn { background:var(--amber-soft); color:var(--amber); }
  .action { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:8px 13px;
    border-radius:8px; font-weight:600; color:var(--teal); background:var(--teal-soft); text-decoration:none; white-space:nowrap; }
  .action.primary { color:var(--white); background:var(--teal); }
  .round-meta { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:14px; }
  .footer-link { display:inline-block; min-height:44px; padding:9px 0; }
  a:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:60; max-width:min(90vw,520px);
    padding:10px 16px; background:var(--danger); color:var(--white); border-radius:9px; opacity:0; pointer-events:none; }
  #toast.show { opacity:1; }
  @media (max-width:420px) { body { padding:12px; } .task { flex-wrap:wrap; } .task .action { width:100%; } }
</style>
<link rel="stylesheet" href="../app-shell.css?v=20261003-1">
</head>
<body>
<div class="wrap">
  <header>
    <h1>งานประเมินของฉัน</h1>
    <p>แบบประเมินที่ได้รับมอบหมาย และแบบประเมินตนเอง</p>
    <div class="nav">
      <a href="index.html">ภาพรวมบุคลากร</a>
      <a href="eval-my.html" class="active">งานประเมินของฉัน</a>
      <a href="my-work.html">ข้อมูลการทำงานของฉัน</a>
      <a href="#" id="btn-signout">ออกจากระบบ</a>
    </div>
    <script src="../app-shell.js?v=20261010-3"></script>
  </header>
  <main class="academic-content">
    <div id="app" class="card" role="status">กำลังโหลดงานประเมิน…</div>
    <div id="toast" role="alert" aria-live="polite"></div>
  </main>
</div>
<script type="module">
import { requireAuth, signOut, myStaffId, listMyEvalAssignments, countMyEvalResponses,
  listStaffPicker, loadEvalForm, evalSelfDueDate, thaiShortDateText, isPersonnelHead,
  bangkokNow, toDateStr } from "../supabase-client.js?v=20261010-3";

const session = await requireAuth();
if (!session) {
  // requireAuth กำลังพาไปหน้าเข้าสู่ระบบ
} else {
  const app = document.getElementById("app");
  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[ch]);
  const submittedDay = value => value ? new Intl.DateTimeFormat("th-TH", {
    timeZone:"Asia/Bangkok", day:"numeric", month:"short", year:"numeric"
  }).format(new Date(value)) : "";
  document.getElementById("btn-signout").addEventListener("click", async event => {
    event.preventDefault(); await signOut();
  });
  try {
    const me = await myStaffId();
    if (!me) {
      app.innerHTML = "บัญชีนี้ยังไม่ได้ผูกกับทะเบียนบุคลากร ติดต่อฝ่ายบุคคล";
    } else {
      const data = await listMyEvalAssignments(me);
      const mine = data.assignments.filter(row => row.rater_staff_id === me);
      const [staff, counts, head] = await Promise.all([
        listStaffPicker(), countMyEvalResponses(mine.map(row => row.id)), isPersonnelHead()
      ]);
      const names = new Map(staff.map(row => [row.id, row.full_name]));
      const forms = new Map();
      for (const formId of new Set(data.rounds.map(round => round.form_id)))
        forms.set(formId, await loadEvalForm(formId));
      const targetById = new Map(data.targets.map(row => [row.id, row]));
      const today = toDateStr(bangkokNow());
      let html = "";
      for (const round of [...data.rounds].sort((a,b) => b.created_at.localeCompare(a.created_at))) {
        const assignments = mine.filter(row => targetById.get(row.target_id)?.round_id === round.id);
        if (!assignments.length) continue;
        const form = forms.get(round.form_id);
        const sections = [...form.sections].filter(section => assignments.some(row => row.section_code === section.code))
          .sort((a,b) => Number(b.kind === "self") - Number(a.kind === "self") || a.sort - b.sort);
        const left = assignments.filter(row => row.status !== "submitted").length;
        html += '<section class="card"><h2>' + esc(round.academic_year) + ' · ครั้งที่ ' + round.round_no + '</h2>' +
          '<div class="round-meta"><span>กำหนดส่ง ' + esc(round.due_date ? thaiShortDateText(round.due_date) : "ยังไม่กำหนด") +
          '</span><span>เหลือ ' + left + ' จาก ' + assignments.length + '</span></div>';
        for (const section of sections) {
          html += '<div class="group"><div class="section">' + esc(section.kind === "self" ? "ประเมินตนเอง" :
            "ส่วนที่ " + section.code + " · " + section.title) + '</div>';
          for (const row of assignments.filter(item => item.section_code === section.code)) {
            const target = targetById.get(row.target_id);
            const total = section.domains.reduce((sum, domain) => sum + domain.items.length, 0);
            const answered = counts[row.id] || 0;
            const selfDue = section.kind === "self" ? evalSelfDueDate(round, form.rules) : null;
            const due = selfDue || round.due_date;
            const submitted = row.status === "submitted";
            const closed = round.status !== "open";
            const overdue = !submitted && due && today > due;
            const status = submitted ? "ส่งแล้ว " + submittedDay(row.submitted_at) :
              closed ? "ปิดรับแล้ว — ติดต่อฝ่ายบุคคล" :
              answered ? "ร่าง " + answered + "/" + total : total + " ข้อ";
            const label = submitted || closed ? "ดู" : answered ? "ทำต่อ" : "เริ่ม";
            html += '<div class="task"><div class="task-main"><b>' +
              esc(section.kind === "self" ? "ของฉัน" : names.get(target.staff_id) || "ไม่พบชื่อ") + '</b>' +
              '<small>' + esc(status) + (selfDue ? ' · ส่งภายใน ' + esc(thaiShortDateText(selfDue)) : "") + '</small>' +
              (overdue && !closed ? '<span class="pill warn">เลยกำหนด</span>' : "") +
              (closed && !submitted ? '<span class="pill warn">ปิดรับแล้ว — ติดต่อฝ่ายบุคคล</span>' : "") +
              '</div><a class="action ' + (!submitted && !closed && !answered ? "primary" : "") +
              '" href="eval-fill.html?a=' + encodeURIComponent(row.id) + '">' + label + '</a></div>';
          }
          if (section.kind === "peer") html += '<p class="hint">ครูผู้รับการประเมินจะไม่เห็นว่าคุณให้คะแนนเท่าไร — เห็นแค่ค่าเฉลี่ยของเพื่อนครูทุกคน</p>';
          html += '</div>';
        }
        html += '</section>';
      }
      app.className = "";
      app.innerHTML = html || '<div class="card empty">ยังไม่มีแบบประเมินที่ต้องกรอก</div>';
      if (head) app.insertAdjacentHTML("beforeend", '<p><a class="footer-link" href="eval-rounds.html">ไปหน้ารอบประเมิน</a></p>');
    }
  } catch (error) {
    app.className = "card";
    app.textContent = error.message;
    document.getElementById("toast").textContent = error.message;
    document.getElementById("toast").classList.add("show");
  }
}
</script>
</body>
</html>
