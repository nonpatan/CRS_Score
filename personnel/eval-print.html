<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>พิมพ์ผลประเมิน — CRS MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1f2a2e; --muted:#5f6b70; --line:#dfe4e3; --teal:#0f6e56; --teal-soft:#e1f5ee;
    --bg:#f7f8f7; --white:#ffffff; --danger:#a32d2d; --danger-soft:#fceaea; --amber:#8a5a00; --amber-soft:#fff4df;
    --head:#eef2f1;
  }
  * { box-sizing:border-box; }
  body { font-family:"Sarabun",sans-serif; color:var(--ink); background:var(--bg); margin:0; padding:16px; font-size:16px; line-height:1.5; }
  .wrap,main.academic-content { max-width:1040px; margin:0 auto; min-width:0; }
  .wrap > header h1 { font-size:22px; margin:4px 0; }
  .wrap > header p { color:var(--muted); margin:0 0 8px; font-size:14px; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; max-width:210mm; margin:0 auto 16px; }
  button,.button { display:inline-flex; align-items:center; font:inherit; font-weight:600; min-height:44px; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; background:var(--teal); color:var(--white); text-decoration:none; }
  button:disabled { opacity:.6; cursor:default; }
  button:focus-visible,a:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  #app { max-width:210mm; margin:0 auto; padding:16px; background:var(--white); border:1px solid var(--line); border-radius:12px; }
  .sheet { width:100%; max-width:210mm; margin:0 auto 16px; background:var(--white); padding:12mm 12mm 14mm; font-size:14px; overflow-wrap:anywhere; }
  .multiline { white-space:pre-wrap; }

  /* หัวเอกสารและข้อมูลผู้รับการประเมิน */
  .doc-head { display:grid; grid-template-columns:22mm minmax(0,1fr) 22mm; align-items:center; gap:4mm; margin:0; padding:0 0 3mm; border-bottom:2px solid var(--ink); border-radius:0; break-inside:avoid; }
  .doc-head img { width:22mm; height:22mm; object-fit:contain; }
  .doc-head .t { text-align:center; }
  .doc-head .school { font-size:20px; font-weight:700; }
  .doc-head .title { margin:0; font-size:16px; font-weight:600; }
  .doc-head .sub { color:var(--muted); font-size:13px; }
  .doc-head .stamp { border:1px solid var(--line); border-radius:6px; font-size:11px; text-align:center; padding:1.5mm; color:var(--muted); }
  .info { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border:1px solid var(--line); border-radius:6px; margin:4mm 0; break-inside:avoid; }
  .info div { padding:1.8mm 3mm; border-bottom:1px solid var(--line); }
  .info div:nth-child(odd) { border-right:1px solid var(--line); }
  .info div:nth-last-child(-n+2) { border-bottom:0; }
  .info span { display:block; color:var(--muted); font-size:12px; }
  .info b { font-weight:600; }

  /* ผลพิจารณาและคะแนนรวม */
  .verdict { display:grid; grid-template-columns:52mm minmax(0,1fr); border:1.5px solid var(--ink); border-radius:8px; margin:0 0 5mm; break-inside:avoid; }
  .score { background:var(--head); padding:3mm; text-align:center; border-right:1.5px solid var(--ink); border-radius:7px 0 0 7px; }
  .score small { display:block; color:var(--muted); font-size:12px; }
  .score b { display:block; font-size:34px; line-height:1.1; font-variant-numeric:tabular-nums; }
  .score .lv { font-size:15px; font-weight:600; }
  .decide { padding:3mm 4mm; }
  .decide h2 { margin:0 0 1.5mm; font-size:14px; }
  .choices { display:flex; gap:1mm 6mm; flex-wrap:wrap; }
  .choices .on { font-weight:700; }
  .symbol,.fail::before,.ok::before { font-family:"Arial Unicode MS","DejaVu Sans",sans-serif; }
  .defects { margin:2mm 0 0; padding-left:5mm; font-size:13px; }
  .defects li { margin:.5mm 0; }
  .reason { margin:2mm 0 0; font-size:13px; }

  /* ตารางสรุปและรายละเอียดทั้งห้าส่วน */
  h2.sec { display:flex; flex-wrap:wrap; align-items:baseline; gap:0 3mm; font-size:15px; margin:5mm 0 2mm; padding:1mm 0 1mm 3mm; border-left:4px solid var(--teal); break-after:avoid; }
  h2.sec .w { margin-left:auto; color:var(--muted); font-weight:400; font-size:12px; }
  .page-break > section:first-child > .sec { margin-top:0; }
  .lead { color:var(--muted); font-size:12.5px; margin:0 0 1.5mm; break-after:avoid; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { border:1px solid var(--line); padding:1.3mm 2mm; text-align:left; vertical-align:top; }
  thead th { background:var(--head); font-weight:600; }
  .n { text-align:right; font-variant-numeric:tabular-nums; width:18mm; }
  td.n,tfoot .n { white-space:nowrap; }
  .wide-number { width:25mm; }
  .c { text-align:center; width:25%; }
  th.star-result { width:50%; }
  td.code { white-space:nowrap; width:20mm; color:var(--muted); }
  tr { break-inside:avoid; }
  tfoot th,tfoot td { border-top:1.5px solid var(--ink); font-weight:700; }
  .fail { font-weight:700; }
  .fail::before { content:"✗ "; } .ok::before { content:"✓ "; }
  .two { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:4mm; align-items:start; }
  .evi { color:var(--muted); font-size:12px; }

  .notes { border:1px solid var(--line); border-radius:6px; padding:2mm 3mm; font-size:13px; }
  .notes > :first-child { margin-top:0; }
  .notes > :last-child { margin-bottom:0; }
  .notes p { margin:1mm 0; }
  .observations { margin-top:2mm; }
  .observations h2 { margin:0 0 1mm; font-size:13px; break-after:avoid; }
  .observations ul { margin:0; padding-left:5mm; }
  .observations li { margin:.8mm 0; }
  .comment { border:1px solid var(--line); border-radius:6px; min-height:24mm; padding:2.5mm 3mm;
    background-image:repeating-linear-gradient(transparent 0 calc(1lh - 1px),var(--line) calc(1lh - 1px) 1lh);
    background-origin:content-box; background-clip:content-box; }
  .sign { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9mm 10mm; margin-top:9mm; break-inside:avoid; }
  .sign > div { text-align:center; font-size:13.5px; }
  .sign .line { border-bottom:1px dotted var(--ink); height:10mm; margin:0 6mm 1.5mm; }
  .sign .role { font-weight:600; }
  .sign .date { color:var(--muted); font-size:12px; margin-top:1mm; }

  @media screen and (max-width:720px) {
    .sheet { padding:16px; }
    .doc-head { grid-template-columns:auto minmax(0,1fr); gap:8px; }
    .doc-head img { width:14mm; height:14mm; }
    .doc-head .stamp { grid-column:1 / -1; justify-self:center; }
    .info,.two,.sign,.verdict { grid-template-columns:minmax(0,1fr); }
    .info div:nth-child(odd) { border-right:0; }
    .info div:not(:last-child) { border-bottom:1px solid var(--line); }
    .score { border-right:0; border-bottom:1.5px solid var(--ink); border-radius:7px 7px 0 0; }
    .two { gap:0; }
    th,td { padding:4px; }
    .n { width:auto; }
  }
  @media screen and (max-width:420px) { body { padding:12px; } }

  @page {
    size:A4 portrait; margin:12mm 12mm 14mm;
    @top-left { content:""; }
    @top-center { content:""; }
    @bottom-left { font-family:"Sarabun",sans-serif; font-size:9pt; color:var(--muted); }
    @bottom-right { content:"หน้า " counter(page) " / " counter(pages); font-family:"Sarabun",sans-serif; font-size:9pt; color:var(--muted); }
  }
  @media print {
    .nav,.app-shell,.app-sidebar,.shell-sidebar,.workflow,.toast,.no-print { display:none !important; }
    body.academic-shell,body { padding:0 !important; background:var(--white) !important; min-width:0; min-height:0; overflow:visible; }
    .wrap,main.academic-content,body.academic-shell .wrap > .academic-content {
      display:block; max-width:none; min-height:0; padding:0; margin:0;
    }
    .sheet { width:auto; max-width:none; margin:0; padding:0; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
    .summary .info { margin:3mm 0; }
    .summary .info div { padding-block:1.2mm; }
    .summary .decide { padding-block:2mm; }
    .summary .verdict { margin-bottom:3mm; }
    .summary h2.sec { margin:3mm 0 1.5mm; padding-block:.6mm; }
    .summary th,.summary td { padding-block:.9mm; }
    .page-break { break-before:page; }
    a[href]::after { content:""; }
  }
</style><link rel="stylesheet" href="../app-shell.css?v=20261003-1"></head>
<body><div class="wrap">
  <header class="no-print">
    <h1>พิมพ์ผลประเมิน</h1>
    <p>ตรวจเอกสารก่อนพิมพ์แบบลงนาม</p>
    <div class="nav"><a href="index.html">ภาพรวมบุคลากร</a><a href="eval-result.html">สรุปผลประเมิน</a><a href="#" id="btn-signout">ออกจากระบบ</a></div>
    <script src="../app-shell.js?v=20261127-1"></script>
  </header>
  <main class="academic-content">
    <div class="toolbar no-print"><a class="button" id="back-link" href="eval-result.html">← กลับไปสรุปผล</a><button type="button" id="print-button" class="no-print" disabled>พิมพ์</button></div>
    <div id="app" role="status">กำลังโหลดแบบพิมพ์…</div>
    <div id="toast" class="toast no-print" role="status" aria-live="polite"></div>
  </main>
</div>
<script type="module">
import { requireAuth, signOut, checkDepartment, applyPersonnelMenuAccess, loadEvalTargetResult,
  listStaffPicker, computeEvalResult, evalScaleMax, evalDecisionOptions } from "../supabase-client.js?v=20261127-1";

const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
const num = value => value == null ? "—" : Number(value).toFixed(2);
const thaiDateFormat = new Intl.DateTimeFormat("th-TH", { timeZone:"Asia/Bangkok", day:"numeric", month:"short", year:"numeric" });
const thaiDate = value => value ? thaiDateFormat.format(new Date(value)) : "—";
const starStatus = row => row.recheck?.status === "pending" ? "ตรวจเพิ่ม · รอบันทึก" :
  row.recheck?.status === "pass" ? "ตรวจเพิ่มแล้ว · ผ่าน" :
  row.recheck?.status === "fail" ? "ตรวจเพิ่มแล้ว · ไม่ผ่าน" : row.fail ? "ไม่ผ่าน" : "ผ่าน";

// ท้ายกระดาษใช้ CSS string และใส่ผ่าน textContent
const cssString = value => '"' + value.replaceAll("\\", "\\\\").replaceAll('"', '\\"').replace(/[\r\n\f]/g, " ") + '"';
const rowOf = (cells, tag = "td") => "<tr>" + cells.map(([value, style]) =>
  `<${tag}${style ? ` class="${style}"` : ""}${tag === "th" ? ' scope="col"' : ""}>${value}</${tag}>`
).join("") + "</tr>";
const table = (heads, rows, foot = "") => `<table><thead>${rowOf(heads, "th")}</thead><tbody>${rows.join("")}</tbody>${foot}</table>`;
const section = (title, body, meta = "") => `
  <section><h2 class="sec">${esc(title)}${meta ? `<span class="w">${esc(meta)}</span>` : ""}</h2>${body}</section>`;
const partTitle = part => `ส่วนที่ ${part.code} · ${part.title}`;
const fieldText = (field, value) => `<p class="multiline"><b>${esc(field.label)}:</b> ${esc(value)}</p>`;

// ใช้คำอธิบายข้อบกพร่องแบบยาวเหมือนหน้าสรุปผล
function deficitText(code, form, result) {
  if (code.startsWith("★")) {
    const star = result.stars.find(row => "★" + row.code === code);
    return "★ " + code.slice(1) + " " + (star?.label || "") + " ได้ " + num(star?.value) +
      (star?.recheck?.status === "fail" ? " (ตรวจเพิ่มแล้ว)" : "");
  }
  if (code.startsWith("ส่วน")) {
    const part = form.sections.find(row => String(row.code) === code.slice(4));
    return "ส่วนที่ " + code.slice(4) + " " + (part?.title || "") + " ต่ำกว่าเกณฑ์";
  }
  const domain = form.sections.flatMap(row => row.domains || []).find(row => row.code === code);
  return "ด้าน " + code + " " + String(domain?.title || "").replace(/^ด้าน\s*/, "") + " ไม่ผ่าน";
}

const session = await requireAuth();
if (session) {
  const app = document.getElementById("app");
  const targetId = new URLSearchParams(location.search).get("target");
  const printButton = document.getElementById("print-button");
  document.getElementById("btn-signout").addEventListener("click", event => { event.preventDefault(); signOut(); });
  printButton.addEventListener("click", () => window.print());
  try {
    if (!targetId) throw new Error("ไม่ได้ระบุครูที่จะพิมพ์ผล");
    const department = await checkDepartment("บุคลากร"); applyPersonnelMenuAccess(department);
    const data = await loadEvalTargetResult(targetId);
    document.getElementById("back-link").href = "eval-result.html?target=" + encodeURIComponent(targetId);
    const staff = await listStaffPicker();
    const name = id => staff.find(row => row.id === id)?.full_name || "................................";
    const { round, form, target, decision, section4, acknowledgement } = data;
    const teacher = name(target.staff_id);
    const roundLabel = `ปีการศึกษา ${round.academic_year} · ครั้งที่ ${round.round_no}`;
    const liveResult = computeEvalResult({ form:data.form, target:data.target,
      assignments:data.assignments, responses:data.responses, section4:data.section4,
      roundNo:Number(data.round.round_no), history:data.history, rechecks:data.rechecks });
    const result = data.decision?.computed || liveResult;
    const weightLabel = part => `น้ำหนัก ${part.weight}%`;
    const parts = kind => form.sections.filter(part => part.kind === kind);
    const submittedFor = part => data.assignments.filter(row => row.section_code === part.code && row.status === "submitted");
    const partResult = part => result.sections.find(row => row.code === part.code);
    // snapshot ไม่เก็บจำนวนผู้ประเมิน จึงใช้ผลสดจาก assignment ชุดเดิมเมื่อไม่มีค่า
    const raterCount = part => part.raterCount ?? liveResult.sections.find(row => row.code === part.code)?.raterCount;
    const part4 = parts("summary_entry")[0];
    const variantCode = section4?.variant_code;
    const scaleMax = num(evalScaleMax(form.rules));

    const choices = evalDecisionOptions(round.round_no).map(option => {
      const selected = decision?.final === option.value;
      return `<span${selected ? ' class="on"' : ""}><span class="symbol">${selected ? "☑" : "☐"}</span> ${esc(option.label)}</span>`;
    }).join("");
    const defects = (result.deficiencies || []).map(code => `<li>${esc(deficitText(code, form, result))}</li>`).join("");
    const reason = decision?.reason?.trim();
    const verdict = `<section class="verdict">
      <div class="score"><small>คะแนนรวม (เต็ม ${scaleMax})</small><b>${num(result.total)}</b><span class="lv">ระดับ ${esc(result.level || "—")}</span></div>
      <div class="decide"><h2>ผลการพิจารณา</h2><div class="choices">${choices}</div>
        ${defects ? `<ul class="defects">${defects}</ul>` : ""}
        ${reason ? `<p class="reason multiline"><b>เหตุผลประกอบการพิจารณา:</b> ${esc(reason)}</p>` : ""}
      </div>
    </section>`;

    const weightedParts = result.sections.filter(part => part.weight > 0);
    const weightedRows = weightedParts.map(part => {
      let extra = "";
      if (["dept_head", "peer"].includes(part.kind)) {
        const count = raterCount(part);
        if (count != null) extra = ` (${count} คน)`;
      }
      if (part.kind === "summary_entry" && (part.variant?.code || variantCode)) {
        extra = ` (แบบ ${part.variant?.code || variantCode})`;
      }
      return rowOf([[esc(`ส่วนที่ ${part.code} ${part.title}${extra}`)], [num(part.avg), "n"],
        [esc(part.weight) + "%", "n"], [num(part.weighted), "n"]]);
    });
    const totalWeight = weightedParts.reduce((sum, part) => sum + Number(part.weight), 0);
    const totalRow = `<tfoot><tr><th scope="row" colspan="2">คะแนนรวม · ระดับ ${esc(result.level || "—")}</th>
      <td class="n">${totalWeight}%</td><td class="n">${num(result.total)}</td></tr></tfoot>`;
    const weighted = section("ตาราง ข · คะแนนรวมถ่วงน้ำหนัก",
      table([["ส่วนที่ประเมิน"],["เฉลี่ย","n"],["น้ำหนัก","n"],["ถ่วงน้ำหนัก","n wide-number"]], weightedRows, totalRow));

    const domains = result.sections.find(row => row.kind === "committee")?.domains || [];
    const sharedMin = domains[0]?.minAvg;
    const sameMin = sharedMin != null && domains.every(domain => domain.minAvg === sharedMin);
    const domainRows = domains.map(row => {
      const cells = [[esc(row.code + " " + row.title)], [num(row.avg), "n"]];
      if (!sameMin) cells.push([num(row.minAvg), "n"]);
      cells.push(row.pass == null ? ["—", "c"] : row.pass ? ["ผ่าน", "c ok"] : ["ไม่ผ่าน", "c fail"]);
      return rowOf(cells);
    });
    const domainHeads = [["ด้าน"], ["เฉลี่ย", "n"]];
    if (!sameMin) domainHeads.push(["เกณฑ์ขั้นต่ำ", "n"]);
    domainHeads.push([sameMin ? "ผล (≥ " + num(sharedMin) + ")" : "ผล", "c"]);
    const domainSummary = section("ตาราง ก · รายด้าน (ส่วนที่ 1)", table(domainHeads, domainRows));
    const starRows = result.stars.map(row => {
      const status = row.recheck?.status;
      const style = status === "pending" ? "c" : (status === "fail" || (!status && row.fail)) ? "c fail" : "c ok";
      return rowOf([[esc(row.code)], [num(row.value), "n"], [esc(starStatus(row)), style]]);
    });
    const starSummary = section("ตาราง ค · ข้อสำคัญ ★", table([["ข้อ"],["คะแนน","n"],["ผล","c star-result"]], starRows));

    const methods = { interview:"สัมภาษณ์ข้อเท็จจริง", observation:"สังเกตการสอนเพิ่ม", both:"ทั้งสองวิธี" };
    const usedRechecks = result.stars.filter(row => row.recheck && row.recheck.status !== "pending");
    const rechecks = usedRechecks.map(row => {
      const saved = data.rechecks.find(item => item.star_code === row.code);
      const outcome = row.recheck.status === "pass" ? "ผ่าน" : "ไม่ผ่าน";
      const details = [methods[saved?.method] || "—", thaiDate(saved?.checked_on), outcome, saved?.note || "—"];
      return `<p class="multiline">ตรวจเพิ่ม ★ ${esc(row.code)}: ${esc(details.join(" · "))}</p>`;
    }).join("");
    const directorComments = parts("committee").flatMap(part => submittedFor(part).flatMap(assignment =>
      (part.text_fields || []).flatMap(field => {
        const value = assignment.texts?.[field.key]?.trim();
        return value ? [fieldText(field, value)] : [];
      })
    )).join("");

    const summary = `<div class="sheet summary">
      <header class="doc-head">
        <img src="../logo.png" alt="ตราโรงเรียน">
        <div class="t">
          <div class="school">โรงเรียนเจริญศึกษา</div>
          <h2 class="title">แบบสรุปผลการประเมินการปฏิบัติงานครูแบบ 360 องศา</h2>
          <div class="sub">${esc(roundLabel)} · ฉบับ ${esc(form.code)}</div>
        </div>
        <div class="stamp">เอกสารลับเฉพาะบุคคล</div>
      </header>
      <div class="info">
        <div><span>ผู้รับการประเมิน</span><b>${esc(teacher)}</b></div>
        <div><span>ภาระงาน</span><b>${esc(target.workload || "—")}</b></div>
        <div><span>ช่วงเวลาที่ประเมิน</span><b>${thaiDate(round.period_from)} – ${thaiDate(round.period_to)}</b></div>
        <div><span>วันประเมิน</span><b>${thaiDate(round.eval_date)}</b></div>
      </div>
      ${verdict}
      ${weighted}
      <div class="two">${domainSummary}${starSummary}</div>
      ${rechecks ? section("ผลตรวจเพิ่มข้อ ★", `<div class="notes">${rechecks}</div>`) : ""}
      ${directorComments ? section("ความเห็นจากผู้อำนวยการ", `<div class="notes">${directorComments}</div>`) : ""}
    </div>`;

    const answers = new Map(data.responses.map(row => [row.assignment_id + ":" + row.item_id, row]));
    const committeeDetail = parts("committee").map(part => {
      const assignments = data.assignments.filter(row => row.section_code === part.code);
      const rows = assignments.flatMap(assignment => part.domains.flatMap(domain => domain.items.map(item => {
        const answer = answers.get(assignment.id + ":" + item.id);
        const code = `${domain.code}(${item.no})`;
        const star = item.is_star || result.stars.some(row => row.code === code);
        const evidence = answer?.evidence?.trim();
        return rowOf([[esc(code) + (star ? " ★" : ""), "code"],
          [esc(item.text) + (evidence ? `<div class="evi multiline">หลักฐาน: ${esc(evidence)}</div>` : "")],
          [esc(answer?.score ?? "—"), "n"]]);
      })));
      return section(partTitle(part), table([["ข้อ"],["รายการประเมิน · หลักฐาน"],["คะแนน","n"]], rows), weightLabel(part));
    }).join("");

    const deptAndPeer = ["dept_head", "peer"].flatMap(kind => parts(kind).map(part => {
      const scored = partResult(part);
      const rows = (scored?.items || []).map(item => rowOf([
        [esc(item.code + (item.isStar ? " ★ " : " ") + item.text)], [num(item.value), "n"]
      ]));
      const count = raterCount(scored || part);
      return section(partTitle(part), table([["ข้อ"],["เฉลี่ย","n"]], rows), `${count ?? "—"} คน · ${part.weight}%`);
    })).join("");
    const observations = parts("dept_head").flatMap(part => submittedFor(part)).map(row => row.texts?.note?.trim())
      .filter(note => note && note !== "-");
    const notes = observations.length ? `<section class="notes observations">
      <h2>ข้อสังเกตจากหัวหน้าฝ่าย (ไม่ระบุชื่อ)</h2>
      <ul>${observations.map(note => `<li class="multiline">${esc(note)}</li>`).join("")}</ul></section>` : "";

    let part4Detail = "";
    if (part4) {
      const variant = part4.variants?.find(row => row.code === variantCode);
      const respondents = variant?.respondent_label || "จำนวนผู้ตอบ/ผู้สังเกต";
      const rows = Object.entries(section4?.star_values || {}).map(([code, value]) => {
        const label = variant?.star_items?.find(row => row.code === code)?.label;
        return rowOf([[esc(label ? code + " " + label : code)], [num(value), "n"]]);
      });
      part4Detail = section(partTitle(part4), `<p class="lead">แบบ ${esc(variantCode || "—")} · ${esc(respondents)}
        ${esc(section4?.respondents ?? "—")} · ค่าเฉลี่ย ${num(section4?.avg_score)}</p>` +
        table([["ข้อ ★"],["คะแนน","n"]], rows), `${part4.weight}%`);
    }
    const selfDetail = parts("self").map(part => {
      const assignment = data.assignments.find(row => row.section_code === part.code);
      const fields = (part.text_fields || []).map(field => fieldText(field, assignment?.texts?.[field.key]?.trim() || "—")).join("");
      return section(partTitle(part), `<div class="notes">${fields || "—"}</div>`, "ไม่คิดคะแนน");
    }).join("");

    const signatures = [
      ["ผู้รับการประเมิน",teacher], ["ผู้อำนวยการ",name(round.director_staff_id)],
      ["กรรมการร่วม",round.committee_staff_id ? name(round.committee_staff_id) : "................................"],
      ["หัวหน้าฝ่ายบุคคล","................................"]
    ].map(([label, person]) => `<div><div class="line"></div>( ${esc(person)} )
      <div class="role">${esc(label)}</div><div class="date">วันที่ ........ / ........ / ........</div></div>`).join("");

    app.outerHTML = `<article>${summary}<div class="sheet page-break">
      ${committeeDetail}
      <div class="two">${deptAndPeer}</div>
      ${notes}
      <div class="two">${part4Detail}${selfDetail}</div>
      ${section("ความเห็นของผู้รับการประเมิน", `<div class="comment multiline">${esc(acknowledgement?.comment)}</div>`)}
      <div class="sign">${signatures}</div>
    </div></article>`;

    const footer = document.createElement("style");
    footer.textContent = `@page { @bottom-left { content:${cssString(
      `แบบประเมินครู 360° · ${teacher} · ปีการศึกษา ${round.academic_year} ครั้งที่ ${round.round_no}`
    )}; } }`;
    document.head.append(footer);
    printButton.disabled = false;
  } catch (error) { app.textContent = error.message; }
}
</script></body></html>
