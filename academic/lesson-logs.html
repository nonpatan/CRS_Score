<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกหลังสอน — CRS MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app-shell.css?v=20261003-1">
<style>
  :root {
    --ink: #1f2a2e; --muted: #5f6b70; --line: #dfe4e3; --teal: #0f6e56;
    --teal-soft: #e1f5ee; --bg: #f7f8f7; --white: #ffffff; --danger: #a32d2d;
    --danger-soft: #fceaea; --amber: #8a5a00; --amber-soft: #fff4df;
    --seg-1: #0f6e56; --seg-2: #4f9d86; --seg-3: #9fcdbd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: "Sarabun", sans-serif; font-size: 16px; line-height: 1.6; color: var(--ink); background: var(--bg); }
  .wrap { max-width: 1040px; margin: 0 auto; }
  header h1 { margin: 4px 0; font-size: 23px; }
  header p { margin: 0 0 8px; color: var(--muted); }
  .card { margin-bottom: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--white); }
  .field { min-width: 0; margin-bottom: 14px; }
  label { display: block; margin-bottom: 5px; font-weight: 600; }
  select, input[type="date"] { width: 100%; padding: 10px 12px; font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); color: var(--ink); }
  select:focus, input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  button, a.ghost { display: inline-block; min-height: 44px; padding: 9px 14px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  button:disabled { opacity: .55; cursor: default; }
  .primary { width: 100%; color: var(--white); background: var(--teal); }
  .ghost { color: var(--teal); background: var(--teal-soft); }
  .filters { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .filters select { width:auto; min-height:44px; max-width:100%; }
  .filters #subject { flex:1 1 220px; min-width:0; }
  .filters .field { margin:0; }
  .ll-terms { display:flex; gap:8px; }
  .ll-terms button { color:var(--muted); background:var(--bg); }
  .ll-terms [aria-pressed="true"] { color:var(--white); background:var(--teal); }
  .ll-dates { display:flex; flex-wrap:wrap; align-items:end; gap:8px; margin-top:12px; }
  .ll-dates .field { flex:1 1 160px; margin:0; }
  .ll-dates .hint { flex-basis:100%; margin:0; }
  .ll-digest { border-left:5px solid var(--teal); }
  .ll-digest-row { display:flex; flex-wrap:wrap; align-items:center; gap:18px; }
  .ll-stat b { display:block; font-size:26px; line-height:1.2; }
  .ll-stat span { color:var(--muted); font-size:13.5px; }
  .ll-digest #print-all { width:auto; margin-left:auto; }
  .ll-digest #result-count { margin:8px 0 0; color:var(--muted); font-size:14px; }
  .ll-split { display:grid; grid-template-columns:minmax(0,1fr); gap:18px; align-items:start; }
  .ll-list, #results { min-width:0; }
  .ll-group { margin-bottom:24px; }
  .ll-group-title { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 8px; font-size:19px; overflow-wrap:anywhere; }
  .ll-group-title .meta { font-weight:400; }
  .ll-tag { display:inline-block; padding:2px 8px; border-radius:5px; font-size:13px; color:var(--white); background:var(--ink); }
  .ll-members { display:flex; flex-wrap:wrap; gap:8px 14px; margin-bottom:10px; color:var(--muted); font-size:14px; }
  .ll-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
  .ll-log { border:1px solid var(--line); border-radius:12px; background:var(--white); margin-bottom:10px; overflow:hidden; }
  .ll-log.active { border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); }
  html body .ll-log-head { display:grid; grid-template-columns:64px minmax(0,1fr); gap:12px; width:100%; padding:14px; text-align:left; color:var(--ink); background:var(--white); font-weight:400; border-radius:0; }
  .ll-log-head:hover { background:var(--bg); }
  .ll-log-head:focus-visible, button:focus-visible, a.ghost:focus-visible { outline:2px solid var(--teal); outline-offset:-3px; }
  .ll-date { border-right:1px solid var(--line); text-align:center; }
  .ll-date b { display:block; font-size:26px; line-height:1.2; }
  .ll-date span { font-size:13px; color:var(--muted); }
  .ll-log-head h3 { margin:0 0 3px; font-size:17px; overflow-wrap:anywhere; }
  .ll-meter { margin-top:10px; }
  .ll-rail { position:relative; display:flex; height:10px; border-radius:5px; background:var(--line); }
  .ll-rail i { min-width:0; }
  .ll-rail i:first-child { border-radius:5px 0 0 5px; }
  .ll-rail i:last-of-type { border-radius:0 5px 5px 0; }
  .ll-plan { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); left:calc(var(--plan) * 100% - 1px); }
  .ll-meter-row { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:6px; font-size:14px; }
  .split-text { color:var(--muted); }
  .ll-log-body { padding:0 14px 14px; }
  .ll-sessions > div { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .ll-round { padding:12px 0; border-bottom:1px dashed var(--line); overflow-wrap:anywhere; }
  .ll-round h4 { margin:0 0 4px; }
  .ll-round .ll-actions { margin-top:8px; }
  .round-head { margin-top:4mm; padding:1mm 2mm; background:var(--bg); font-weight:600; break-after:avoid; }
  .ll-log-body h4 { margin:16px 0 4px; font-size:15px; }
  .ll-text { white-space:pre-wrap; overflow-wrap:anywhere; }
  .ll-actions { display:flex; gap:8px; margin-top:16px; }
  .ll-actions > * { flex:1; text-align:center; }
  #paper-preview { display:none; min-width:0; padding:16px; border:1px solid var(--line); border-radius:12px; background:var(--white); }
  #paper-preview .ll-actions { margin:0 0 12px; }
  #paper-preview .primary { width:auto; }
  .ll-paper-frame { aspect-ratio:210/297; overflow:hidden; border:1px solid var(--line); background:var(--white); }
  .paper-preview-doc { width:210mm; min-height:297mm; padding:12mm; transform-origin:top left; }
  .integration-line { margin-top:3mm; }
  .evidence-rows { display:grid; grid-template-columns:auto 1fr auto; margin-bottom:2mm; border-top:1px solid var(--ink); border-left:1px solid var(--ink); }
  .evidence-row { display:grid; grid-template-columns:subgrid; grid-column:1 / -1; break-inside:avoid; }
  .evidence-row > div { min-width:0; border-right:1px solid var(--ink); border-bottom:1px solid var(--ink); padding:1mm 2mm; }
  .evidence-row:first-child { font-weight:600; }
  @media (min-width:1200px) {
    .ll-split { grid-template-columns:minmax(0,1fr) 400px; }
    #paper-preview { display:block; position:sticky; top:16px; }
    .ll-log-body { display:none; }
  }
  @media (max-width:620px) {
    .ll-digest #print-all { width:100%; margin-left:0; }
    .filters #subject { flex-basis:100%; }
    .filters #teacher-field { width:100%; }
    .filters #teacher { width:100%; }
    .ll-digest-row { gap:12px; }
  }
  .section-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  .section-head h2 { margin: 0; font-size: 19px; overflow-wrap: anywhere; }
  .actions, .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips { margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 13px; color: var(--teal); background: var(--teal-soft); }
  .chip.warn { color: var(--amber); background: var(--amber-soft); }
  .hint, .meta { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .coverage-row { padding: 12px 0; border-top: 1px solid var(--line); }
  .coverage-summary { color:var(--muted); font-size:14px; }
  #coverage-card summary { min-height:48px; padding:10px 0; cursor:pointer; font-weight:600; }
  .coverage-group h3 { font-size:16px; margin-bottom:4px; }
  .coverage-note { margin-top: 4px; white-space: pre-wrap; }
  .empty { padding: 26px 10px; color: var(--muted); text-align: center; }
  .toast { position: sticky; bottom: 14px; margin-top: 12px; padding: 11px 16px; border-radius: 10px; background: var(--danger); color: var(--white); }
  [hidden] { display: none !important; }
  /* วัดเอกสารเต็มความกว้าง A4 นอกจอ เพื่อย่อเฉพาะใบที่ยาวโดยไม่ตัดข้อความทิ้ง */
  [data-print] { padding: 7px 10px; font-size: 14px; }
  #print-area { position: fixed; left: -100000px; top: 0; width: 186mm; height: 0; overflow: hidden; }
  .print-doc { width: 186mm; height: 272mm; overflow: hidden; color: var(--ink); background: var(--white); }
  /* ใบที่ยาวเกินกว่าจะย่อลงหน้าเดียวโดยยังอ่านออก — ปล่อยให้ไหลไปหน้าถัดไปแทนการย่อจนเล็ก
     🔑 เอกสารนิเทศที่อ่านไม่ออก แย่พอ ๆ กับข้อความหาย (ผู้ใช้เคาะ 2026-09-04) */
  .print-doc.print-doc-grow { height: auto; overflow: visible; }
  .print-content { width: 186mm; padding: 1mm; transform-origin: top left; font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }
  .school-heading { display: flex; justify-content: center; align-items: center; gap: 5mm; border-bottom: 1px solid var(--ink); padding-bottom: 4mm; text-align: center; }
  .school-logo { width: 18mm; height: 18mm; object-fit: contain; }
  .school-name { font-size: 19px; font-weight: 700; }
  .school-address { white-space: pre-line; }
  .document-title { margin: 5mm 0; font-size: 21px; text-align: center; }
  .document-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm 5mm; }
  .plan-name { margin: 3mm 0; }
  .evidence { margin: 4mm 0; padding: 3mm; border: 1px solid var(--ink); }
  .lesson-section { margin-top: 5mm; }
  .lesson-section h3 { margin: 0 0 2mm; font-size: 15px; }
  .lesson-text { white-space: pre-wrap; min-height: 12mm; }
  .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 10mm; text-align: center; margin-top: 13mm; }
  @media (max-width: 620px) { .filters, .row2 { grid-template-columns: 1fr; gap: 0; } }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    .nav, .app-shell, .app-sidebar, .workflow, .toast, .no-print { display: none !important; }
    html body { display: block !important; padding: 0 !important; margin: 0; background: #fff !important; font-size: 14px; }
    body::before, body::after, .workspace-card-heading { display: none !important; }
    html body .wrap, .academic-content { display: block !important; width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; }
    .card { box-shadow: none; border: 0; padding: 0; }
    #print-area { position: static; width: 100%; height: auto; overflow: visible; }
    .print-doc { break-after: page; break-inside: avoid; }
    .print-doc.print-doc-grow { break-inside: auto; }
    .print-doc:last-child { break-after: auto; }
    body.print-single .print-doc:not(.print-target) { display: none !important; }
    body.print-single .print-target { break-after: auto; }
    tr, .avoid-break { break-inside: avoid; }
    a[href]::after { content: ""; }
  }
</style>

<body>
<div class="wrap">
  <header class="no-print">
    <h1>บันทึกหลังสอน</h1>
    <p>บันทึกหลังสอนของฉัน · ค้นหาและพิมพ์หลักฐานการจัดการเรียนรู้</p>
    <div class="nav"></div>
    <script src="../app-shell.js?v=20261007-1"></script>
  </header>
  <main class="academic-content">
    <section class="card no-print" id="filter-card">
      <form id="filters" class="no-print" inert>
        <div class="filters">
          <select id="year" aria-label="ปีการศึกษา"><option value="">ทุกปี</option></select>
          <div class="ll-terms" role="group" aria-label="ภาคเรียน">
            <button type="button" data-term="" aria-pressed="true">ทั้งปี</button>
            <button type="button" data-term="1" aria-pressed="false">ภาค 1</button>
            <button type="button" data-term="2" aria-pressed="false">ภาค 2</button>
          </div>
          <select id="term" aria-label="ภาคเรียน" hidden><option value="">ทุกภาคเรียน</option><option value="1">1</option><option value="2">2</option></select>
          <select id="subject" aria-label="วิชา"><option value="">ทุกวิชา</option></select>
          <button type="button" class="ghost" id="date-toggle" aria-expanded="false" aria-controls="date-range">ช่วงวันที่ ▾</button>
          <div class="field no-print" id="teacher-field" hidden><label for="teacher">ครูผู้สอน</label><select id="teacher"></select></div>
        </div>
        <div class="ll-dates" id="date-range" hidden>
          <div class="field"><label for="from">ตั้งแต่วันที่</label><input id="from" type="date"></div>
          <div class="field"><label for="to">ถึงวันที่</label><input id="to" type="date"></div>
          <button type="button" class="ghost" id="date-clear">ล้าง</button>
          <p class="hint">ค้นหาจากวันที่สอนจริงอย่างน้อยหนึ่งครั้งในช่วงที่เลือก · เอกสารยังแสดงคาบทั้งหมดที่ผูกกับบันทึก</p>
        </div>
      </form>
    </section>
    <section class="card no-print ll-digest">
      <div class="ll-digest-row">
        <div class="ll-stat"><b id="digest-logs">—</b><span>บันทึก</span></div>
        <div class="ll-stat"><b id="digest-periods">—</b><span>คาบที่สอนจริง</span></div>
        <div class="ll-stat"><b id="digest-subjects">—</b><span>วิชา</span></div>
        <button type="button" id="print-all" class="primary no-print" disabled>พิมพ์ทั้งหมดที่ค้นเจอ (0 แผ่น)</button>
      </div>
      <p id="result-count" role="status">กำลังโหลดบันทึกของฉัน…</p>
      <p id="settings-note" class="hint" hidden></p>
    </section>
    <div class="ll-split no-print">
      <div class="ll-list">
        <div id="results" class="no-print"></div>
        <section class="card no-print" id="coverage-card" aria-live="polite" hidden></section>
      </div>
      <aside id="paper-preview" class="no-print" aria-label="ตัวอย่างกระดาษ"></aside>
    </div>
    <div id="print-area" aria-hidden="true"></div>
    <div id="toast" class="toast err no-print" role="alert" hidden></div>
  </main>
</div>
<script type="module">
import { sb, requireAuth, signOut, getActiveYear, setActiveYear, distinctYears, loadLessonLogs, loadLessonLogCoverage, summarizeLessonLogForPrint, isProjectApprover, checkDepartment } from "../supabase-client.js?v=20261010-1";
document.getElementById("btn-signout")?.addEventListener("click", e => { e.preventDefault(); signOut(); });
const session = await requireAuth();
if (!session) {
  // requireAuth กำลังพาไปหน้า login
} else {
const el = id => document.getElementById(id);
let canViewTeachers = false;
const teacherNames = new Map();
const subjectInfo = new Map();
let selectedLogId = null;
let logs = [], subjects = [], settings = new Map(), requestSeq = 0, loading = true, printing = false;
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[ch]);
}
function dateText(iso) {
  if (!iso) return "—";
  return new Date(iso + "T00:00:00").toLocaleDateString("th-TH", { day:"numeric", month:"short", year:"numeric" });
}
function dateRange(summary) {
  return summary.firstDate === summary.lastDate ? dateText(summary.firstDate)
    : dateText(summary.firstDate) + " – " + dateText(summary.lastDate);
}
function hasPrintSettings() { return ["receipt_school_name", "receipt_address"].every(key => String(settings.get(key) || "").trim()); }
function syncPrintButtons() {
  el("print-all").disabled = loading || printing || !logs.length || !hasPrintSettings();
  document.querySelectorAll("[data-print]").forEach(button => { button.disabled = loading || printing || !hasPrintSettings(); });
}
// ตัวกรองใน DOM ไม่ใช่ด่านสิทธิ์: ครูทั่วไปส่ง id ตัวเองเสมอแม้แก้ค่า select
function selectedCreatedBy() {
  return canViewTeachers ? (el("teacher").value || session.user.id) : session.user.id;
}
async function initializeTeacherFilter() {
  const [approver, academic] = await Promise.all([
    isProjectApprover(),
    checkDepartment("วิชาการ")
  ]);
  canViewTeachers = approver || academic;
  fillTeachers([]);
  el("teacher-field").hidden = !canViewTeachers;
}
function fillTeachers(rows) {
  if (!canViewTeachers) return;
  const selected = el("teacher").value || session.user.id;
  // ผลลัพธ์เรียงวันล่าสุดก่อน เลือกชื่อสำเนาจากบันทึกแรกของแต่ละคนในชุดนี้
  const seen = new Set();
  for (const row of rows) {
    if (!row.created_by || seen.has(row.created_by)) continue;
    seen.add(row.created_by);
    teacherNames.set(row.created_by, row.created_by_name || "ไม่ระบุชื่อครู");
  }
  const teachers = [...teacherNames].filter(([id]) => id !== session.user.id)
    .sort((a, b) => a[1].localeCompare(b[1], "th") || a[0].localeCompare(b[0]));
  el("teacher").innerHTML = `<option value="${escapeHtml(session.user.id)}">ของฉัน</option><option value="all">ทุกคน</option>` +
    teachers.map(([id, name]) => `<option value="${escapeHtml(id)}">${escapeHtml(name)}</option>`).join("");
  el("teacher").value = selected;
}
function rememberFilterOptions(rows, initial = false) {
  const selectedYear = initial ? getActiveYear() : el("year").value;
  subjects = [...new Map([...subjects, ...rows.map(log => log.subject).filter(Boolean)].map(subject => [subject.id, subject])).values()];
  const years = distinctYears(subjects);
  el("year").innerHTML = '<option value="">ทุกปี</option>' + years.map(year => `<option value="${escapeHtml(year)}">${escapeHtml(year)}</option>`).join("");
  el("year").value = years.includes(selectedYear) ? selectedYear : "";
  fillSubjects();
  fillTeachers(rows);
}
async function loadSubjectInfo(ids, seq = requestSeq) {
  const missing = [...new Set(ids.filter(Boolean))].filter(id => !subjectInfo.has(id));
  // พักผลทุกก้อนไว้ก่อน ไม่เติม cache จากคำขอเก่าหรือคำขอที่โหลดได้ไม่ครบ
  const rows = [];
  try {
    for (let i = 0; i < missing.length; i += 100) {
      const result = await sb.from("subjects").select("id,name,subject_type").in("id", missing.slice(i, i + 100));
      if (seq !== requestSeq) return false;
      if (result.error) throw new Error(result.error.message);
      rows.push(...(result.data || []));
    }
    if (seq !== requestSeq) return false;
    for (const row of rows) subjectInfo.set(row.id, row);
    return true;
  } catch (error) {
    if (seq === requestSeq) console.warn("โหลดข้อมูลวิชาเพิ่มเติมไม่สำเร็จ:", error.message);
    return false;
  }
}
function logSubjectIds(rows) {
  return rows.flatMap(log => [log.subject_id, ...log.sessions.map(row => row.subject_id)]);
}
function fillSubjects() {
  const old = el("subject").value;
  const available = subjects.filter(subject => (!el("year").value || subject.year === el("year").value) && (!el("term").value || subject.term === el("term").value));
  const option = subject => `<option value="${escapeHtml(subject.id)}">${escapeHtml(subject.name)} · ${escapeHtml(subject.grade_level)} · ${escapeHtml(subject.year)} / ${escapeHtml(subject.term)}</option>`;
  const typed = available.length && available.every(subject => subjectInfo.get(subject.id)?.subject_type);
  el("subject").innerHTML = '<option value="">ทุกวิชา</option>' + (typed
    ? [["วิชาบูรณาการ", true], ["วิชาพื้นฐาน", false]].map(([label, integrated]) => {
      const group = available.filter(subject => (subjectInfo.get(subject.id).subject_type === "บูรณาการ") === integrated);
      return group.length ? `<optgroup label="${label}">${group.map(option).join("")}</optgroup>` : "";
    }).join("") : available.map(option).join(""));
  if (available.some(subject => subject.id === old)) el("subject").value = old;
}
function integratedParts(log) {
  if (!log.sessions.some(row => row.subject_id !== log.subject_id)) return [];
  const ids = [...new Set(log.sessions.map(row => row.subject_id))];
  if (!ids.every(id => subjectInfo.get(id)?.name)) return [];
  return ids.map(id => ({ id, name:subjectInfo.get(id).name,
    periods:summarizeLessonLogForPrint({ sessions:log.sessions.filter(row => row.subject_id === id) }).totalPeriods
  })).sort((a, b) => a.name.localeCompare(b.name, "th") || a.id.localeCompare(b.id));
}
// คงใบเดิมทั้งใบสำหรับแผนรอบเดียว รวมด้วย id ของใบแรกเท่านั้น ไม่จับจากชื่อ
function groupLessonPlans(rows) {
  const groups = new Map();
  for (const log of rows) {
    const key = log.continues_log_id || log.id;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(log);
  }
  return [...groups].map(([key, rounds]) => {
    if (rounds.length === 1 && !rounds[0].continues_log_id) return rounds[0];
    const root = rounds.find(row => row.id === key);
    if (!root) throw new Error("ไม่พบใบแรกของแผน กรุณาโหลดบันทึกใหม่");
    const ordered = [...rounds].sort((a, b) => String(summarizeLessonLogForPrint(a).firstDate || "")
      .localeCompare(String(summarizeLessonLogForPrint(b).firstDate || "")) ||
      String(a.created_at || "").localeCompare(String(b.created_at || "")) || String(a.id).localeCompare(String(b.id)));
    const sessions = ordered.flatMap(row => row.sessions).sort((a, b) =>
      String(a.session_date || "").localeCompare(String(b.session_date || "")) || String(a.id).localeCompare(String(b.id)));
    return { ...root, id:key, rounds:ordered, sessions };
  }).sort((a, b) => String(summarizeLessonLogForPrint(b).lastDate || "")
    .localeCompare(String(summarizeLessonLogForPrint(a).lastDate || "")));
}

async function refreshCoverage(filters, seq) {
  const card = el("coverage-card");
  card.hidden = selectedCreatedBy() !== session.user.id;
  card.innerHTML = "";
  if (card.hidden) return;
  card.innerHTML = '<p class="hint">กำลังตรวจสอบคาบในบันทึก…</p>';
  try {
    const data = await loadLessonLogCoverage({ userId:session.user.id, ...filters });
    if (seq !== requestSeq || selectedCreatedBy() !== session.user.id) return;
    rememberFilterOptions((data.subjects || []).map(subject => ({ subject })));
    const parents = new Map();
    try {
      const ids = [...new Set(data.missing.map(row => row.subject_id).filter(Boolean))];
      const links = [];
      for (let i = 0; i < ids.length; i += 100) {
        const result = await sb.from("integration_members").select("integrated_subject_id,member_subject_id").in("member_subject_id", ids.slice(i, i + 100));
        if (seq !== requestSeq || selectedCreatedBy() !== session.user.id) return;
        if (result.error) throw new Error(result.error.message);
        links.push(...(result.data || []));
      }
      await loadSubjectInfo([...(data.subjects || []).map(subject => subject.id), ...links.map(row => row.integrated_subject_id)], seq);
      if (seq !== requestSeq || selectedCreatedBy() !== session.user.id) return;
      for (const link of links) {
        const parent = subjectInfo.get(link.integrated_subject_id);
        if (parent?.name && !parents.has(link.member_subject_id)) parents.set(link.member_subject_id, parent);
      }
    } catch (error) {
      if (seq === requestSeq) console.warn("โหลดกลุ่มวิชาเพิ่มเติมไม่สำเร็จ:", error.message);
    }
    if (seq !== requestSeq || selectedCreatedBy() !== session.user.id) return;
    fillSubjects();
    renderCoverage(data, parents);
  } catch (error) {
    if (seq !== requestSeq || selectedCreatedBy() !== session.user.id) return;
    card.innerHTML = `<p class="hint">${escapeHtml(error.message)} · กรุณากดค้นหาเพื่อลองอีกครั้ง</p>`;
  }
}
async function search() {
  const seq = ++requestSeq;
  loading = true;
  logs = [];
  renderResults();
  el("result-count").textContent = selectedCreatedBy() === session.user.id ? "กำลังโหลดบันทึกของฉัน…" : "กำลังโหลดบันทึก…";
  el("toast").hidden = true;
  const filters = selectedFilters();
  const coverageRequest = refreshCoverage(filters, seq);
  try {
    const [result] = await Promise.all([
      loadLessonLogs({ createdBy:selectedCreatedBy(), ...filters }),
      coverageRequest
    ]);
    if (seq !== requestSeq) return;
    await loadSubjectInfo(logSubjectIds(result), seq);
    if (seq !== requestSeq) return;
    logs = groupLessonPlans(result);
    rememberFilterOptions(result);
    renderResults();
  } catch (error) {
    if (seq !== requestSeq) return;
    el("result-count").textContent = "โหลดไม่สำเร็จ · ตรวจตัวกรองแล้วกดค้นหาอีกครั้ง";
    el("results").innerHTML = "";
    el("toast").textContent = error.message;
    el("toast").hidden = false;
  } finally {
    if (seq === requestSeq) { loading = false;
      el("digest-logs").textContent = logs.length;
      el("digest-periods").textContent = logs.reduce((total, log) => total + summarizeLessonLogForPrint(log).totalPeriods, 0);
      el("digest-subjects").textContent = new Set(logs.map(log => log.subject_id)).size;
      syncPrintButtons();
    }
  }
}

      // transform ไม่ลดกล่องในผังหน้า จึงต้องตั้งความสูงเท่าที่ย่อแล้วเอง ไม่งั้นเหลือหน้าว่างต่อท้าย
      doc.classList.add("print-doc-grow");
      doc.style.height = Math.ceil(content.scrollHeight * MIN_PRINT_SCALE) + "px";
      content.style.transform = `scale(${MIN_PRINT_SCALE})`;
    } else {
      content.style.transform = `scale(${scale})`;
    }
  }
}
window.addEventListener("beforeprint", fitPrintDocuments);
window.addEventListener("afterprint", clearPrintTarget);
async function printLogs(id = null) {
  if (loading || printing || !logs.length || !hasPrintSettings()) return;
  if (id && !logs.some(log => log.id === id)) return;
  printing = true;
  syncPrintButtons();
  // เตรียมสำเนาที่จะพิมพ์ให้คงที่ แม้คำขอค้นหารอบใหม่กำลังเริ่ม
  el("filters").inert = true;
  try {
    clearPrintTarget();
    if (id) {
      document.body.classList.add("print-single");
      [...document.querySelectorAll(".print-doc")].find(doc => doc.dataset.logId === id)?.classList.add("print-target");
    }
    await document.fonts.ready;
    await Promise.all([...el("print-area").querySelectorAll("img")].map(img => img.decode()));
    fitPrintDocuments();
    window.print();
  } catch (error) {
    el("toast").textContent = "เตรียมพิมพ์ไม่สำเร็จ กรุณาลองอีกครั้ง: " + error.message;
    el("toast").hidden = false;
  } finally {
    clearPrintTarget();
    printing = false;
    el("filters").inert = false;
    syncPrintButtons();
  }
}
el("filters").addEventListener("submit", event => { event.preventDefault(); if (!printing) search(); });
el("teacher").addEventListener("change", () => { el("subject").value = ""; search(); });
el("year").addEventListener("change", () => { setActiveYear(el("year").value); fillSubjects(); search(); });
function changeTerm() {
  document.querySelectorAll("[data-term]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.term === el("term").value)));
  fillSubjects(); search();
}
el("term").addEventListener("change", changeTerm);
document.querySelectorAll("[data-term]").forEach(button => button.addEventListener("click", () => { el("term").value = button.dataset.term; changeTerm(); }));
function syncDateRange() {
  const from = el("from").value, to = el("to").value;
  if (from || to) el("date-range").hidden = false;
  el("date-toggle").textContent = from || to ? `ช่วงวันที่ · ${from ? dateText(from) : "…"}–${to ? dateText(to) : "…"}` : "ช่วงวันที่ ▾";
  el("date-toggle").setAttribute?.("aria-expanded", String(!el("date-range").hidden));
}
el("date-toggle").addEventListener("click", () => { el("date-range").hidden = !el("date-range").hidden; syncDateRange(); });
el("date-clear").addEventListener("click", () => { el("from").value = ""; el("to").value = ""; syncDateRange(); search(); });
for (const id of ["from", "to"]) el(id).addEventListener("change", syncDateRange);
for (const id of ["subject", "from", "to"]) el(id).addEventListener("change", search);
el("print-all").addEventListener("click", () => printLogs());
el("results").addEventListener("click", event => {
  const button = event.target.closest("[data-print]");
  if (button) { printLogs(button.dataset.print); return; }
  const head = event.target.closest(".ll-log-head");
  if (!head) return;
  const article = head.closest(".ll-log");
  if (window.matchMedia("(min-width:1200px)").matches) {
    selectedLogId = article.dataset.logId;
    el("results").querySelectorAll(".ll-log").forEach(row => row.classList.toggle("active", row.dataset.logId === selectedLogId));
    renderPaperPreview(); syncPrintButtons();
  } else {
    const body = article.querySelector(".ll-log-body");
    body.hidden = !body.hidden;
    head.setAttribute("aria-expanded", String(!body.hidden));
  }
});
el("paper-preview").addEventListener("click", event => { const button = event.target.closest("[data-print]"); if (button) printLogs(button.dataset.print); });
window.addEventListener("resize", scalePaperPreview);
if (typeof ResizeObserver !== "undefined") new ResizeObserver(scalePaperPreview).observe(el("paper-preview"));
try {
  await initializeTeacherFilter();
  const [mine, settingsResult] = await Promise.all([
    loadLessonLogs({ createdBy:selectedCreatedBy() }),
    sb.from("app_settings").select("key,value").in("key", ["receipt_school_name", "receipt_address"])
  ]);
  if (settingsResult.error) throw new Error("โหลดหัวกระดาษไม่สำเร็จ: " + settingsResult.error.message);
  settings = new Map((settingsResult.data || []).map(row => [row.key, row.value]));
  if (!hasPrintSettings()) {
    el("settings-note").textContent = "ยังพิมพ์ไม่ได้ · ให้ผู้ดูแลตั้งชื่อโรงเรียนและที่อยู่ในค่าตั้งใบเสร็จก่อน";
    el("settings-note").hidden = false;
  }
  await refreshCoverage({}, requestSeq);
  await loadSubjectInfo([...logSubjectIds(mine), ...subjects.map(subject => subject.id)]);
  rememberFilterOptions(mine, true);
  if (el("year").value) await refreshCoverage(selectedFilters(), requestSeq);
  logs = groupLessonPlans(mine.filter(log => !el("year").value || log.subject?.year === el("year").value));
  loading = false;
  el("filters").inert = false;
  renderResults();
} catch (error) {
  loading = false;
  el("result-count").textContent = "โหลดไม่สำเร็จ · กรุณาโหลดหน้าใหม่เพื่อลองอีกครั้ง";
  el("toast").textContent = error.message;
  el("toast").hidden = false;
}
}
</script>
