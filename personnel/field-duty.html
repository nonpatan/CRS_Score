<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกออกปฏิบัติหน้าที่ — CRS MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2a2e; --muted:#5f6b70; --line:#dfe4e3; --teal:#0f6e56; --teal-soft:#e1f5ee;
          --bg:#f7f8f7; --white:#fff; --danger:#a32d2d; --danger-soft:#fceaea;
          --amber:#8a5a00; --amber-soft:#fff4df; --purple:#67469a; --purple-soft:#f1eafa; }
  * { box-sizing:border-box; }
  body { font-family:"Sarabun",sans-serif; color:var(--ink); background:var(--bg);
         margin:0; padding:16px; font-size:16px; line-height:1.6; }
  .wrap { max-width:760px; margin:0 auto; }
  header h1 { font-size:20px; font-weight:600; margin:4px 0; }
  header p { color:var(--muted); margin:0 0 8px; font-size:14px; }
  header .nav { display:flex; gap:8px; flex-wrap:wrap; background:var(--white); padding:8px;
                border-radius:99px; border:1px solid var(--line); margin:0 0 24px; align-items:center; }
  header .nav a { color:var(--muted); text-decoration:none; font-weight:500;
                  padding:8px 16px; border-radius:99px; font-size:14px; }
  header .nav a.active { background:var(--teal); color:var(--white); }
  header .nav #btn-signout { margin-left:auto; color:var(--danger); background:#fff0f0; }
  .card { background:var(--white); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:500; margin-bottom:6px; font-size:15px; }
  input, select, textarea { width:100%; font-family:inherit; font-size:16px; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; background:var(--white); color:var(--ink); }
  textarea { min-height:72px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--teal); outline-offset:1px; }
  .field { margin-bottom:14px; } .field:last-child { margin-bottom:0; }
  .field-note { color:var(--muted); font-size:13px; margin-top:4px; }
  .row2 { display:flex; gap:12px; flex-wrap:wrap; } .row2 > * { flex:1 1 220px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  button { font-family:inherit; font-size:15px; font-weight:600; padding:10px 14px;
           border:none; border-radius:8px; cursor:pointer; }
  button.primary { flex:1; background:var(--teal); color:var(--white); }
  button.ghost { background:var(--teal-soft); color:var(--teal); }
  button.danger { background:var(--danger-soft); color:var(--danger); }
  button.small { padding:6px 10px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  .section { font-size:12px; font-weight:600; color:var(--muted);
                   text-transform:uppercase; letter-spacing:.03em; margin:4px 0 10px; }
  .banner { padding:11px 13px; border-radius:10px; font-size:14px; margin-bottom:14px; }
  .banner.warn { background:var(--amber-soft); color:var(--amber); }
  .duty-row { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); }
  .duty-row:last-child { border-bottom:none; }
  .duty-info { flex:1; min-width:0; }
  .duty-title { font-weight:600; overflow-wrap:anywhere; }
  .duty-meta { color:var(--muted); font-size:13.5px; overflow-wrap:anywhere; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; }
  .chip { display:inline-flex; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600;
          color:var(--purple); background:var(--purple-soft); }
  .chip.report { color:var(--teal); background:var(--teal-soft); }
  .chip.missing { color:var(--amber); background:var(--amber-soft); }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .report-link { color:var(--teal); font-weight:600; text-decoration:none; }
  .report-link:hover { text-decoration:underline; }
  .muted-empty { color:var(--muted); text-align:center; padding:18px 0; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); padding:11px 18px;
           border-radius:10px; background:#1f2a2e; color:#fff; font-weight:600; opacity:0;
           pointer-events:none; transition:opacity .18s; z-index:60; max-width:calc(100vw - 32px); }
  #toast.show { opacity:1; } #toast.err { background:var(--danger); }
  @media (max-width:520px) {
    .duty-row { display:block; }
    .row-actions { justify-content:flex-start; margin-top:10px; }
  }
  /* ปุ่มประเภทและวันที่ใช้ช่องเดิมเป็นแหล่งความจริง */
  [hidden] { display:none !important; }
  .choice-group, .date-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .choice-group button, .date-chips button, #multi-days { min-height:44px; background:var(--white); border:1px solid var(--line); color:var(--ink); }
  .choice-group button[aria-checked="true"], .date-chips button[aria-pressed="true"] { color:var(--teal); background:var(--teal-soft); border-color:var(--teal); }
  button:focus-visible, a:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  #quota-hint { margin:0 0 14px; }
  #date-fields { padding:12px; border:1px solid var(--line); border-radius:10px; margin-bottom:14px; }
  #date-fields.is-empty { background:var(--amber-soft); border-color:var(--amber); }
  #date-fields input { min-width:0; }
  #multi-days { margin-top:8px; width:100%; color:var(--teal); }
  #end-field { margin:12px 0 0; }
  .month-nav { display:grid; grid-template-columns:44px minmax(0,1fr) 44px; align-items:center; gap:8px; margin-bottom:12px; }
  .month-nav button { min-height:44px; padding:6px; background:var(--teal-soft); color:var(--teal); }
  #month-title { text-align:center; font-weight:600; font-size:15px; }
  .coverage-link { display:inline-flex; min-height:44px; align-items:center; padding:6px 10px; border-radius:8px; color:var(--teal); background:var(--teal-soft); text-decoration:none; font-size:14px; font-weight:600; }
  .leave-row .info { overflow-wrap:anywhere; }
  .leave-row .row-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .leave-row button.small, .duty-row button.small { min-height:44px; }
  #leave-success { background:var(--teal-soft); color:var(--teal); padding:16px; border:1px solid var(--teal); border-radius:12px; margin-bottom:16px; }
  #leave-success .success-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  #leave-success a { min-height:44px; background:var(--teal); color:var(--white); padding:10px 14px; border-radius:8px; text-decoration:none; font-weight:600; }
  #leave-success button { min-height:44px; background:var(--white); color:var(--teal); }
  @media (max-width:520px) { .leave-row { display:block; } .leave-row .row-actions { margin-top:8px; } }
  @media (prefers-reduced-motion:reduce) { .leave-row.just-saved { animation:none; } }
</style>
<link rel="stylesheet" href="../app-shell.css?v=20261003-1">
</head>
<body>
<div class="wrap">
  <header>
    <h1>บันทึกออกปฏิบัติหน้าที่</h1>
    <p>บันทึกการออกนอกสถานที่ อบรม และศึกษาดูงานแบบเต็มวัน</p>
    <div class="nav">
      <a href="index.html">ภาพรวมบุคลากร</a>
      <a href="leave.html">บันทึกการลา</a>
      <a href="field-duty.html">บันทึกออกปฏิบัติหน้าที่</a>
      <a href="duty.html">ตารางเวร</a>
      <a href="my-work.html">ข้อมูลการทำงานของฉัน</a>
      <a href="#" id="btn-signout">ออกจากระบบ</a>
    </div>
    <script src="../app-shell.js?v=20261007-1"></script>
  </header>
  <main class="academic-content">

  <div id="form-card" class="card">
    <div class="section" id="form-title">บันทึกรายการใหม่</div>
    <div class="field">
      <label for="f-staff">บุคลากร</label>
      <select id="f-staff"><option value="">กำลังโหลดรายชื่อ…</option></select>
    </div>
    <div class="field">
      <label id="kind-label">ประเภท</label>
      <select id="f-kind" hidden aria-hidden="true">
        <option value="ปฏิบัติหน้าที่นอกสถานที่">ปฏิบัติหน้าที่นอกสถานที่</option>
        <option value="อบรม">อบรม</option>
        <option value="ศึกษาดูงาน">ศึกษาดูงาน</option>
      </select>
      <div id="kind-buttons" class="choice-group" role="radiogroup" aria-labelledby="kind-label"></div>
    </div>
    <div id="date-fields">
      <label for="f-start">วันที่ · เลือกวัน</label>
      <div class="date-chips" role="group" aria-label="เลือกวันที่เร็ว">
        <button type="button" id="date-today" aria-pressed="false">วันนี้</button>
        <button type="button" id="date-tomorrow" aria-pressed="false">พรุ่งนี้</button>
      </div>
      <input id="f-start" type="date">
      <button type="button" id="multi-days" aria-expanded="false" aria-controls="end-field">+ ลาหลายวัน (ใส่วันสุดท้าย)</button>
      <div class="field" id="end-field" hidden>
        <label for="f-end">ถึงวันที่</label>
        <input id="f-end" type="date">
        <div class="field-note">เต็มวันเท่านั้น · รายการวันเดียวใช้วันที่เดียวกัน</div>
      </div>
    </div>
    <div class="field">
      <label for="f-title">หัวข้อ / ชื่อหลักสูตร</label>
      <input id="f-title" type="text" maxlength="300" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-organizer">หน่วยงานจัด (ไม่บังคับ)</label>
      <input id="f-organizer" type="text" maxlength="300" autocomplete="off">
    </div>
    <div class="field">
      <label for="f-note">หมายเหตุ (ไม่บังคับ)</label>
      <textarea id="f-note" maxlength="1000"></textarea>
    </div>
    <div class="actions">
      <button id="btn-save" class="primary">บันทึกรายการ</button>
      <button id="btn-cancel" class="ghost" type="button" hidden>ยกเลิกการแก้ไข</button>
    </div>
  </div>

  <div class="card">
    <div class="section">รายการที่บันทึกไว้</div>
    <div class="month-nav" aria-label="เดือนของรายการ">
      <button type="button" id="month-prev" aria-label="เดือนก่อน">‹</button>
      <div id="month-title" aria-live="polite"></div>
      <button type="button" id="month-next" aria-label="เดือนถัดไป">›</button>
    </div>
    <div class="field">
      <input id="q" type="search" placeholder="ค้นหาชื่อ หัวข้อ หรือหน่วยงาน" autocomplete="off">
    </div>
    <div id="count" class="field-note">กำลังโหลด…</div>
    <div id="list"></div>
  </div>
    <div id="toast"></div>
  </main>
</div>

<script type="module">
import {
  sb, requireAuth, signOut, checkDepartment, applyPersonnelMenuAccess,
  personnelAccessDeniedHtml, getProfile, bangkokNow, toDateStr,
  getStaffFieldDuties, createStaffFieldDuty, updateStaffFieldDuty,
  deleteStaffFieldDuty, getTrainingReports
} from "../supabase-client.js?v=20261010-1";

const session = await requireAuth();
if (session) {
  const el = id => document.getElementById(id);
  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[ch]);
  const safeUrl = value => {
    try {
      const url = new URL(String(value || ""));
      return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
    } catch { return ""; }
  };
  let toastTimer = null;
  const toast = (message, error = false) => {
    el("toast").textContent = message;
    el("toast").classList.toggle("err", error);
    el("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el("toast").classList.remove("show"), 3500);
  };
  el("btn-signout")?.addEventListener("click", event => {
    event.preventDefault();
    signOut();
  });

  const canManageHr = await checkDepartment("บุคลากร");
  applyPersonnelMenuAccess(canManageHr);
  if (!canManageHr) {
    document.querySelectorAll(".card").forEach(node => node.remove());
    const box = document.createElement("div");
    box.className = "card";
    box.innerHTML = personnelAccessDeniedHtml();
    document.querySelector("main").appendChild(box);
  } else {
    const profile = await getProfile(session.user.id);
    const isAdmin = profile?.role === "admin";
    let staff = [];
    let duties = [];
    let reportsByDuty = new Map();
    let editingId = null;

    const fmt = value => new Date(value + "T00:00:00Z").toLocaleDateString("th-TH", {
      day:"numeric", month:"short", year:"numeric", timeZone:"UTC"
    });
    const nameOf = id => staff.find(row => row.id === id)?.full_name || "(ไม่พบชื่อ)";

    // ปุ่มแตะสั่งช่องเดิมและยิง change ให้ตรรกะเดิมทำงาน
    function syncChoiceUi(selectId, groupId) {
      const select = el(selectId);
      const group = el(groupId);
      group.innerHTML = [...select.options].filter(option => option.value).map(option =>
        `<button type="button" role="radio" data-choice="${esc(option.value)}" aria-checked="${option.value === select.value}" tabindex="${option.value === select.value ? 0 : -1}">${esc(option.textContent)}</button>`
      ).join("");
    }
    function bindChoiceUi(selectId, groupId) {
      const group = el(groupId);
      const choose = button => {
        el(selectId).value = button.dataset.choice;
        el(selectId).dispatchEvent(new Event("change", { bubbles:true }));
        syncChoiceUi(selectId, groupId);
        group.querySelector('[aria-checked="true"]')?.focus();
      };
      group.addEventListener("click", event => {
        const button = event.target.closest("[data-choice]");
        if (button) choose(button);
      });
      group.addEventListener("keydown", event => {
        if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"].includes(event.key)) return;
        const buttons = [...group.querySelectorAll("[data-choice]")];
        const at = buttons.indexOf(event.target.closest("[data-choice]"));
        if (at < 0 || !buttons.length) return;
        event.preventDefault();
        const next = event.key === "Home" ? 0 : event.key === "End" ? buttons.length - 1 :
          (at + (["ArrowLeft", "ArrowUp"].includes(event.key) ? -1 : 1) + buttons.length) % buttons.length;
        choose(buttons[next]);
      });
      el(selectId).addEventListener("change", () => syncChoiceUi(selectId, groupId));
    }

    let multipleDays = false;
    const thaiDateShort = value => new Date(value + "T00:00:00Z").toLocaleDateString("th-TH", {
      weekday:"short", day:"numeric", month:"short", timeZone:"UTC"
    });
    const dateChoices = () => {
      const now = bangkokNow();
      const today = toDateStr(now);
      now.setUTCDate(now.getUTCDate() + 1);
      return [today, toDateStr(now)];
    };
    function syncDateUi(fromValues = false) {
      const start = el("f-start").value;
      const end = el("f-end").value;
      const half = el("f-portion") && el("f-portion").value !== "full";
      if (fromValues) multipleDays = !!start && !!end && start !== end;
      if (!start || half) multipleDays = false;
      el("end-field").hidden = !multipleDays;
      el("multi-days").disabled = !!half;
      el("multi-days").setAttribute("aria-expanded", String(multipleDays));
      el("multi-days").textContent = multipleDays ? "− ใช้วันเดียว" : "+ ลาหลายวัน (ใส่วันสุดท้าย)";
      el("date-fields").classList.toggle("is-empty", !start);
      if (!multipleDays) el("f-end").value = start;
      const dates = dateChoices();
      ["date-today", "date-tomorrow"].forEach((id, index) => {
        el(id).dataset.date = dates[index];
        el(id).setAttribute("aria-pressed", String(start === dates[index]));
      });
      el("date-today").textContent = "วันนี้ " + thaiDateShort(dates[0]);
    }
    function bindDateUi() {
      ["date-today", "date-tomorrow"].forEach(id => el(id).addEventListener("click", () => {
        el("f-start").value = el(id).dataset.date;
        el("f-start").dispatchEvent(new Event("change", { bubbles:true }));
      }));
      el("multi-days").addEventListener("click", () => {
        multipleDays = !multipleDays;
        syncDateUi();
        if (multipleDays) el("f-end").focus();
      });
      // ต้องติดตั้งหลัง listener เดิม เพื่อไม่ให้วันสุดท้ายค้างเมื่อเลือกวันเดียว
      el("f-start").addEventListener("change", () => {
        syncDateUi();

      });
      el("f-end").addEventListener("change", () => syncDateUi());
      el("f-portion")?.addEventListener("change", () => syncDateUi());
    }

    let listMonth = toDateStr(bangkokNow()).slice(0, 7);
    const shiftMonth = (month, offset) => {
      const date = new Date(month + "-01T00:00:00Z");
      date.setUTCMonth(date.getUTCMonth() + offset);
      return date.toISOString().slice(0, 7);
    };
    const inListMonth = row => row.start_date.slice(0, 7) <= listMonth &&
      (row.end_date || row.start_date).slice(0, 7) >= listMonth;
    function syncMonthUi(allRows, count, searching, unit) {
      const months = [toDateStr(bangkokNow()).slice(0, 7), ...allRows.flatMap(row =>
        [row.start_date.slice(0, 7), (row.end_date || row.start_date).slice(0, 7)])].sort();
      el("month-prev").disabled = !!searching || listMonth <= months[0];
      el("month-next").disabled = !!searching || listMonth >= months[months.length - 1];
      el("month-title").textContent = searching ? "ค้นหาทุกเดือน" :
        new Date(listMonth + "-01T00:00:00Z").toLocaleDateString("th-TH", {
          month:"long", year:"numeric", timeZone:"UTC"
        }) + ` · ${count} ${unit}`;
      el("count").hidden = !searching;
      el("count").textContent = searching ? `พบ ${count} ${unit} (ทุกเดือน)` : "";
    }
    function bindMonthUi() {
      el("month-prev").addEventListener("click", () => { listMonth = shiftMonth(listMonth, -1); render(); });
      el("month-next").addEventListener("click", () => { listMonth = shiftMonth(listMonth, 1); render(); });
    }

    function resetForm() {
      editingId = null;
      el("form-title").textContent = "บันทึกรายการใหม่";
      el("btn-save").textContent = "บันทึกรายการ";
      el("btn-cancel").hidden = true;
      el("f-title").value = "";
      el("f-organizer").value = "";
      el("f-note").value = "";
      el("f-kind").value = "ปฏิบัติหน้าที่นอกสถานที่";
      const today = toDateStr(bangkokNow());
      el("f-start").value = today;
      el("f-end").value = today;
    }

    function render() {
      syncChoiceUi("f-kind", "kind-buttons");
      syncDateUi();
      const q = el("q").value.trim().toLocaleLowerCase("th");
      const rows = duties.filter(row => {
        const haystack = [nameOf(row.staff_id), row.title, row.organizer, row.kind]
          .join(" ").toLocaleLowerCase("th");
        return q ? haystack.includes(q) : inListMonth(row);
      });
      syncMonthUi(duties, rows.length, q, "รายการ");
      el("list").innerHTML = rows.length ? rows.map(row => {
        const report = reportsByDuty.get(row.id);
        const url = safeUrl(report?.report_url);
        const range = row.start_date === row.end_date
          ? fmt(row.start_date)
          : `${fmt(row.start_date)} – ${fmt(row.end_date)}`;
        return `<div class="duty-row">
          <div class="duty-info">
            <div class="duty-title">${esc(nameOf(row.staff_id))} · ${esc(row.title)}</div>
            <div class="duty-meta">${esc(range)}${row.organizer ? " · " + esc(row.organizer) : ""}</div>
            ${row.note ? `<div class="duty-meta">หมายเหตุ: ${esc(row.note)}</div>` : ""}
            <div class="chips">
              <span class="chip">${esc(row.kind)}</span>
              ${report
                ? `<span class="chip report">ส่งลิงก์รายงานแล้ว</span>${url
                    ? `<a class="report-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">เปิดรายงาน</a>`
                    : ""}`
                : '<span class="chip missing">ยังไม่ส่งลิงก์รายงาน</span>'}
            </div>
          </div>
          <div class="row-actions">
            ${row.start_date >= toDateStr(bangkokNow()) ? `<a class="coverage-link" href="coverage.html?date=${encodeURIComponent(row.start_date)}">จัดคนแทน →</a>` : ""}
            <button class="ghost small" data-edit="${row.id}">แก้ไข</button>
            ${isAdmin ? `<button class="danger small" data-delete="${row.id}">ลบ</button>` : ""}
          </div>
        </div>`;
      }).join("") : `<div class="muted-empty">${q ? "ไม่พบรายการที่ตรงกับคำค้น" : "ยังไม่มีรายการออกปฏิบัติหน้าที่"}</div>`;
    }

    async function loadAll() {
      try {
        const [staffRes, dutyRows] = await Promise.all([
          sb.from("staff").select("id,full_name,is_active").order("full_name"),
          getStaffFieldDuties()
        ]);
        if (staffRes.error) throw new Error("โหลดรายชื่อบุคลากรไม่สำเร็จ");
        staff = staffRes.data || [];
        duties = dutyRows;
        const reports = await getTrainingReports(duties.map(row => row.id));
        reportsByDuty = new Map(reports.map(row => [row.field_duty_id, row]));
        const selected = el("f-staff").value;
        el("f-staff").innerHTML = '<option value="">— เลือกบุคลากร —</option>' +
          staff.map(row => `<option value="${row.id}"${row.is_active ? "" : " disabled"}>${
            esc(row.full_name)}${row.is_active ? "" : " (ออกแล้ว)"}</option>`).join("");
        if (staff.some(row => row.id === selected)) el("f-staff").value = selected;
        render();
        syncDateUi(true);
      } catch (error) {
        el("list").innerHTML = '<div class="banner warn">โหลดรายการไม่สำเร็จ กรุณาลองเปิดหน้าใหม่</div>';
        el("count").textContent = "เกิดข้อผิดพลาด";
      }
    }

    el("f-start").addEventListener("change", () => {
      if (!el("f-end").value || el("f-end").value < el("f-start").value) {
        el("f-end").value = el("f-start").value;
      }
    });
    el("q").addEventListener("input", render);
    el("btn-cancel").addEventListener("click", resetForm);
    el("btn-save").addEventListener("click", async () => {
      const payload = {
        staff_id: el("f-staff").value,
        start_date: el("f-start").value,
        end_date: el("f-end").value || el("f-start").value,
        kind: el("f-kind").value,
        title: el("f-title").value.trim(),
        organizer: el("f-organizer").value.trim() || null,
        note: el("f-note").value.trim() || null
      };
      if (!payload.staff_id) return toast("กรุณาเลือกบุคลากร", true);
      if (!payload.start_date) return toast("กรุณาเลือกวันที่เริ่ม", true);
      if (payload.end_date < payload.start_date) return toast("วันสิ้นสุดต้องไม่ก่อนวันเริ่ม", true);
      if (!payload.title) return toast("กรุณากรอกหัวข้อหรือชื่อหลักสูตร", true);

      el("btn-save").disabled = true;
      try {
        if (editingId) await updateStaffFieldDuty(editingId, payload);
        else await createStaffFieldDuty({ ...payload, created_by: session.user.id });
        toast(editingId ? "แก้ไขรายการแล้ว" : "บันทึกรายการแล้ว");
        resetForm();
        await loadAll();
      } catch (error) {
        toast(error.message || "บันทึกไม่สำเร็จ กรุณาลองใหม่", true);
      } finally {
        el("btn-save").disabled = false;
      }
    });

    el("list").addEventListener("click", async event => {
      const editButton = event.target.closest("[data-edit]");
      if (editButton) {
        const row = duties.find(item => item.id === editButton.dataset.edit);
        if (!row) return;
        editingId = row.id;
        el("form-title").textContent = "แก้ไขรายการ";
        el("btn-save").textContent = "บันทึกการแก้ไข";
        el("btn-cancel").hidden = false;
        el("f-staff").value = row.staff_id;
        el("f-kind").value = row.kind;
        el("f-start").value = row.start_date;
        el("f-end").value = row.end_date;
        el("f-title").value = row.title || "";
        el("f-organizer").value = row.organizer || "";
        el("f-note").value = row.note || "";
        el("form-card").scrollIntoView({ behavior:"smooth", block:"start" });
        return;
      }
      const deleteButton = event.target.closest("[data-delete]");
      if (!deleteButton || !isAdmin) return;
      if (!await window.crsAskConfirm({
        title: "ลบรายการออกปฏิบัติหน้าที่",
        message: "ลิงก์รายงานที่ผูกไว้จะถูกลบด้วยและกู้คืนไม่ได้",
        okLabel: "ลบรายการ"
      })) return;
      deleteButton.disabled = true;
      try {
        await deleteStaffFieldDuty(deleteButton.dataset.delete);
        if (editingId === deleteButton.dataset.delete) resetForm();
        toast("ลบรายการแล้ว");
        await loadAll();
      } catch (error) {
        toast("ลบรายการไม่สำเร็จ กรุณาลองใหม่", true);
      } finally {
        deleteButton.disabled = false;
      }
    });

    bindChoiceUi("f-kind", "kind-buttons");
    bindDateUi();
    bindMonthUi();
    // listener เดิมตั้งค่าตรง ๆ ในโหมดแก้ไข จึงซิงก์หลัง handler เดิมโดยไม่แตะการบันทึก
    el("list").addEventListener("click", event => {
      if (event.target.closest("[data-edit]")) {
        syncChoiceUi("f-kind", "kind-buttons");
        syncDateUi(true);
      }
    });
    el("btn-cancel").addEventListener("click", () => {
      syncChoiceUi("f-kind", "kind-buttons");
      syncDateUi(true);
    });

    resetForm();
    await loadAll();
  }
}
</script>
</body>
</html>
