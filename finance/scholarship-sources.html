<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทะเบียนแหล่งทุน — CRS MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2a2e; --muted:#5f6b70; --line:#dfe4e3; --teal:#0f6e56; --teal-soft:#e1f5ee; --bg:#f7f8f7; --white:#fff; --danger:#a32d2d; --danger-soft:#fceaea; --amber:#93690f; --amber-soft:#faf1dd; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; color:var(--ink); background:var(--bg); font-family:"Sarabun",sans-serif; font-size:16px; line-height:1.6; }
  .wrap { max-width:760px; margin:0 auto; }
  header h1 { margin:4px 0; font-size:22px; }
  header p { margin:0 0 8px; color:var(--muted); font-size:14px; }
  header .nav { min-height:54px; }
  .card { margin-bottom:16px; padding:16px; overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--white); }
  .section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .section-head h2 { margin:0; font-size:18px; }
  .section-head p, .meta { margin:2px 0 0; color:var(--muted); font-size:13px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field { margin-bottom:14px; }
  label { display:block; margin-bottom:5px; font-size:14px; font-weight:600; }
  input[type="text"], select, textarea { width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:#fff; font:inherit; font-size:16px; }
  textarea { min-height:88px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--teal); outline-offset:1px; }
  button { min-height:44px; padding:10px 14px; border:0; border-radius:9px; font:inherit; font-weight:700; cursor:pointer; }
  button.primary { color:#fff; background:var(--teal); }
  button.ghost { color:var(--teal); background:var(--teal-soft); }
  button.danger { color:var(--danger); background:var(--danger-soft); }
  button:disabled { opacity:.55; cursor:default; }
  .actions { display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
  .source-list { border-top:1px solid var(--line); }
  .source-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:start; padding:14px 0; border-bottom:1px solid var(--line); }
  .source-row.inactive { opacity:.68; }
  .source-name { font-weight:700; overflow-wrap:anywhere; }
  .badge { display:inline-block; margin-left:6px; padding:2px 8px; border-radius:999px; color:var(--teal); background:var(--teal-soft); font-size:12px; }
  .badge.off { color:var(--muted); background:var(--bg); }
  .readonly, .banner.bad { padding:12px 14px; border-radius:10px; color:var(--danger); background:var(--danger-soft); }
  .empty { padding:28px 8px; color:var(--muted); text-align:center; }
  .toast { position:sticky; bottom:10px; display:none; margin-top:12px; padding:11px 14px; border-radius:10px; color:#fff; background:var(--teal); }
  .toast.ok, .toast.err { display:block; }
  .toast.err { background:var(--danger); }
  [hidden] { display:none !important; }
  @media (max-width:560px) { .row2 { grid-template-columns:1fr; } .source-row { grid-template-columns:1fr; } .source-row .actions { justify-content:flex-start; } .section-head { display:block; } }
</style>
<link rel="stylesheet" href="../app-shell.css?v=20260820-2">
</head>
<body>
<div class="wrap">
  <header>
    <h1>ทะเบียนแหล่งทุน</h1>
    <p>เพิ่มและดูแลรายชื่อผู้ให้ทุนที่ใช้ตอนบันทึกทุนการศึกษา</p>
    <div class="nav"></div>
    <script src="../app-shell.js?v=20260907-1"></script>
  </header>
  <main class="academic-content">
    <section id="access-card" class="card" hidden></section>
    <div id="content" hidden>
      <section class="card">
        <div class="section-head"><div><h2 id="form-title">เพิ่มแหล่งทุน</h2><p>ชื่อเดียวกันซ้ำได้เมื่ออยู่คนละประเภท</p></div></div>
        <div class="row2">
          <div class="field"><label for="source-name">ชื่อแหล่งทุน</label><input id="source-name" type="text" maxlength="200" autocomplete="off" placeholder="เช่น มูลนิธิเด็กดี"></div>
          <div class="field"><label for="source-kind">ประเภท</label><select id="source-kind"><option>โรงเรียน</option><option>ผู้บริจาค</option><option>หน่วยงาน/มูลนิธิ</option></select></div>
        </div>
        <div class="field"><label for="source-note">หมายเหตุ</label><textarea id="source-note" maxlength="500" placeholder="ชื่อผู้ติดต่อ เบอร์โทร หรือรายละเอียดเพิ่มเติม (ถ้ามี)"></textarea></div>
        <div class="field"><label><input id="source-active" type="checkbox" checked> เปิดใช้งานสำหรับรายการรับทุนใหม่</label></div>
        <div class="actions"><button id="cancel-edit" class="ghost" type="button" hidden>ยกเลิกการแก้</button><button id="save-source" class="primary" type="button">เพิ่มแหล่งทุน</button></div>
      </section>
      <section class="card">
        <div class="section-head"><div><h2>แหล่งทุนทั้งหมด</h2><p>ปิดใช้งานแทนการลบเมื่อไม่ต้องการเลือกในรายการใหม่</p></div></div>
        <div id="source-list" class="source-list"><div class="empty">กำลังโหลด…</div></div>
      </section>
    </div>
    <div id="toast" class="toast"></div>
  </main>
</div>
<script type="module">
import { sb, requireAuth, signOut, checkDepartment, applyRestrictedMenuAccess, financeMenuKeepHrefs, fetchAllRows }
  from "../supabase-client.js?v=20260909-1";

const el = id => document.getElementById(id);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
let session = null, sources = [], editingId = null, canAdmin = false, toastTimer;

function toast(message, isError = false) {
  el("toast").textContent = message;
  el("toast").className = "toast " + (isError ? "err" : "ok");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el("toast").className = "toast"; }, 5000);
}
function friendlyError(error) {
  const message = error?.message || "เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ";
  if (message.includes("scholarship_sources_uniq") || message.includes("duplicate key")) return "มีแหล่งทุนชื่อนี้ในประเภทนี้อยู่แล้ว";
  if (message.includes("row-level security")) return "คุณไม่มีสิทธิ์ทำรายการนี้";
  if (message.includes("foreign key")) return "แหล่งทุนนี้มีประวัติรับทุนแล้ว ลบไม่ได้ · ให้ปิดใช้งานแทน";
  return message;
}
function resetForm() {
  editingId = null;
  el("form-title").textContent = "เพิ่มแหล่งทุน";
  el("source-name").value = "";
  el("source-kind").value = "โรงเรียน";
  el("source-note").value = "";
  el("source-active").checked = true;
  el("save-source").textContent = "เพิ่มแหล่งทุน";
  el("cancel-edit").hidden = true;
}
function renderSources() {
  el("source-list").innerHTML = sources.map(source => `<div class="source-row${source.active ? "" : " inactive"}" data-source-id="${escapeHtml(source.id)}">
    <div><div class="source-name">${escapeHtml(source.name)}<span class="badge${source.active ? "" : " off"}">${source.active ? "เปิดใช้" : "ปิดใช้"}</span></div>
      <span class="meta">${escapeHtml(source.kind)}${source.note ? " · " + escapeHtml(source.note) : ""}</span></div>
    <div class="actions"><button class="ghost edit-source" type="button">แก้ไข</button>${canAdmin ? '<button class="danger delete-source" type="button">ลบ</button>' : ""}</div>
  </div>`).join("") || '<div class="empty">ยังไม่มีแหล่งทุน · เพิ่มรายการแรกจากฟอร์มด้านบน</div>';
}
async function loadSources() {
  const result = await fetchAllRows(() => sb.from("scholarship_sources").select("id,name,kind,note,active,created_at,updated_at"), ["kind","name","id"]);
  if (result.error) throw new Error("โหลดแหล่งทุนไม่สำเร็จ: " + result.error.message);
  sources = result.data || [];
  renderSources();
}

el("cancel-edit").addEventListener("click", resetForm);
el("save-source").addEventListener("click", async () => {
  const name = el("source-name").value.trim();
  const kind = el("source-kind").value;
  const note = el("source-note").value.trim();
  const active = el("source-active").checked;
  if (!name) return toast("กรุณากรอกชื่อแหล่งทุน", true);
  if (!await window.crsAskConfirm({
    title:editingId ? "ยืนยันแก้แหล่งทุน" : "ยืนยันเพิ่มแหล่งทุน",
    message:`${name}\nประเภท ${kind}\n${active ? "เปิดใช้งาน" : "ปิดใช้งาน"}`,
    okLabel:editingId ? "บันทึกการแก้ไข" : "เพิ่มแหล่งทุน", danger:false
  })) return;
  const payload = { name, kind, note:note || null, active, updated_at:new Date().toISOString() };
  const request = editingId
    ? sb.from("scholarship_sources").update(payload).eq("id", editingId)
    : sb.from("scholarship_sources").insert({ ...payload, created_by:session.user.id });
  const { error } = await request;
  if (error) return toast(friendlyError(error), true);
  toast(editingId ? "บันทึกการแก้ไขแล้ว" : "เพิ่มแหล่งทุนแล้ว");
  resetForm();
  try { await loadSources(); } catch (loadError) { toast(loadError.message, true); }
});
el("source-list").addEventListener("click", async event => {
  const row = event.target.closest("[data-source-id]");
  const source = sources.find(item => item.id === row?.dataset.sourceId);
  if (!source) return;
  if (event.target.closest(".edit-source")) {
    editingId = source.id;
    el("form-title").textContent = "แก้แหล่งทุน";
    el("source-name").value = source.name;
    el("source-kind").value = source.kind;
    el("source-note").value = source.note || "";
    el("source-active").checked = source.active;
    el("save-source").textContent = "บันทึกการแก้ไข";
    el("cancel-edit").hidden = false;
    el("source-name").focus();
    return;
  }
  if (!event.target.closest(".delete-source") || !canAdmin) return;
  const { count, error:countError } = await sb.from("scholarship_txns").select("id", { count:"exact", head:true }).eq("source_id", source.id);
  if (countError) return toast("ตรวจประวัติของแหล่งทุนไม่สำเร็จ: " + friendlyError(countError), true);
  if (count) return toast(`แหล่งทุนนี้มีประวัติรับทุน ${count} รายการ ลบไม่ได้ · ให้แก้เป็นปิดใช้งานแทน`, true);
  if (!await window.crsAskConfirm({
    title:"ลบแหล่งทุน",
    message:`กำลังลบ “${source.name}” ถาวร\nรายการนี้ยังไม่มีประวัติรับทุนผูกอยู่`,
    requireText:source.name, okLabel:"ลบแหล่งทุน", danger:true
  })) return;
  const { error } = await sb.from("scholarship_sources").delete().eq("id", source.id);
  if (error) return toast(friendlyError(error), true);
  toast("ลบแหล่งทุนแล้ว");
  if (editingId === source.id) resetForm();
  try { await loadSources(); } catch (loadError) { toast(loadError.message, true); }
});

session = await requireAuth();
if (session) {
  el("btn-signout")?.addEventListener("click", event => { event.preventDefault(); signOut(); });
  try {
    const [canFinance, profileRes] = await Promise.all([
      checkDepartment("การเงิน"),
      sb.from("profiles").select("role").eq("id", session.user.id).maybeSingle()
    ]);
    canAdmin = profileRes.data?.role === "admin";
    applyRestrictedMenuAccess(canFinance, await financeMenuKeepHrefs(canFinance, session.user.id));
    if (!canFinance) {
      el("access-card").hidden = false;
      el("access-card").innerHTML = '<div class="readonly"><b>คุณไม่มีสิทธิ์จัดการแหล่งทุน</b><br>หน้านี้ใช้สำหรับผู้ที่ได้รับสิทธิ์ฝ่ายการเงินเท่านั้น</div>';
    } else {
      el("content").hidden = false;
      await loadSources();
    }
  } catch (error) {
    el("access-card").hidden = false;
    el("access-card").innerHTML = `<div class="banner bad"><b>เปิดทะเบียนแหล่งทุนไม่สำเร็จ</b><br>${escapeHtml(friendlyError(error))}</div>`;
  }
}
</script>
</body>
</html>
