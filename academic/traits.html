<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประเมินคุณลักษณะ — CRS MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a2e;--muted:#5f6b70;--line:#dfe4e3;--teal:#0f6e56;--teal-soft:#e1f5ee;--bg:#f7f8f7;--white:#ffffff;--danger:#a32d2d;--danger-soft:#fceaea;--amber:#8a5a00;--amber-soft:#fff4df}
*{box-sizing:border-box}body{margin:0;padding:16px;font:16px/1.6 Sarabun,sans-serif;color:var(--ink);background:var(--bg)}.wrap{max-width:1040px;margin:auto}header h1{font-size:24px;margin:4px 0}header p,.hint{color:var(--muted);font-size:14px}h2{font-size:20px;margin:0 0 12px}h3{font-size:18px;margin:0 0 10px}h4{font-size:16px;margin:16px 0 8px}a{color:var(--teal)}.card{min-width:0;margin-bottom:16px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--white)}.range-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.range-grid>.card{margin:0}.field{min-width:0}.field label{display:block;margin-bottom:4px;font-size:14px;font-weight:600}.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.filters{display:flex;flex-wrap:wrap;gap:12px}.filters>.field{flex:1;min-width:140px}input,select,button{font:inherit;font-size:16px}input,select{width:100%;min-height:44px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink)}button{min-height:44px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--white);color:var(--ink)}button.primary{background:var(--teal);color:var(--white);border-color:var(--teal)}button.ghost{background:var(--teal-soft);color:var(--teal)}button.danger{background:var(--danger-soft);color:var(--danger)}button:disabled{opacity:.5;cursor:wait}.range-form{margin:12px 0 20px}.range-form button{margin-top:8px}.error{color:var(--danger);font-size:14px;margin:4px 0;overflow-wrap:anywhere}.status{padding:10px 12px;border-radius:8px;background:var(--teal-soft);color:var(--teal);white-space:pre-line;overflow-wrap:anywhere}.status.warn{color:var(--amber);background:var(--amber-soft)}.status.error{color:var(--danger);background:var(--danger-soft)}.overrides{list-style:none;padding:0;margin:12px 0}.overrides li{padding:10px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.tag{display:inline-block;font-size:13px;padding:1px 6px;border-radius:6px;background:var(--teal-soft);color:var(--teal)}.tag.transfer{background:var(--amber-soft);color:var(--amber)}.table-scroll{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);min-width:130px;vertical-align:top}th{background:var(--bg)}th[scope=row]{min-width:170px;background:var(--white)}td small{display:block;color:var(--muted)}caption{text-align:left;padding:10px;font-weight:600}.skip{position:absolute;left:-10000px}.skip:focus{left:16px;top:4px;padding:10px;background:var(--white);z-index:1000}:focus-visible{outline:3px solid var(--teal);outline-offset:2px}input,select,button{scroll-margin-block:110px}input[aria-invalid=true]{border-color:var(--danger)}[hidden]{display:none!important}@media(max-width:700px){.range-grid{grid-template-columns:1fr}}@media(max-width:400px){.row2{gap:8px}.card{padding:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.trait-table{min-width:1050px}.trait-table th{width:170px}.trait-table th[scope=row],.trait-table thead th:first-child{position:sticky;left:0;z-index:1;background:var(--white);min-width:180px;max-width:210px;overflow-wrap:anywhere}.trait-table thead th:first-child{z-index:2}.trait-table select{min-width:140px;scroll-margin-inline-start:200px}.trait-table th small{display:block;font-size:13px;color:var(--muted);font-weight:400}.trait-defs{padding-left:24px}.trait-defs li{margin:6px 0;overflow-wrap:anywhere}.save-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
</style><link rel="stylesheet" href="../app-shell.css?v=20261003-1"></head>
<body><a class="skip" href="#main">ข้ามไปเนื้อหา</a><div class="wrap"><header><h1>ประเมินคุณลักษณะ</h1><p>ครูประจำชั้นให้ระดับคุณลักษณะอันพึงประสงค์รายข้อ ไม่มีระดับสรุปรวม</p><div class="nav"><a href="#" id="btn-signout">ออกจากระบบ</a></div><script src="../app-shell.js?v=20261115-1"></script></header>
<main id="main" class="academic-content">
<section class="card"><h2>เลือกห้องและช่วงประเมิน</h2><div class="filters">
<div class="field"><label for="year">ปีการศึกษา</label><select id="year" disabled></select></div>
<div class="field"><label for="room">ห้องเรียน</label><select id="room" disabled></select></div>
<div class="field"><label for="term">ช่วงประเมิน</label><select id="term" disabled><option value="1">กลางปี</option><option value="2">ปลายปี</option></select></div>
</div><p id="access" role="status">กำลังโหลดข้อมูล…</p><button id="retry" type="button" class="ghost" hidden>ลองโหลดอีกครั้ง</button></section>
<section id="editor" class="card" hidden><h2>ให้ระดับรายข้อ</h2><details><summary>คำอธิบายคุณลักษณะ</summary><ol id="definitions" class="trait-defs"></ol></details>
<p class="hint">ดีเยี่ยม 3 · ดี 2 · ผ่าน 1 · ไม่ผ่าน 0 · เลื่อนภายในตารางเพื่อดูทุกข้อ</p>
<p id="progress" role="status" aria-atomic="true"></p><div id="grid"></div><p id="special-count" class="hint"></p>
<div class="save-row"><button id="fill" class="ghost" type="button">ตั้งทุกช่องที่ยังว่างเป็น ดี</button><button id="save" class="primary" type="button" disabled>บันทึก</button></div>
</section><p id="operation" class="card status" role="status" tabindex="-1" hidden></p>
</main></div><script type="module">
import {sb,requireAuth,signOut,getProfile,checkDepartment,isAcademicHead,getAcademicYears,getActiveYear,
  fetchAllRows,isRegularStudent,isAutoPresentStudent,GRADE_ORDER} from "../supabase-client.js?v=20261114-2";
const el=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(student,trait)=>student+"|"+trait;
const roomKey=r=>r.grade_level+"|"+r.classroom;
let traits=[],placements=[],rooms=[],roster=[],original=new Map(),values=new Map(),busy=false,ready=false,manage=false,myStaffId=null;
let scope={year:"",room:"",term:"1"};
const session=await requireAuth();
el("btn-signout").addEventListener("click",async e=>{e.preventDefault();if(busy)return;lock(true);if(await discard()){values=new Map(original);await signOut();}else lock(false);});
function changes(){return [...values].filter(([k,v])=>v!==original.get(k));}
function lock(value){busy=value;document.querySelectorAll("main button,main select").forEach(n=>n.disabled=value);if(!value){el("room").disabled=!rooms.length;el("term").disabled=!ready;el("fill").disabled=!ready||!roster.length||!traits.length;el("save").disabled=!ready||!changes().length;}el("save").setAttribute("aria-busy",String(value));}
function message(text,error=false){el("operation").hidden=false;el("operation").textContent=text;el("operation").className="card status"+(error?" error":"");el("operation").setAttribute("role",error?"alert":"status");if(error)el("operation").focus();}
function updateProgress(){el("progress").textContent=`ให้ระดับครบ ${roster.filter(p=>traits.every(t=>values.has(key(p.student_id,t.id)))).length}/${roster.length} คน · ยังไม่บันทึก ${changes().length} ช่อง`;el("save").disabled=busy||!ready||!changes().length;}
function renderGrid(){
  el("definitions").innerHTML=traits.map(t=>`<li><b>${esc(t.name)}</b> · ${esc(t.description||"—")}</li>`).join("");
  el("grid").innerHTML=roster.length?`<div class="table-scroll" role="region" tabindex="0" aria-label="ตารางคุณลักษณะ เลื่อนดูทุกข้อ"><table class="trait-table"><caption>${esc(rooms.find(r=>roomKey(r)===scope.room)?.grade_level)} · ${esc(el("term").selectedOptions[0].textContent)}</caption><thead><tr><th scope="col">นักเรียน</th>${traits.map(t=>`<th scope="col">${esc(t.name)}</th>`).join("")}</tr></thead><tbody>${roster.map((p,i)=>`<tr><th scope="row">${esc(p.student?.name)}<small>${esc(p.student?.student_no)}</small></th>${traits.map((t,j)=>{const k=key(p.student_id,t.id);return `<td><select id="level-${i}-${j}" data-student="${esc(p.student_id)}" data-trait="${esc(t.id)}" aria-label="${esc(p.student?.name)} · ${esc(t.name)}"><option value="" disabled ${!values.has(k)?"selected":""}>— ยังไม่ให้ระดับ —</option>${[3,2,1,0].map(n=>`<option value="${n}" ${values.get(k)===n?"selected":""}>${["ไม่ผ่าน","ผ่าน","ดี","ดีเยี่ยม"][n]}</option>`).join("")}</select></td>`}).join("")}</tr>`).join("")}</tbody></table></div>`:'<p class="empty">ยังไม่มีนักเรียนปกติที่กำลังศึกษาในห้องนี้</p>';
  updateProgress();
}
async function loadRoom(){
  ready=false;el("editor").hidden=true;original=new Map();values=new Map();roster=[];
  const room=rooms.find(r=>roomKey(r)===el("room").value);scope={year:el("year").value,room:el("room").value,term:el("term").value};if(!room)return;
  const primary=room.grade_level.startsWith("ป.");for(const o of el("term").options)o.textContent=primary?(o.value==="1"?"กลางปี":"ปลายปี"):"ภาค "+o.value;
  const inRoom=placements.filter(p=>roomKey(p)===scope.room&&!p.student?.graduated&&!p.student?.left_school);
  roster=inRoom.filter(p=>isRegularStudent(p.student)).sort((a,b)=>String(a.student?.student_no||"").localeCompare(String(b.student?.student_no||""),"th",{numeric:true}));
  // อ่านครบห้องในคิวรีเดียว (fetchAllRows แบ่งหน้าตามจริง) ไม่ยิงทีละเด็ก/ข้อ
  if(roster.length){const result=await fetchAllRows(()=>sb.from("student_trait_results").select("id,student_id,trait_id,level").eq("year",scope.year).eq("term",scope.term).in("student_id",roster.map(p=>p.student_id)));if(result.error)throw result.error;for(const r of result.data||[])original.set(key(r.student_id,r.trait_id),r.level);}
  values=new Map(original);ready=true;el("editor").hidden=false;el("special-count").textContent=`นักเรียนพิเศษที่ระบบกำหนดให้ ${inRoom.filter(p=>isAutoPresentStudent(p.student)).length} คน · ไม่ต้องประเมินในหน้านี้`;
  el("access").textContent="ให้ระดับรายข้อแล้วบันทึกทั้งห้อง";renderGrid();
}
async function loadYear(){
  ready=false;rooms=[];placements=[];el("editor").hidden=true;el("access").textContent="กำลังโหลดห้องเรียน…";
  const year=el("year").value;
  const [p,h]=await Promise.all([
    fetchAllRows(()=>sb.from("student_year_placements").select("id,student_id,grade_level,classroom,student:student_id(id,student_no,name,graduated,left_school,student_type)").eq("year",year)),
    manage?Promise.resolve({data:[]}):sb.from("homeroom_teachers").select("grade_level,classroom").eq("year",year).eq("staff_id",myStaffId||"00000000-0000-0000-0000-000000000000")]);
  if(p.error)throw p.error;if(h.error)throw h.error;placements=p.data||[];
  const own=new Set((h.data||[]).map(roomKey));
  rooms=[...new Map([...placements,...(h.data||[])].filter(p=>(p.grade_level?.startsWith("ป.")||p.grade_level?.startsWith("ม."))&&(manage||own.has(roomKey(p)))).map(p=>[roomKey(p),{grade_level:p.grade_level,classroom:p.classroom}])).values()].sort((a,b)=>GRADE_ORDER.indexOf(a.grade_level)-GRADE_ORDER.indexOf(b.grade_level)||String(a.classroom).localeCompare(String(b.classroom),"th",{numeric:true}));
  el("room").innerHTML=rooms.map(r=>`<option value="${esc(roomKey(r))}">${esc(r.grade_level)}/${esc(r.classroom)}</option>`).join("");
  original=new Map();values=new Map();scope={year,room:el("room").value,term:el("term").value};
  if(rooms.length)await loadRoom();else el("access").textContent=manage?"ปีนี้ยังไม่มีห้องประถมหรือมัธยม":"หน้านี้สำหรับครูประจำชั้น";
}
async function runLoad(year=false){lock(true);el("retry").hidden=true;el("operation").hidden=true;try{await(year?loadYear():loadRoom());}catch(error){ready=false;el("editor").hidden=true;message("โหลดไม่สำเร็จ: "+error.message+" · กดลองโหลดอีกครั้ง",true);el("retry").hidden=false;}finally{lock(false);}}
async function discard(){return !changes().length||await window.crsAskConfirm({title:"ยังมีงานที่ไม่ได้บันทึก",message:"ออกจากช่วงนี้แล้วระดับที่แก้ไว้จะหาย ต้องการออกหรือไม่",okLabel:"ออกโดยไม่บันทึก",danger:true});}
for(const id of ["year","room","term"])el(id).addEventListener("change",async()=>{if(busy)return;lock(true);const next=el(id).value;el(id).value=scope[id];if(!await discard()){lock(false);return;}el(id).value=next;await runLoad(id==="year");});
el("retry").addEventListener("click",()=>runLoad(true));
el("grid").addEventListener("change",e=>{if(busy||!ready||!e.target.matches("select"))return;values.set(key(e.target.dataset.student,e.target.dataset.trait),Number(e.target.value));updateProgress();});
el("fill").addEventListener("click",async()=>{if(busy||!ready)return;lock(true);try{if(!await window.crsAskConfirm({title:"ตั้งช่องว่างเป็น ดี",message:"เติมระดับ ดี เฉพาะช่องที่ยังว่างของห้องนี้ แล้วตรวจทานก่อนบันทึก",okLabel:"ตั้งช่องว่างเป็น ดี"}))return;for(const p of roster)for(const t of traits){const k=key(p.student_id,t.id);if(!values.has(k))values.set(k,2);}renderGrid();}finally{lock(false);}});
el("save").addEventListener("click",async()=>{
  if(busy||!ready)return;const changed=changes();if(!changed.length)return;lock(true);
  try{const payload=changed.map(([k,level])=>{const [student_id,trait_id]=k.split("|");return {student_id,year:scope.year,term:scope.term,trait_id,level,source:"ครู"};});
    const result=await sb.from("student_trait_results").upsert(payload,{onConflict:"student_id,year,term,trait_id"}).select("student_id,trait_id,level");if(result.error)throw result.error;
    const saved=new Map((result.data||[]).map(r=>[key(r.student_id,r.trait_id),r.level]));
    for(const [k,v] of changed)if(saved.get(k)===v)original.set(k,v);
    if(changes().length)throw new Error("บันทึกได้ "+saved.size+" ช่อง ยังมีช่องค้าง กรุณาตรวจสิทธิ์แล้วลองอีกครั้ง");
    message(`บันทึกแล้ว ${changed.length} ช่อง · ${new Set(payload.map(r=>r.student_id)).size} คน`);updateProgress();
  }catch(error){message("บันทึกไม่สำเร็จ: "+error.message+" · ระดับที่แก้ยังอยู่ กดบันทึกอีกครั้งได้",true);}finally{updateProgress();lock(false);}
});
window.addEventListener("beforeunload",e=>{if(changes().length){e.preventDefault();e.returnValue="";}});
document.addEventListener("click",async e=>{const a=e.target.closest("a[href]");if(!a||a.id==="btn-signout"||a.hash||a.target==="_blank"||e.ctrlKey||e.metaKey||!changes().length)return;e.preventDefault();if(busy)return;lock(true);if(await discard()){values=new Map(original);location.href=a.href;}else lock(false);});
if(session){
  lock(true);
  try{
    const [profile,dept,head,staff,years,items]=await Promise.all([getProfile(session.user.id),checkDepartment("วิชาการ"),isAcademicHead(),sb.from("staff").select("id").eq("user_id",session.user.id).maybeSingle(),getAcademicYears(),sb.from("core_traits").select("id,name,description,seq").eq("active",true).order("seq")]);
    if(staff.error)throw staff.error;if(items.error)throw items.error;
    manage=profile?.role==="admin"||dept||head;myStaffId=staff.data?.id;traits=items.data||[];
    el("year").innerHTML=years.map(y=>`<option>${esc(y.year)}</option>`).join("");if(years.some(y=>y.year===getActiveYear()))el("year").value=getActiveYear();
    if(!traits.length)throw new Error("ยังไม่มีรายการคุณลักษณะที่เปิดใช้ กรุณาติดต่อฝ่ายวิชาการ");
    await loadYear();
  }catch(error){message("โหลดไม่สำเร็จ: "+error.message+" · ลองเปิดหน้าอีกครั้ง",true);}finally{lock(false);}
}
</script></body></html>
