<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สั่งพิเศษ (วัดตัว) — CRS MIS</title>
<style>
:root{--ink:#1f2a2e;--muted:#5f6b70;--line:#dfe4e3;--teal:#0f6e56;--teal-soft:#e1f5ee;--bg:#f7f8f7;--white:#fff;--danger:#a32d2d;--danger-soft:#fceaea;--amber:#8a5a00;--amber-soft:#fff4df}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;padding:16px;color:var(--ink);background:var(--bg);font:16px/1.6 Sarabun,sans-serif}.wrap{max-width:760px;margin:auto}header h1{font-size:22px;margin:4px 0}header p,.hint{color:var(--muted);font-size:14px}.nav{min-height:54px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{min-width:0}label{display:block;font-weight:600;margin-bottom:5px}input,select,textarea{width:100%;min-height:44px;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px}textarea{min-height:70px}button{min-height:44px;padding:9px 14px;border:0;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}.primary{color:white;background:var(--teal)}.ghost{color:var(--teal);background:var(--teal-soft)}.danger{color:var(--danger);background:var(--danger-soft)}button:disabled{opacity:.5}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs button[aria-selected=true]{color:white;background:var(--teal)}.row{padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.meta{color:var(--muted);font-size:14px}.badge{display:inline-block;background:var(--amber-soft);color:var(--amber);border-radius:20px;padding:3px 8px}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#1f2a2e88;padding:16px;z-index:50}.modal{width:min(100%,460px);background:white;padding:20px;border-radius:12px}.toast{position:fixed;bottom:14px;left:16px;right:16px;max-width:760px;margin:auto;background:var(--ink);color:white;padding:12px;border-radius:9px;z-index:80}.toast.err{background:var(--danger)}[hidden]{display:none!important}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="../app-shell.css?v=20261002-2"></head><body><div class="wrap"><header><h1>สั่งพิเศษ (วัดตัว)</h1><p>วัดขนาดชุดนักเรียนแล้วส่งรายการให้ฝ่ายการเงินสั่งร้าน</p><div class="nav"></div><script src="../app-shell.js?v=20261002-2"></script></header><main class="academic-content"><section id="access" class="card" hidden></section><div id="app" hidden><form id="measure-form" class="card"><h2 id="form-title">บันทึกการวัดตัว</h2><div class="grid"><div class="field"><label for="grade">ชั้น</label><select id="grade" required></select></div><div class="field"><label for="room">ห้อง</label><select id="room" required></select></div><div class="field"><label for="student">นักเรียน</label><select id="student" required></select></div><div class="field"><label for="item">ชนิดสินค้า</label><select id="item" required></select></div><div class="field"><label for="qty">จำนวน</label><input id="qty" type="number" min="1" max="20" step="1" value="1" required></div></div><p class="hint">ขนาดเป็นเซนติเมตร กรอกเฉพาะช่องที่เกี่ยวข้อง อย่างน้อยหนึ่งช่องหรือหมายเหตุ</p><div class="grid"><div class="field"><label for="chest">รอบอก</label><input id="chest" type="number" min="1" max="300" step="0.1" inputmode="decimal"></div><div class="field"><label for="waist">รอบเอว</label><input id="waist" type="number" min="1" max="300" step="0.1" inputmode="decimal"></div><div class="field"><label for="hip">รอบสะโพก</label><input id="hip" type="number" min="1" max="300" step="0.1" inputmode="decimal"></div><div class="field"><label for="length">ความยาว</label><input id="length" type="number" min="1" max="300" step="0.1" inputmode="decimal"></div></div><div class="field"><label for="note">หมายเหตุ</label><textarea id="note" maxlength="500"></textarea></div><div class="actions"><button class="primary" id="save" type="submit">บันทึกการวัดตัว</button><button class="ghost" id="clear" type="button" hidden>ยกเลิกการแก้ไข</button></div><p id="no-items" class="hint" hidden>ยังไม่มีรายการสั่งพิเศษ · ให้ฝ่ายการเงินเพิ่มที่หน้าคลังสินค้า</p></form><section class="card"><h2>รายการปีการศึกษา <span id="year"></span></h2><div id="tabs" class="tabs"></div><div id="orders"></div></section></div><div id="toast" class="toast" hidden></div><div id="cancel-overlay" class="overlay" hidden><form id="cancel-form" class="modal"><h2>ยกเลิกใบสั่งพิเศษ</h2><label for="cancel-reason">เหตุผลที่ยกเลิก</label><textarea id="cancel-reason" required maxlength="500"></textarea><div class="actions"><button class="ghost" type="button" id="cancel-close">กลับ</button><button class="danger" type="submit">ยืนยันยกเลิก</button></div></form></div></main></div>
<script type="module">
import{sb,requireAuth,signOut,checkDepartment,applyRestrictedMenuAccess,getAcademicYears,academicYearOf,bangkokNow,toDateStr,getStudentPlacements,activePlacements,fetchAllRows,formatSpecialOrderSize,countSpecialOrdersByStatus,GRADE_ORDER}from"../supabase-client.js?v=20261002-3";
document.getElementById("btn-signout")?.addEventListener("click", e => { e.preventDefault(); signOut(); });
const el=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const statuses=["รอสั่ง","สั่งแล้ว","ของมาแล้ว","ส่งมอบแล้ว","ยกเลิก"];let year,placements=[],items=[],orders=[],tab="รอสั่ง",editing=null,cancelling=null,timer;
function toast(message,bad=false){const node=el("toast");node.textContent=message;node.classList.toggle("err",bad);node.hidden=false;clearTimeout(timer);timer=setTimeout(()=>node.hidden=true,6000)}
function nameOf(id){return placements.find(p=>p.student_id===id)?.student?.name||"ไม่พบชื่อ"}
function roomOf(id){const p=placements.find(p=>p.student_id===id);return p?`${p.grade_level}/${p.classroom}`:"ไม่พบห้อง"}
function options(id,rows,label,value=x=>x){el(id).innerHTML=`<option value="">เลือก${label}</option>`+rows.map(x=>`<option value="${esc(value(x))}">${esc(value(x))}</option>`).join("")}
function pickRooms(){const grade=el("grade").value;options("room",[...new Set(activePlacements(placements).filter(p=>p.grade_level===grade).map(p=>p.classroom))].sort((a,b)=>a.localeCompare(b,"th",{numeric:true})),"ห้อง");pickStudents()}
function pickStudents(){const list=activePlacements(placements).filter(p=>p.grade_level===el("grade").value&&p.classroom===el("room").value).sort((a,b)=>String(a.student?.student_no||"").localeCompare(String(b.student?.student_no||""),"th",{numeric:true}));el("student").innerHTML='<option value="">เลือกนักเรียน</option>'+list.map(p=>`<option value="${p.student_id}">${esc(p.student?.student_no||"")} ${esc(p.student?.name||"")}</option>`).join("")}
function renderItemOptions(selectedId=null){const available=items.filter(i=>i.active||i.id===selectedId);el("item").innerHTML='<option value="">เลือกสินค้า</option>'+available.map(i=>`<option value="${i.id}">${esc(i.display_name)}${i.active?"":" (ปิดใช้งานแล้ว)"}</option>`).join("")}
function clear(){editing=null;renderItemOptions();el("measure-form").reset();el("form-title").textContent="บันทึกการวัดตัว";el("save").textContent="บันทึกการวัดตัว";el("clear").hidden=true;el("save").disabled=!items.some(i=>i.active);el("no-items").hidden=items.some(i=>i.active);el("grade").disabled=false;el("room").disabled=false;el("student").disabled=false;pickRooms()}
function render(){const counts=countSpecialOrdersByStatus(orders);el("tabs").innerHTML=statuses.map(s=>`<button type="button" data-tab="${s}" aria-selected="${s===tab}">${s} ${counts[s]}</button>`).join("");el("orders").innerHTML=orders.filter(o=>o.status===tab).map(o=>{const item=items.find(i=>i.id===o.item_id);return`<div class="row"><b>${esc(roomOf(o.student_id))} · ${esc(nameOf(o.student_id))}</b><div>${esc(item?.display_name||"ไม่พบสินค้า")} × ${o.qty}</div><div class="meta">${esc(formatSpecialOrderSize(o))}${o.measure_note?" · "+esc(o.measure_note):""} · วัด ${new Intl.DateTimeFormat("th-TH",{dateStyle:"medium",timeZone:"Asia/Bangkok"}).format(new Date(o.created_at))}</div>${tab==="รอสั่ง"?`<div class="actions"><button class="ghost" data-edit="${o.id}">แก้ไข</button><button class="danger" data-cancel="${o.id}">ยกเลิก</button></div>`:tab==="ของมาแล้ว"?'<span class="badge">ของมาแล้ว — รอฝ่ายการเงินส่งมอบ</span>':""}</div>`}).join("")||'<p class="hint">ไม่มีรายการในสถานะนี้</p>'}
async function load(){const [ir,or]=await Promise.all([fetchAllRows(()=>sb.from("fee_items").select("id,display_name,sort_order,active,special_order").eq("special_order",true),["sort_order","id"]),fetchAllRows(()=>sb.from("special_orders").select("*").eq("year",year),"id")]);if(ir.error||or.error)throw ir.error||or.error;items=ir.data;orders=or.data;renderItemOptions(editing?orders.find(o=>o.id===editing)?.item_id:null);el("save").disabled=!items.some(i=>i.active)&&!editing;el("no-items").hidden=items.some(i=>i.active)||!!editing;render()}
el("grade").onchange=pickRooms;el("room").onchange=pickStudents;el("clear").onclick=clear;el("tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;render()}};
el("orders").onclick=e=>{const edit=e.target.closest("[data-edit]"),cancel=e.target.closest("[data-cancel]");if(edit){const o=orders.find(x=>x.id===edit.dataset.edit);editing=o.id;const p=placements.find(p=>p.student_id===o.student_id);el("grade").value=p?.grade_level||"";pickRooms();el("room").value=p?.classroom||"";pickStudents();el("student").value=o.student_id;for(const id of ["grade","room","student"])el(id).disabled=true;renderItemOptions(o.item_id);el("item").value=o.item_id;el("save").disabled=false;el("no-items").hidden=true;el("qty").value=o.qty;for(const [id,key]of [["chest","chest_cm"],["waist","waist_cm"],["hip","hip_cm"],["length","length_cm"]])el(id).value=o[key]??"";el("note").value=o.measure_note||"";el("form-title").textContent="แก้ไขการวัดตัว";el("save").textContent="บันทึกการแก้ไข";el("clear").hidden=false;el("measure-form").scrollIntoView({behavior:"smooth"})}if(cancel){cancelling=cancel.dataset.cancel;el("cancel-reason").value="";el("cancel-overlay").hidden=false;el("cancel-reason").focus()}};
el("measure-form").onsubmit=async e=>{e.preventDefault();const sizes=Object.fromEntries([["chest","chest_cm"],["waist","waist_cm"],["hip","hip_cm"],["length","length_cm"]].map(([id,key])=>[key,el(id).value===""?null:Number(el(id).value)]));const note=el("note").value.trim();if(!Object.values(sizes).some(v=>v!=null)&&!note)return toast("กรุณากรอกขนาดอย่างน้อย 1 ช่องหรือหมายเหตุ",true);const qty=Number(el("qty").value);if(!Number.isInteger(qty)||qty<1||qty>20)return toast("จำนวนต้องอยู่ระหว่าง 1–20",true);const payload={item_id:el("item").value,qty,...sizes,measure_note:note||null};if(!editing)Object.assign(payload,{student_id:el("student").value,year});const result=editing?await sb.from("special_orders").update(payload).eq("id",editing).select("id"):await sb.from("special_orders").insert(payload).select("id");if(result.error)return toast(result.error.message,true);if(!result.data?.length)return toast("บันทึกไม่สำเร็จ กรุณาตรวจสิทธิ์",true);toast(editing?"แก้ไขแล้ว":"บันทึกการวัดตัวแล้ว");clear();await load()};
el("cancel-close").onclick=()=>el("cancel-overlay").hidden=true;el("cancel-form").onsubmit=async e=>{e.preventDefault();const reason=el("cancel-reason").value.trim();if(!reason)return toast("กรุณาระบุเหตุผลที่ยกเลิก",true);const{data,error}=await sb.from("special_orders").update({status:"ยกเลิก",cancel_reason:reason}).eq("id",cancelling).select("id");if(error||!data?.length)return toast(error?.message||"ยกเลิกไม่สำเร็จ",true);el("cancel-overlay").hidden=true;toast("ยกเลิกใบสั่งแล้ว");await load()};
try{const session=await requireAuth();if(session){const access=await checkDepartment("บริหารทั่วไป");applyRestrictedMenuAccess(access);if(!access){el("access").textContent="ไม่มีสิทธิ์บันทึกการวัดตัวสั่งพิเศษ";el("access").hidden=false}else{const years=await getAcademicYears();year=academicYearOf(toDateStr(bangkokNow()),years);if(!year)throw Error("ยังไม่มีปีการศึกษาปัจจุบัน");el("year").textContent=year;const p=await getStudentPlacements(year);if(p.error)throw p.error;placements=p.data;options("grade",[...new Set(activePlacements(placements).map(x=>x.grade_level))].sort((a,b)=>GRADE_ORDER.indexOf(a)-GRADE_ORDER.indexOf(b)),"ชั้น");pickRooms();await load();el("app").hidden=false}}}catch(error){el("access").textContent=error.message;el("access").hidden=false}
</script></body></html>
