<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกทุนการศึกษา — CRS MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2a2e; --muted:#5f6b70; --line:#dfe4e3; --teal:#0f6e56; --teal-soft:#e1f5ee; --bg:#f7f8f7; --white:#fff; --danger:#a32d2d; --danger-soft:#fceaea; --amber:#93690f; --amber-soft:#faf1dd; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; color:var(--ink); background:var(--bg); font-family:"Sarabun",sans-serif; font-size:16px; line-height:1.6; }
  .wrap { max-width:1040px; margin:0 auto; }
  header h1 { margin:4px 0; font-size:22px; }
  header p { margin:0 0 8px; color:var(--muted); font-size:14px; }
  header .nav { min-height:54px; }
  .card { margin-bottom:16px; padding:16px; overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--white); }
  .section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .section-head h2 { margin:0; font-size:18px; }
  .section-head p, .meta { margin:2px 0 0; color:var(--muted); font-size:13px; }
  .selector-grid { display:grid; grid-template-columns:1fr 1fr 1.25fr; gap:12px; }
  .work-grid { display:grid; grid-template-columns:minmax(300px,.85fr) minmax(0,1.15fr); gap:16px; align-items:start; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field { margin-bottom:14px; }
  label { display:block; margin-bottom:5px; font-size:14px; font-weight:600; }
  input[type="text"], input[type="number"], input[type="date"], select, textarea { width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:#fff; font:inherit; font-size:16px; }
  textarea { min-height:82px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--teal); outline-offset:1px; }
  input:disabled, select:disabled { color:var(--muted); background:var(--bg); opacity:1; }
  button { min-height:44px; padding:10px 14px; border:0; border-radius:9px; font:inherit; font-weight:700; cursor:pointer; }
  button.primary { width:100%; color:#fff; background:var(--teal); }
  button.danger { color:var(--danger); background:var(--danger-soft); }
  button:disabled { opacity:.55; cursor:default; }
  .balance { padding:14px; border-radius:10px; background:var(--teal-soft); }
  .balance span { display:block; color:var(--muted); font-size:13px; }
  .balance b { display:block; color:var(--teal); font-size:28px; overflow-wrap:anywhere; }
  .notice { margin-bottom:14px; padding:11px 13px; border-radius:10px; color:var(--amber); background:var(--amber-soft); font-size:14px; }
  .history { border-top:1px solid var(--line); }
  .history-row { padding:13px 0; border-bottom:1px solid var(--line); }
  .history-row.voided { opacity:.7; }
  .history-main { display:grid; grid-template-columns:110px minmax(0,1fr) auto; gap:10px; align-items:start; }
  .amount { color:var(--teal); font-weight:700; white-space:nowrap; }
  .voided .amount { color:var(--muted); text-decoration:line-through; }
  .void-box { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; margin-top:9px; }
  .readonly, .banner.bad { padding:12px 14px; border-radius:10px; color:var(--danger); background:var(--danger-soft); }
  .empty { padding:28px 8px; color:var(--muted); text-align:center; }
  .toast { position:sticky; bottom:10px; display:none; margin-top:12px; padding:11px 14px; border-radius:10px; color:#fff; background:var(--teal); }
  .toast.ok, .toast.err { display:block; }
  .toast.err { background:var(--danger); }
  [hidden] { display:none !important; }
  @media (max-width:820px) { .work-grid { grid-template-columns:1fr; } }
  @media (max-width:620px) { .selector-grid, .row2 { grid-template-columns:1fr; } .history-main { grid-template-columns:1fr auto; } .history-main > :first-child { grid-column:1/-1; } .void-box { grid-template-columns:1fr; } }
</style>
<link rel="stylesheet" href="../app-shell.css?v=20260820-2">
</head>
<body>
<div class="wrap">
  <header><h1>บันทึกทุนการศึกษา</h1><p>บันทึกรับทุนและยอดยกมา พร้อมดูยอดรวมก้อนเดียวของนักเรียน</p><div class="nav"></div><script src="../app-shell.js?v=20260907-1"></script></header>
  <main class="academic-content">
    <section id="access-card" class="card" hidden></section>
    <div id="content" hidden>
      <section class="card">
        <div class="selector-grid">
          <div class="field"><label for="year-select">ปีการศึกษา</label><select id="year-select" disabled><option value="">กำลังโหลด…</option></select></div>
          <div class="field"><label for="room-select">ห้องเรียน</label><select id="room-select" disabled><option value="">— เลือกปีก่อน —</option></select></div>
          <div class="field"><label for="student-select">นักเรียน</label><select id="student-select" disabled><option value="">— เลือกห้องก่อน —</option></select></div>
        </div>
      </section>
      <div id="student-work" class="work-grid" hidden>
        <section class="card">
          <div class="section-head"><div><h2 id="student-title">บันทึกรายการ</h2><p id="placement-note"></p></div></div>
          <div class="balance"><span>ยอดทุนคงเหลือทั้งหมด</span><b id="student-balance">0.00 บาท</b></div>
          <div style="height:14px"></div>
          <div class="field"><label for="txn-kind">ประเภทรายการ</label><select id="txn-kind"><option value="รับทุน">รับทุน</option><option value="ยอดยกมา">ยอดยกมา</option></select></div>
          <div id="opening-notice" class="notice" hidden></div>
          <div class="field"><label for="source-select">แหล่งทุน</label><select id="source-select"><option value="">กำลังโหลด…</option></select></div>
          <div class="row2">
            <div class="field"><label for="amount">จำนวนเงิน (บาท)</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00"></div>
            <div class="field"><label for="txn-date">วันที่รับทุน</label><input id="txn-date" type="date"></div>
          </div>
          <div class="field"><label for="txn-note">หมายเหตุ</label><textarea id="txn-note" maxlength="500" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"></textarea></div>
          <button id="save-txn" class="primary" type="button">บันทึกรับทุน</button>
        </section>
        <section class="card">
          <div class="section-head"><div><h2>ประวัติทุนทั้งหมด</h2><p>รายการที่ยกเลิกยังแสดงไว้พร้อมเหตุผล</p></div></div>
          <div id="history" class="history"><div class="empty">เลือกนักเรียนเพื่อดูประวัติ</div></div>
        </section>
      </div>
    </div>
    <div id="toast" class="toast"></div>
  </main>
</div>
<script type="module">
import {
  sb, requireAuth, signOut, checkDepartment, applyRestrictedMenuAccess, financeMenuKeepHrefs,
  getAcademicYears, getStudentPlacements, activePlacements, roomsFromPlacements, bangkokNow, toDateStr,
  fetchAllRows, computeScholarshipBalance, formatMoney
} from "../supabase-client.js?v=20260909-1";

const el = id => document.getElementById(id);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
const today = toDateStr(bangkokNow());
const thaiDate = value => new Intl.DateTimeFormat("th-TH", { day:"numeric", month:"short", year:"numeric", timeZone:"Asia/Bangkok" }).format(new Date(value + "T00:00:00+07:00"));
const studentCompare = (a,b) => String(a.student?.student_no || "").localeCompare(String(b.student?.student_no || ""), "th", {numeric:true}) || String(a.student?.name || "").localeCompare(String(b.student?.name || ""), "th");
let session = null, years = [], placements = [], rooms = [], sources = [], txns = [], toastTimer;

function toast(message, isError = false) {
  el("toast").textContent = message; el("toast").className = "toast " + (isError ? "err" : "ok");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el("toast").className = "toast"; }, 5500);
}
function friendlyError(error) {
  const message = error?.message || "เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ";
  if (message.includes("scholarship_txns_opening_uniq") || message.includes("duplicate key")) return "นักเรียนคนนี้มียอดยกมาแล้ว · โหลดข้อมูลล่าสุดก่อนทำรายการ";
  if (message.includes("scholarship_txns_source_link_ok")) return "รายการรับทุนต้องเลือกแหล่งทุน ส่วนยอดยกมาไม่ต้องเลือก";
  if (message.includes("scholarship_txns_amount_positive")) return "จำนวนเงินต้องมากกว่า 0 บาท";
  if (message.includes("row-level security")) return "คุณไม่มีสิทธิ์ทำรายการนี้";
  return message;
}
function selectedPlacement() {
  const year = el("year-select").value;
  const studentId = el("student-select").value;
  return placements.find(placement => placement.year === year && placement.student_id === studentId) || null;
}
function currentStudentRows() {
  const studentId = el("student-select").value;
  return txns.filter(row => row.student_id === studentId);
}
function openingRow() { return currentStudentRows().find(row => row.kind === "ยอดยกมา" && !row.voided_at) || null; }
function syncMode() {
  const opening = el("txn-kind").value === "ยอดยกมา";
  const existing = openingRow();
  el("source-select").disabled = opening;
  if (opening) el("source-select").value = "";
  el("opening-notice").hidden = !opening;
  el("opening-notice").textContent = existing
    ? `มียอดยกมาแล้วเมื่อ ${thaiDate(existing.txn_date)} · ต้องยกเลิกรายการเดิมก่อนจึงจะบันทึกใหม่ได้`
    : "ยอดยกมาสำหรับทุนที่ได้รับก่อนเริ่มใช้ระบบ · ทำได้คนละครั้งและไม่ต้องเลือกแหล่งทุน";
  el("save-txn").disabled = Boolean(opening && existing);
  el("save-txn").textContent = opening ? "บันทึกยอดยกมา" : "บันทึกรับทุน";
}
function renderHistory() {
  const rows = [...currentStudentRows()].sort((a,b) => String(b.txn_date).localeCompare(String(a.txn_date)) || String(b.created_at).localeCompare(String(a.created_at)));
  el("student-balance").textContent = formatMoney(computeScholarshipBalance(rows));
  el("history").innerHTML = rows.map(row => {
    const sourceName = row.source?.name || "—";
    return `<div class="history-row${row.voided_at ? " voided" : ""}" data-txn-id="${escapeHtml(row.id)}">
      <div class="history-main"><span>${thaiDate(row.txn_date)}</span><div><b>${escapeHtml(row.kind)}</b>${row.kind === "รับทุน" ? `<span class="meta">แหล่งทุน ${escapeHtml(sourceName)}</span>` : ""}<span class="meta">${escapeHtml(row.note || "ไม่มีหมายเหตุ")}</span>${row.voided_at ? `<span class="meta">ยกเลิกแล้ว · ${escapeHtml(row.void_reason || "ไม่ระบุเหตุผล")}</span>` : ""}</div><strong class="amount">${formatMoney(row.amount)}</strong></div>
      ${row.voided_at ? "" : `<div class="void-box"><input class="void-reason" type="text" maxlength="500" placeholder="เหตุผลที่ยกเลิกรายการ (บังคับ)"><button class="danger void-txn" type="button">ยกเลิกรายการ</button></div>`}
    </div>`;
  }).join("") || '<div class="empty">นักเรียนคนนี้ยังไม่มีประวัติทุน</div>';
  syncMode();
}
async function loadStudentHistory() {
  const studentId = el("student-select").value;
  if (!studentId) { el("student-work").hidden = true; return; }
  const result = await fetchAllRows(() => sb.from("scholarship_txns")
    .select("id,student_id,year,grade_level,classroom,kind,amount,source_id,txn_date,note,created_at,voided_at,void_reason,source:source_id(id,name,kind)")
    .eq("student_id", studentId), ["txn_date","id"]);
  if (result.error) throw new Error("โหลดประวัติทุนไม่สำเร็จ: " + result.error.message);
  txns = result.data || [];
  const placement = selectedPlacement();
  el("student-title").textContent = placement?.student?.name || "นักเรียน";
  el("placement-note").textContent = placement ? `ปี ${placement.year} · ${placement.grade_level} · ${placement.classroom}` : "";
  el("student-work").hidden = false;
  renderHistory();
}
function syncStudents() {
  const room = rooms[Number(el("room-select").value)] || null;
  const roster = room ? activePlacements(placements).filter(placement => placement.year === room.year && placement.grade_level === room.grade_level && placement.classroom === room.classroom).sort(studentCompare) : [];
  el("student-select").innerHTML = '<option value="">— เลือกนักเรียน —</option>' + roster.map(placement => `<option value="${escapeHtml(placement.student_id)}">${escapeHtml(placement.student?.student_no || "—")} · ${escapeHtml(placement.student?.name || "ไม่พบชื่อ")}</option>`).join("");
  el("student-select").disabled = !roster.length;
  el("student-work").hidden = true;
  if (roster.length === 1) { el("student-select").value = roster[0].student_id; loadStudentHistory().catch(error => toast(friendlyError(error), true)); }
}
async function loadYear() {
  const year = el("year-select").value;
  el("student-work").hidden = true;
  el("student-select").innerHTML = '<option value="">— เลือกห้องก่อน —</option>';
  el("student-select").disabled = true;
  if (!year) { el("room-select").innerHTML = '<option value="">— เลือกปีก่อน —</option>'; el("room-select").disabled = true; return; }
  const result = await getStudentPlacements(year);
  if (result.error) throw new Error("โหลดข้อมูลชั้นเรียนไม่สำเร็จ: " + result.error.message);
  placements = result.data || [];
  rooms = roomsFromPlacements(activePlacements(placements), year);
  el("room-select").innerHTML = '<option value="">— เลือกห้อง —</option>' + rooms.map((room,index) => `<option value="${index}">${escapeHtml(room.grade_level)} · ${escapeHtml(room.classroom)}</option>`).join("");
  el("room-select").disabled = !rooms.length;
  if (rooms.length === 1) { el("room-select").value = "0"; syncStudents(); }
}
async function loadContext() {
  const [yearRows, sourceRes] = await Promise.all([
    getAcademicYears(),
    fetchAllRows(() => sb.from("scholarship_sources").select("id,name,kind,active").eq("active", true), ["kind","name","id"])
  ]);
  if (sourceRes.error) throw new Error("โหลดแหล่งทุนไม่สำเร็จ: " + sourceRes.error.message);
  years = yearRows || [];
  sources = sourceRes.data || [];
  el("year-select").innerHTML = '<option value="">— เลือกปีการศึกษา —</option>' + years.map(row => `<option value="${escapeHtml(row.year)}">${escapeHtml(row.year)}</option>`).join("");
  el("year-select").disabled = !years.length;
  el("source-select").innerHTML = '<option value="">— เลือกแหล่งทุน —</option>' + sources.map(source => `<option value="${escapeHtml(source.id)}">${escapeHtml(source.name)} · ${escapeHtml(source.kind)}</option>`).join("");
  el("txn-date").value = today;
}

el("year-select").addEventListener("change", () => loadYear().catch(error => toast(friendlyError(error), true)));
el("room-select").addEventListener("change", syncStudents);
el("student-select").addEventListener("change", () => loadStudentHistory().catch(error => toast(friendlyError(error), true)));
el("txn-kind").addEventListener("change", syncMode);
el("save-txn").addEventListener("click", async () => {
  const placement = selectedPlacement();
  const kind = el("txn-kind").value;
  const amount = Math.round(Number(el("amount").value) * 100) / 100;
  const txnDate = el("txn-date").value;
  const sourceId = el("source-select").value;
  const note = el("txn-note").value.trim();
  if (!placement) return toast("กรุณาเลือกนักเรียนจากปีและห้องก่อน", true);
  if (!Number.isFinite(amount) || amount <= 0) return toast("จำนวนเงินต้องมากกว่า 0 บาท", true);
  if (!txnDate) return toast("กรุณาเลือกวันที่", true);
  if (kind === "รับทุน" && !sourceId) return toast("กรุณาเลือกแหล่งทุน", true);
  if (kind === "ยอดยกมา" && openingRow()) return toast("นักเรียนคนนี้มียอดยกมาแล้ว · ต้องยกเลิกรายการเดิมก่อน", true);
  const source = sources.find(item => item.id === sourceId);
  if (!await window.crsAskConfirm({
    title:kind === "ยอดยกมา" ? "ยืนยันยอดยกมาทุนการศึกษา" : "ยืนยันรับทุนการศึกษา",
    message:`${placement.student?.name || "นักเรียน"}\n${kind} ${formatMoney(amount)}\nปี ${placement.year} · ${placement.grade_level} · ${placement.classroom}${source ? `\nแหล่งทุน ${source.name}` : ""}`,
    okLabel:kind === "ยอดยกมา" ? "บันทึกยอดยกมา" : "บันทึกรับทุน", danger:false
  })) return;
  const payload = {
    student_id:placement.student_id,
    year:placement.year,
    grade_level:placement.grade_level,
    classroom:placement.classroom,
    kind, amount, txn_date:txnDate, note:note || null, created_by:session.user.id
  };
  if (kind === "รับทุน") payload.source_id = sourceId;
  const button = el("save-txn"); button.disabled = true; button.textContent = "กำลังบันทึก…";
  const { error } = await sb.from("scholarship_txns").insert(payload);
  button.disabled = false;
  if (error) { syncMode(); return toast(friendlyError(error), true); }
  toast(kind === "ยอดยกมา" ? "บันทึกยอดยกมาแล้ว" : "บันทึกรับทุนแล้ว");
  el("amount").value = ""; el("txn-note").value = ""; el("txn-kind").value = "รับทุน"; syncMode();
  try { await loadStudentHistory(); } catch (loadError) { toast("บันทึกแล้ว แต่โหลดประวัติล่าสุดไม่สำเร็จ: " + friendlyError(loadError), true); }
});
el("history").addEventListener("click", async event => {
  const button = event.target.closest(".void-txn"); if (!button) return;
  const rowEl = button.closest("[data-txn-id]");
  const row = txns.find(item => item.id === rowEl?.dataset.txnId);
  const reason = rowEl?.querySelector(".void-reason")?.value.trim() || "";
  if (!row || row.voided_at) return;
  if (!reason) return toast("กรุณากรอกเหตุผลที่ยกเลิกรายการ", true);
  if (!await window.crsAskConfirm({ title:"ยืนยันยกเลิกรายการทุน", message:`${row.kind} ${formatMoney(row.amount)}\nเหตุผล: ${reason}\nรายการจะยังอยู่ในประวัติแต่จะไม่ถูกนับในยอด`, okLabel:"ยกเลิกรายการ", danger:true })) return;
  button.disabled = true;
  const { error } = await sb.from("scholarship_txns").update({ voided_at:new Date().toISOString(), voided_by:session.user.id, void_reason:reason }).eq("id", row.id).is("voided_at", null);
  if (error) { button.disabled = false; return toast(friendlyError(error), true); }
  toast("ยกเลิกรายการแล้ว");
  try { await loadStudentHistory(); } catch (loadError) { toast("ยกเลิกแล้ว แต่โหลดประวัติล่าสุดไม่สำเร็จ: " + friendlyError(loadError), true); }
});

session = await requireAuth();
if (session) {
  el("btn-signout")?.addEventListener("click", event => { event.preventDefault(); signOut(); });
  try {
    const canFinance = await checkDepartment("การเงิน");
    applyRestrictedMenuAccess(canFinance, await financeMenuKeepHrefs(canFinance, session.user.id));
    if (!canFinance) {
      el("access-card").hidden = false;
      el("access-card").innerHTML = '<div class="readonly"><b>คุณไม่มีสิทธิ์บันทึกทุนการศึกษา</b><br>หน้านี้ใช้สำหรับผู้ที่ได้รับสิทธิ์ฝ่ายการเงินเท่านั้น</div>';
    } else { el("content").hidden = false; await loadContext(); }
  } catch (error) {
    el("access-card").hidden = false;
    el("access-card").innerHTML = `<div class="banner bad"><b>เปิดหน้าบันทึกทุนไม่สำเร็จ</b><br>${escapeHtml(friendlyError(error))}</div>`;
  }
}
</script>
</body>
</html>
